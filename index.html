<style>
/* Một màn hình canvas đen, cảnh ASCII bằng chữ số, HUD kiểu terminal ở các góc */
:root{
  --bg:#000;
  --fg:#c9d1d9;
  --dim:#6b7280;
  --rose:#ff6b8a;
  --amber:#ffb347;
  --bar:#0b0d12;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;font:12px/1.5 var(--mono);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#timer{top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));color:var(--rose)}
/* nút loa: cùng kiểu chữ terminal */
#snd{position:fixed;top:calc(32px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;
  font:12px/1.4 var(--mono);color:var(--amber);background:rgba(11,13,18,.7);border:1px solid #2b3445;border-radius:3px;
  padding:4px 9px;cursor:pointer;animation:hudIn 1.5s ease 1.5s both}
#snd:hover{border-color:#4a5468}
#snd:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
#snd.on{color:#8dffb0;border-color:#2f5a40}
#info{left:max(16px,env(safe-area-inset-left,0px));top:calc(86px + env(safe-area-inset-top,0px));color:var(--dim)}
/* trình phát nhạc: khung trong mờ ở góc trên trái, đĩa than xoay khi đang phát */
#player{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;
  width:min(300px,calc(100vw - 32px));box-sizing:border-box;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 10px;border-radius:12px;background:rgba(14,18,30,.42);border:1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:11px/1.35 var(--mono);color:var(--fg);animation:hudIn 1.5s ease 1.5s both}
.disc{width:46px;height:46px;border-radius:50%;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 10px rgba(0,0,0,.6);
  background:radial-gradient(circle,#000 0 5%,#b3263a 5.5% 17%,#e9c46a 17.5% 19%,transparent 19.5%),
    repeating-radial-gradient(circle,#141414 0 1.1px,#262626 1.5px 2.3px);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.2) 12%,transparent 18% 58%,rgba(255,255,255,.12) 62%,transparent 68%)}
.disc.playing{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#player .meta{min-width:0}
#player .np{color:#56607a;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .title{display:block;max-width:100%;padding:0;border:0;background:none;color:#ffe7a0;cursor:pointer;text-align:left;
  font:700 16px/1.2 "Dancing Script",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .title::after{content:" ▾";font:10px var(--mono);color:#56607a}
#player .sub{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .ctl{display:flex;gap:4px}
#player .ctl button{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);
  color:var(--fg);font:12px/1 var(--mono);cursor:pointer;padding:0}
#player .ctl button:hover,#player .title:hover{border-color:rgba(255,255,255,.3);color:#fff}
#player button:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
#pList{position:absolute;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px;list-style:none;border-radius:10px;
  background:rgba(14,18,30,.88);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  max-height:50vh;overflow:auto}
#pList button{display:grid;grid-template-columns:22px 1fr;gap:6px;width:100%;padding:5px 6px;border:0;border-radius:6px;background:none;
  color:var(--fg);font:11px/1.35 var(--mono);text-align:left;cursor:pointer}
#pList button:hover{background:rgba(255,255,255,.06)}
#pList button[aria-selected="true"]{color:#ffe7a0}
#pList .i{color:#56607a}
#pList .s{grid-column:2;color:var(--dim);font-size:10px}
/* màn hình vừa: khung phát hẹp lại để không chạm lời chúc */
@media (max-width:900px){
  #player{width:min(250px,calc(100vw - 32px))}
  #hint{display:none}
}
/* điện thoại: khung phát rộng hết chiều ngang, nút âm thanh nằm ngay dưới, lời chúc dời xuống dưới hai thứ này */
@media (max-width:640px){
  #player{width:calc(100vw - 32px)}
  #timer{display:none}
  #snd{top:calc(84px + env(safe-area-inset-top,0px));right:auto;left:max(16px,env(safe-area-inset-left,0px))}
}
#info b{color:var(--fg);font-weight:400}
#info .row{display:flex;gap:22px;flex-wrap:wrap}
#bar{left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;background:var(--bar);border-top:1px solid #1c2230;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:var(--dim)}
#bar .run{color:var(--amber)}
#bar .by{color:#4a5468}
#hint{bottom:calc(38px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));color:#3d4555}
@media (max-width:820px){#hint{display:none}#info{display:none}}
/* bốn góc khung kiểu cửa sổ terminal */
.corner{position:fixed;width:18px;height:18px;border:0 solid #2b3445;pointer-events:none}
#k1{top:calc(4px + env(safe-area-inset-top,0px));left:max(4px,env(safe-area-inset-left,0px));border-top-width:1px;border-left-width:1px}
#k2{top:calc(4px + env(safe-area-inset-top,0px));right:max(4px,env(safe-area-inset-right,0px));border-top-width:1px;border-right-width:1px}
#k3{bottom:calc(34px + env(safe-area-inset-bottom,0px));left:max(4px,env(safe-area-inset-left,0px));border-bottom-width:1px;border-left-width:1px}
#k4{bottom:calc(34px + env(safe-area-inset-bottom,0px));right:max(4px,env(safe-area-inset-right,0px));border-bottom-width:1px;border-right-width:1px}
#hint::before{content:"› ";color:#56607a}
/* lúc mới vào cả trang tối, chữ góc màn hình hiện sau */
.hud,.corner{animation:hudIn 1.5s ease 1.5s both}
@keyframes hudIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.hud,.corner,#snd,#player{animation:none}.disc.playing{animation-play-state:paused}}
</style>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const DIG='0123456789';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=s=>s[Math.random()*s.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=p=>1-Math.pow(1-p,3);
const FONT='"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace';
// trình tự xuất hiện (giây): trời đen → sao, trăng, mây → tuyết dâng → thân cây → lá → đèn → ngôi sao → hoa hồng → lời chúc, pháo hoa → ông già Noel
const T={stars:.8,moon:1.2,clouds:.6,snow:1.5,trunk:4,leaf:5,lights:8.8,star:10.4,rose:11.6,gift:14.4,greet:15.2,fw:16,santa:12.6,walkIn:21};
// lời nhắn trên tờ giấy (sửa nội dung ở đây)
const MSG={
  gift:{title:'Món quà nhỏ cho bạn',body:'Chúc bạn một mùa Giáng Sinh thật ấm áp, luôn có những người thương yêu ở bên, và một năm mới gặp thật nhiều may mắn, bình an và hạnh phúc.'},
  // mỗi hộp quà ông già Noel thả xuống mang một lời chúc khác
  wishes:[
    {title:'Quà từ ông già Noel',body:'Chúc bạn luôn khoẻ mạnh, nụ cười lúc nào cũng rạng rỡ như ánh đèn trên cây thông đêm nay.'},
    {title:'Một hộp bình an',body:'Gửi bạn một hộp bình an: mong những ngày sắp tới thật nhẹ nhàng, mọi lo lắng đều tan như tuyết dưới nắng.'},
    {title:'Một hộp may mắn',body:'Chúc bạn năm mới gặp toàn điều may: học hành, công việc thuận lợi, gặp đúng người và đúng lúc.'},
    {title:'Một hộp yêu thương',body:'Mong bạn luôn được yêu thương và có những người thân ở bên mỗi khi trời trở lạnh.'},
    {title:'Một hộp ước mơ',body:'Chúc mọi ước mơ của bạn dù lớn hay nhỏ đều từng bước thành sự thật. Cố lên nhé!'},
    {title:'Một hộp ấm áp',body:'Gửi bạn chút ấm áp của mùa Giáng Sinh: một tách cacao nóng, một bài hát hay và một giấc ngủ thật ngon.'},
    {title:'Một hộp niềm vui',body:'Chúc bạn mỗi ngày đều có một lý do nhỏ để mỉm cười. Merry Christmas!'},
  ],
  santa:{title:'Ho ho ho! Merry Christmas!',body:'Ông già Noel ghé qua gửi lời chúc: Giáng Sinh an lành, ấm áp bên gia đình. Mong mọi điều ước của bạn đều thành sự thật!'}
};

let W,H,dpr,fs,cw,ch,cols,rows,cells=[],stars=[],sparkles=[],flakes=[],fws=[],parts=[],roses=[];
let start=0,lastFw=0,fwCount=0,nextFw=0,greetT=0,geo={};
const glow={};

function makeGlow(color){
  const s=64,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,color);gr.addColorStop(.25,color.replace(/[\d.]+\)$/,'0.35)'));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;
}
glow.red=makeGlow('rgba(255,60,80,1)');glow.gold=makeGlow('rgba(255,200,80,1)');
glow.blue=makeGlow('rgba(90,160,255,1)');glow.pink=makeGlow('rgba(255,120,200,1)');
glow.white=makeGlow('rgba(255,255,255,1)');glow.green=makeGlow('rgba(120,255,160,1)');
glow.moon=makeGlow('rgba(255,236,190,1)');
let clouds=[];
let gridMap=new Map(),ledges=[],paper=null,meteor=null,nextMeteor=0,wish=null,shake=-9,lightMode=0,bits=[],tNow=0;
let wind=0,lastPtr=null,lastShake=-9,motionAsked=false,modeNow=null;
let skyBg=null,milky=null,moonDim=1,refl=[],uiBottom=0;
// đèn trên cây có đang sáng không (dùng để hắt màu đèn xuống lá xung quanh)
function lightOn(s,t){
  if(s.type==='orn')return Math.sin(t*2.2+s.tw)>-.3;
  if(lightMode===2)return true;
  if(lightMode===1)return Math.sin(t*7-s.y*.06)>.3;
  return Math.sin(t*3+s.tw)>.1;
}
// mây dựng từ chữ số: hợp của vài khối tròn, lõi là số, mép là dấu chấm
function makeCloud(w,h){
  const blobs=[],n=Math.round(rnd(5,7));
  // hàng chân mây
  for(let i=0;i<n;i++){
    const u=i/(n-1),bump=Math.sin(u*Math.PI);
    blobs.push({x:(.14+.72*u)*w,y:h*(.74-.12*bump),r:h*(.2+.16*bump)*rnd(.9,1.1)});
  }
  // các cụm phồng phía trên
  const m=Math.round(rnd(2,4));
  for(let i=0;i<m;i++){
    const u=(i+.5)/m;
    blobs.push({x:(.25+.5*u+rnd(-.05,.05))*w,y:h*rnd(.4,.5),r:h*rnd(.26,.34)*(1-Math.abs(u-.5)*.6)});
  }
  const cells=[];
  for(let y=0;y<h;y+=ch)for(let x=0;x<w;x+=cw){
    let best=0;
    for(const b of blobs){const d=1-Math.hypot(x-b.x,(y-b.y)*1.15)/b.r;if(d>best)best=d}
    if(best<=0||y>h*.86)continue;
    if(best<.25&&Math.random()<.45)continue;
    const top=1-y/h,edge=best<.18;
    // mặt trên và phía phải (hướng trăng) sáng hơn
    cells.push({x,y,ch:edge?pick('.:·'):pick('0689023'),l:edge?44:clamp(38+top*40+best*12+(x/w-.5)*14,36,90),edge});
  }
  return cells;
}
function drawMoon(t){
  const m=geo.moon;if(!m)return;
  // trăng hiện dần và nhô lên nhẹ
  const k=clamp((t-T.moon)/3,0,1);if(k<=0)return;
  const my=m.y+(1-easeOut(k))*m.R*1.5;
  // moonDim < 1 khi có mây trôi ngang qua trăng
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=(.4+.05*Math.sin(t*.8))*k*moonDim;
  ctx.drawImage(glow.moon,m.x-m.R*4,my-m.R*4,m.R*8,m.R*8);
  // quầng trăng: vòng sáng mờ như đêm có hơi sương
  const halo=ctx.createRadialGradient(m.x,my,m.R*2,m.x,my,m.R*3.1);
  halo.addColorStop(0,'rgba(210,225,255,0)');halo.addColorStop(.55,'rgba(210,225,255,.075)');halo.addColorStop(1,'rgba(210,225,255,0)');
  ctx.globalAlpha=k*moonDim;ctx.fillStyle=halo;ctx.beginPath();ctx.arc(m.x,my,m.R*3.1,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  let cur='';
  for(const c of m.cells){
    if(Math.random()<.003)c.ch=pick(c.dark?'0689':'8890');
    const col=`hsl(${c.dark?42:48},${c.dark?40:85}%,${c.l}%)`;
    if(col!==cur){ctx.fillStyle=col;cur=col}
    ctx.globalAlpha=k*(.45+.55*moonDim);ctx.fillText(c.ch,m.x+c.x,my+c.y);
  }
}
function buildMoonCells(m){
  m.cells=[];
  for(let y=-m.R;y<=m.R;y+=ch)for(let x=-m.R;x<=m.R;x+=cw){
    const cx=x+cw/2,cy=y-ch*.35,d=Math.hypot(cx,cy)/m.R;
    if(d>1)continue;
    let dark=false;
    for(const k of m.craters){if(Math.hypot(cx/m.R-Math.cos(k.a)*k.d,cy/m.R-Math.sin(k.a)*k.d)<k.r)dark=true}
    const lit=clamp(.6-(cx+cy)/(m.R*2.6),0,1);
    const l=dark?42+lit*14:clamp(60+lit*30-d*d*8,55,94);
    m.cells.push({x,y,ch:pick(dark?'0689':'8890'),l:Math.round(l),dark});
  }
}

/* ---------- hình học cảnh ---------- */
// cây có 4 tầng; mép dưới mỗi tầng rủ xuống thành từng chùm cành
function inTier(i,x,y){
  const g=geo,dx=Math.abs(x-g.cx);
  const top=g.treeTop+i*g.TH*0.19,bot=g.treeTop+g.TH*(0.34+i*0.22);
  if(y<top)return false;
  const hwMax=g.HW*(0.4+0.6*i/3),k=(y-top)/(bot-top);
  const hw=hwMax*Math.min(k,1)*(1+0.07*Math.sin(y*0.35+i));
  if(dx>hw)return false;
  const r=hw>0?dx/hw:0;
  const sag=g.TH*0.035*(1-r*r)+g.TH*0.022*Math.abs(Math.sin(r*Math.PI*(2.5+i)));
  return y<=bot+sag;
}
// tầng đứng trước nhất chứa điểm (tầng trên phủ lên tầng dưới), -1 nếu ngoài cây
function tierOf(x,y){
  const g=geo;if(y<g.treeTop||y>g.treeBot+g.TH*0.08)return -1;
  for(let i=0;i<4;i++)if(inTier(i,x,y))return i;
  return -1;
}
function inTree(x,y){return tierOf(x,y)>=0?1:0}
function inStar(x,y){
  const g=geo,dx=x-g.sx,dy=(y-g.sy);
  const d=Math.hypot(dx,dy);if(d>g.SR)return false;
  let a=Math.atan2(dy,dx)+Math.PI/2; // đỉnh hướng lên
  a=((a%(Math.PI*2/5))+Math.PI*2/5)%(Math.PI*2/5);
  const t=Math.abs(a-Math.PI/5)/(Math.PI/5); // 1 ở đỉnh, 0 ở hõm
  const rr=g.SR*(0.42+0.58*t);
  return d<=rr;
}
function groundTop(x){
  const g=geo,u=(x-g.cx)/W;
  return g.groundY - H*0.012*Math.exp(-u*u*14) + Math.sin(x*0.012)*H*0.005 + Math.sin(x*0.031+1.3)*H*0.003;
}

function buildScene(){
  const g=geo;
  g.cx=W/2;
  g.TH=Math.min(H*0.52,W*1.1);
  g.treeTop=H*0.29;
  g.treeBot=g.treeTop+g.TH;
  g.HW=Math.min(W*0.42,g.TH*0.48);
  g.SR=g.TH*0.1;
  g.starPopped=0;
  g.greetSp=Array.from({length:8},()=>({u:rnd(-.04,1.04),v:rnd(-1.05,.15),sp:rnd(1.2,2.6),ph:rnd(0,7)}));
  g.starSp=Array.from({length:12},()=>{const a=rnd(0,TAU),r=rnd(.9,2.3);return{dx:Math.cos(a)*r,dy:Math.sin(a)*r,L:rnd(.18,.5),sp:rnd(1.4,3.4),ph:rnd(0,7)}});
  g.sx=g.cx;g.sy=g.treeTop-g.SR*0.25;
  g.groundY=H*0.875;
  g.bottom=H-30;
  const MR=clamp(Math.min(W,H)*0.075,32,88);
  g.moonX=W-Math.max(MR*1.8,W*0.14);

  const map=new Map(),under=[];
  // ô bị thứ khác đè lên (tuyết dưới cây, lá dưới hộp quà...) vẫn được giữ lại
  // và chỉ ẩn đi khi thứ đè lên bắt đầu mọc, nên tuyết và lá luôn kín, không bị lỗ
  const put=(c,r,o)=>{
    o.c=c;o.r=r;const k=r*cols+c,prev=map.get(k);
    if(prev&&!o.type.startsWith('snow')){prev.coveredBy=o;under.push(prev)}
    map.set(k,o);
  };

  // tuyết
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    const gt=groundTop(x);
    if(y<gt||y>g.bottom)continue;
    const depth=(y-gt)/(g.bottom-gt);
    if(y-gt<ch*1.2&&Math.random()<0.18)continue; // mép tuyết hơi lởm chởm
    // vệt sáng của trăng in trên tuyết
    const L=rnd(70,90)-depth*14+8*Math.exp(-(((x-g.moonX)/(W*.12))**2)), sp=Math.random()<0.04;
    put(c,r,{type:sp?'snowsp':'snow',ch:pick(sp?'*+':'08690860'),h:205,s:rnd(10,35),l:L,
      delay:T.snow+(1-depth)*1.2+rnd(0,.2),tw:rnd(0,7)});
  }
  // rặng thông xa ở chân trời, màu xanh tối, phía sau mọi thứ
  for(let px=rnd(0,W/30);px<W;px+=rnd(W/40,W/22)){
    const gt=groundTop(px),h=ch*rnd(2.5,6.5)*(W<600?.8:1);
    for(let r=Math.floor((gt-h)/ch);r<=Math.floor(gt/ch);r++)for(let c=Math.floor((px-h*.45)/cw);c<=Math.ceil((px+h*.45)/cw);c++){
      if(r<0||c<0||c>=cols)continue;
      const x=(c+.5)*cw,y=(r+.5)*ch;
      if(y>=groundTop(x))continue;
      const k=(y-(gt-h))/h;if(k<0)continue;
      if(Math.abs(x-px)>h*.38*k*(1+.12*Math.sin(y*.5)))continue;
      if(map.has(r*cols+c))continue;
      put(c,r,{type:'ridge',ch:pick(DIG),h:rnd(150,175),s:30,l:rnd(10,16)+(x>px?4:0),delay:T.snow+1.2+rnd(0,.9)});
    }
  }
  // thân cây
  const tw=g.TH*0.05;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(Math.abs(x-g.cx)<tw&&y>g.treeBot-g.TH*0.06&&y<groundTop(x)+ch*1.5){
      const sh=(x-g.cx)/tw;
      const span=groundTop(x)+ch*1.5-(g.treeBot-g.TH*0.06);
      put(c,r,{type:'trunk',ch:pick('1|7|'),h:28,s:70,l:30+sh*-10+rnd(-4,4),delay:T.trunk+clamp((groundTop(x)+ch*1.5-y)/span,0,1)*1.0+rnd(0,.08)});
    }
  }
  // cây thông
  const orn=[],ornR=Math.max(ch*1.05,g.TH*0.017);
  for(let i=0;i<Math.round(g.TH*g.HW/1400)+14;i++){
    for(let tries=0;tries<30;tries++){
      const x=g.cx+rnd(-g.HW,g.HW),y=rnd(g.treeTop+g.TH*0.12,g.treeBot);
      if(inTree(x,y)&&inTree(x+ornR*2,y)&&inTree(x-ornR*2,y)&&orn.every(o=>Math.hypot(o.x-x,(o.y-y)*1.4)>ornR*3.2)){
        orn.push({x,y,col:pick(['red','red','gold','blue','pink','red']),ph:rnd(0,7)});break;
      }
    }
  }
  const ornCol={red:[352,90,55],gold:[45,100,58],blue:[212,95,62],pink:[325,90,66]};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(!inTree(x,y))continue;
    const dx=x-g.cx,u=(y-g.treeTop)/g.TH;
    const edge=!inTree(x+cw*1.2,y)||!inTree(x-cw*1.2,y)||!inTree(x,y+ch*1.1);
    const delay=T.leaf+(1-u)*3.4+rnd(0,.18);
    let o=null;
    for(const b of orn){
      if(Math.hypot(b.x-x,(b.y-y)*1.6)<ornR){
        const k=ornCol[b.col];o={type:'orn',ch:pick('0896'),h:k[0],s:k[1],l:k[2],g:b.col,tw:b.ph,delay};
        // điểm bóng trắng ở góc trên trái quả châu
        if(Math.hypot(x-(b.x-ornR*.4),(y-(b.y-ornR*.25))*1.6)<cw*.75){o.hl=1;o.ch='0'}
        break;
      }
      // sợi móc treo mảnh phía trên quả châu
      if(Math.abs(x-b.x)<cw*.5&&y<b.y-ornR/1.6&&y>b.y-ornR/1.6-ch*.95){o={type:'hanger',ch:'\'',h:45,s:45,l:50,delay};break}
    }
    if(!o){
      // dây kim tuyến võng thành từng vòng cung giữa các cành
      let onG=false;
      for(let k=0;k<5&&!onG;k++){
        let s=((x-g.cx)/(g.TH*.17)+k*.5)%1;if(s<0)s+=1;
        const yk=g.treeTop+g.TH*(.2+k*.16)+(x-g.cx)*.1+g.TH*.03*Math.sin(Math.PI*s);
        if(Math.abs(y-yk)<ch*.55)onG=true;
      }
      if(onG&&!edge){
        o={type:'garland',ch:pick(DIG),h:44,s:95,l:rnd(55,68),delay,tw:rnd(0,7)};
      }else if(Math.random()<0.035&&!edge){
        o={type:'light',ch:pick('*+o'),g:pick(['gold','white','blue','pink','green']),h:0,s:0,l:0,tw:rnd(0,7),delay};
      }else{
        // ánh trăng chiếu từ phía phải: nửa phải sáng hơn, mép phải được viền sáng
        const shade=dx/g.HW*7+(1-u)*-4;
        // tầng trên đổ bóng xuống tầng dưới; mép dưới mỗi tầng (chùm cành) sáng hơn
        const ti=tierOf(x,y);let tierSh=0;
        if(ti>0&&inTier(ti-1,x,y-ch*2.2))tierSh=-9;
        else if(ti>=0&&!inTier(ti,x,y+ch*1.1))tierSh=6;
        o={type:'tree',ch:pick(DIG),h:rnd(118,148),s:rnd(55,75),l:clamp((edge?40:24)+shade+tierSh+rnd(-6,6),10,54),delay};
        if(edge&&dx>0&&!inTree(x+cw*1.2,y))o.moonEdge=1;
      }
    }
    // đèn, trang trí và dây kim tuyến: lúc đầu là lá xanh, sau đó mới sáng lên từ dưới lên
    o.u=u;
    o.lightAt=T.lights+(1-u)*1.3+rnd(0,.3);
    o.leaf=`hsl(${rnd(118,148)|0},65%,${edge?40:26}%)`;
    put(c,r,o);
  }
  // ngôi sao
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(inStar(x,y)){
      const d=Math.hypot(x-g.sx,y-g.sy)/g.SR;
      put(c,r,{type:'star',u:0,ch:d<.35?'8':d<.65?pick('80'):'*',h:48,s:100,l:72-d*18,delay:T.star+d*.4+rnd(0,.15),tw:rnd(0,7)});
    }
  }
  // hộp quà bằng chữ số, bên phải gốc cây
  {
    const gw=Math.max(cw*11,g.TH*0.15),gh=Math.max(ch*3.5,gw*0.6);
    // đặt ngay ngoài mép tán cây bên phải; người tuyết sẽ đứng đối xứng bên trái
    const gxC=Math.min(g.cx+g.HW*1.12+gw*.35,W-gw*.6-cw);
    const x0=gxC-gw/2,x1=x0+gw,y1=groundTop(gxC)+ch*1.1,y0=y1-gh,mx=(x0+x1)/2,my=(y0+y1)/2;
    g.gift={x0:x0-cw,x1:x1+cw,y0:y0-ch*2.4,top:y0,y1,mx,open:0,bx0:x0,w:gw,n:-1,pi:0,msg:MSG.gift,gone:reduce?0:1,drop:0,under:[]}; // hộp đầu tiên cũng do ông già Noel thả xuống
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=(c+.5)*cw,y=(r+.5)*ch,rib=Math.abs(x-mx)<cw*.9;
      let o=null;
      if(x>x0&&x<x1&&y>y0&&y<y1){
        o=(rib||Math.abs(y-my)<ch*.55)?{type:'gift',ch:pick('8098'),h:46,s:95,l:62,rib:1}
          :{type:'gift',ch:pick(DIG),h:354,s:88,l:clamp(54-(x-mx)/gw*14+rnd(-4,4),42,64)};
      }else if(x>x0-cw&&x<x1+cw&&y>y0-ch*1.15&&y<=y0){
        o=rib?{type:'gift',ch:pick('8098'),h:46,s:95,l:68,lid:1,rib:1}:{type:'gift',ch:pick(DIG),h:354,s:90,l:62,lid:1};
      }else if(y>y0-ch*2.3&&y<=y0-ch*1.15){
        const ax=Math.abs(x-mx);
        if(ax<cw*.6||(ax>cw&&ax<cw*2.8))o={type:'bow',ch:ax<cw*.6?'@':pick('oO0'),h:46,s:100,l:64,lid:1,tw:rnd(0,7)};
      }
      if(o){o.delay=reduce?T.gift+clamp((y1-y)/(gh+ch*2.3),0,1)+rnd(0,.1):0;put(c,r,o)}
    }
  }
  // người tuyết bên trái gốc cây, đối xứng với hộp quà; một người nhỏ đi tới đắp nó
  {
    const sxm=g.cx-(g.gift.bx0-g.cx)-g.gift.w/2,gb=groundTop(sxm)+ch*.7;
    const r1=Math.max(ch*1.9,g.TH*.058),r2=r1*.72,r3=r1*.52;
    const c1=gb-r1,c2=c1-(r1+r2)*.78,c3=c2-(r2+r3)*.82;
    const sp=clamp(W/12,45,110),start=-cw*3,stand=Math.max(cw*2,sxm-r1-cw*3.5);
    const t0=T.walkIn,t1=t0+(stand-start)/sp,tb0=t1+.4,tb1=tb0+3.4,t2=tb1+1.6;
    g.snowman={x:sxm,x0:sxm-r1-cw*4,x1:sxm+r1+cw*4,bottom:gb,top:c3-r3-ch*1.8,c2,
      acc:0,poke:-9,pokes:[],melt:0,rebuild:0,doze:0,nextDoze:0,lastZ:0,autoMelt:0,hitT:-9,throwT:-9,nextThrow:0,face:1};
    g.walker={start,stand,sp,t0,t1,tb0,tb1,t2,t3:t2+(stand-start)/sp+.5};
    const topY=c3-r3-ch*1.8;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=(c+.5)*cw,y=(r+.5)*ch,dx=x-sxm;let o=null;
      const inB=(cy,rr)=>Math.hypot(dx,(y-cy)*1.05)<=rr;
      if(y>c3-r3-ch*1.7&&y<c3-r3*.75&&Math.abs(dx)<r3*.75)o={ch:pick(DIG),h:354,s:70,l:42,part:'hat'};          // mũ len đỏ
      else if(Math.abs(y-(c3-r3*.75))<ch*.5&&Math.abs(dx)<r3*1.25)o={ch:pick('8098'),h:46,s:90,l:62,part:'brim'}; // vành mũ vàng
      else if(inB(c3,r3)){
        if(Math.abs(y-(c3-r3*.15))<ch*.5&&Math.abs(Math.abs(dx)-r3*.4)<cw*.6)o={ch:'0',h:220,s:10,l:12,part:'eye'}; // mắt
        else if(Math.abs(y-(c3+r3*.2))<ch*.5&&dx>cw*.2&&dx<r3*.95)o={ch:'>',h:28,s:100,l:55,part:'nose'};          // mũi cà rốt
        else o={ch:pick('08690'),h:205,s:25,l:clamp(90-dx/r3*6,78,97),part:'head'};
      }
      else if(Math.abs(y-(c3+r3*.95))<ch*.55&&Math.abs(dx)<r3*1.05)o={ch:pick(DIG),h:354,s:85,l:52,part:'scarf'};  // khăn quàng
      else if(inB(c2,r2)){
        if(Math.abs(dx)<cw*.6&&(Math.abs(y-(c2-r2*.3))<ch*.5||Math.abs(y-(c2+r2*.3))<ch*.5))o={ch:'0',h:220,s:10,l:14,part:'btn'}; // cúc áo
        else o={ch:pick('08690'),h:205,s:25,l:clamp(88-dx/r2*6,76,96),part:'body'};
      }
      else if(inB(c1,r1))o={ch:pick('08690'),h:205,s:25,l:clamp(86-dx/r1*6,72,95),part:'body'};
      else for(const sd of[-1,1]){                                                                     // tay que
        const k=(sd*dx-r2*.85)/cw;
        if(k>0&&k<3.5&&Math.abs((y-c2)+k*ch*.55)<ch*.5)o={ch:sd<0?'\\':'/',h:28,s:55,l:40,part:'arm',side:sd,k};
      }
      if(o){o.type='snowman';o.delay=tb0+clamp((gb-y)/(gb-topY),0,1)*(tb1-tb0-.5);put(c,r,o)}
    }
  }
  // hoa hồng quanh gốc cây
  roses=[];
  const nR=0, spots=[]; // anh bỏ hoa hồng
  for(let i=0;i<nR;i++){
    for(let tries=0;tries<80;tries++){
      const side=i%2?1:-1;
      const spread=rnd(0.06,0.47)*W;
      const x=g.cx+side*spread;
      const gt=groundTop(x);
      const y=rnd(gt-ch*0.6,gt+(g.bottom-gt)*0.45);
      const persp=0.85+0.3*clamp((y-gt)/(g.bottom-gt),0,1);
      const rad=Math.max(ch*1.7,g.TH*rnd(.042,.056))*persp*(W<600?0.85:1);
      if(Math.abs(x-g.cx)<tw*1.5+rad*1.4)continue;
      if(x<rad*2||x>W-rad*2)continue;
      if(x>g.gift.x0-rad*1.8&&x<g.gift.x1+rad*1.8)continue; // chừa chỗ cho hộp quà
      if(x>g.snowman.x0-rad*1.8&&x<g.snowman.x1+rad*1.8)continue; // và người tuyết
      if(spots.every(s=>Math.hypot(s.x-x,(s.y-y)*1.3)>s.rad+rad*1.9)){
        spots.push({x,y,rad,hue:pick([350,350,355,340,0,330]),i});break;
      }
    }
  }
  spots.sort((a,b)=>a.y-b.y);
  spots.forEach((s,k)=>{
    const d0=T.rose+k*0.2;
    const rose={cells:[],end:0};roses.push(rose);
    for(let r=Math.floor((s.y-s.rad*2.4)/ch);r<=Math.ceil((s.y+s.rad*2.4)/ch);r++){
      for(let c=Math.floor((s.x-s.rad*3)/cw);c<=Math.ceil((s.x+s.rad*3)/cw);c++){
        if(r<0||c<0||r>=rows||c>=cols)continue;
        const x=(c+.5)*cw,y=(r+.5)*ch,dx=x-s.x,dy=y-s.y;
        // đầu hoa
        const ex=dx/(s.rad*1.25),ey=dy/s.rad,d=Math.hypot(ex,ey);
        let o=null;
        if(d<=1){
          const ang=Math.atan2(ey,ex);
          const spiral=Math.sin(ang*1+d*11);
          const L=d>0.82?72:d<0.2?30:clamp(48+spiral*20-ey*8,24,76);
          o={type:'rose',ch:pick(d<0.3?'@&8':'0689'),h:s.hue,s:90,l:L};
        }else{
          // một nụ hồng nhỏ chưa nở ở bên cạnh, có cuống xanh
          const bsd=s.i%2?1:-1,bx=dx-bsd*s.rad*1.95,by=dy+s.rad*.15;
          if(Math.hypot(bx/(s.rad*.32),by/(s.rad*.42))<=1)o={type:'rose',ch:pick('08'),h:s.hue,s:85,l:clamp(42-by/s.rad*20,30,58),bud:1};
          else if(Math.abs(bx)<cw*.55&&by>s.rad*.35&&by<s.rad*1.1)o={type:'leaf',ch:'|',h:125,s:55,l:34};
          // hai lá
          if(!o)for(const sd of[-1,1]){
            const lx=dx-sd*s.rad*1.35,ly=dy-s.rad*0.75;
            const a=sd*0.5,rx=lx*Math.cos(a)+ly*Math.sin(a),ry=-lx*Math.sin(a)+ly*Math.cos(a);
            if((rx/(s.rad*1.05))**2+(ry/(s.rad*0.42))**2<=1){
              o={type:'leaf',ch:pick(DIG),h:rnd(115,140),s:65,l:rnd(26,42)+(-ry/s.rad)*8};
            }
          }
        }
        if(o){o.delay=d0+clamp((s.y+s.rad*1.3-y)/(s.rad*2.6),0,1)*1.1+rnd(0,.12);o.rose=rose;put(c,r,o);rose.cells.push(o)}
        else if(d<1.45){const k=r*cols+c,e=map.get(k);if(e&&e.type.startsWith('snow')){e.hideAt=d0;under.push(e);map.delete(k)}} // khoảng tối quanh bông hoa, chỉ mở ra khi hoa bắt đầu nở
      }
    }
  });

  for(const o of under)if(o.hideAt===undefined)o.hideAt=o.coveredBy.delay+.12;
  // tuyết nằm dưới hộp quà: hiện lại khi hộp biến mất
  g.gift.under=under.filter(o=>o.coveredBy&&(o.coveredBy.type==='gift'||o.coveredBy.type==='bow'));
  for(const o of g.gift.under){o.hide0=o.hideAt;if(g.gift.gone)o.hideAt=undefined}
  cells=[...map.values(),...under];
  for(const o of cells){
    o.x=o.c*cw;o.y=(o.r+0.82)*ch;
    o.dur=rnd(0.9,1.6);
    o.sx0=o.x+rnd(-.5,.5)*cw;o.sy0=o.y+ch*rnd(1.5,3.5);o.dur=rnd(.45,.8); // mọc / dâng từ dưới lên
    o.end=o.delay+o.dur;
    o.col=`hsl(${o.h|0},${o.s|0}%,${o.l|0}%)`;
    if(o.rose)o.rose.end=Math.max(o.rose.end,o.end);
    if(o.type==='tree'){
      o.wcol=`hsl(${o.h|0},${o.s|0}%,${Math.min(72,o.l+20)|0}%)`;           // màu khi sóng sáng chạy qua
      if(o.moonEdge)o.mcol=`hsl(${(o.h+25)|0},38%,${Math.min(68,o.l+18)|0}%)`; // viền ánh trăng
    }
  }
  // đèn và quả châu làm sáng nhẹ những lá sát bên: lá vẫn xanh, chỉ sáng hơn và hơi ngả ấm
  for(const s of cells){
    if(s.type!=='light'&&s.type!=='orn')continue;
    for(let dr=-1;dr<=1;dr++)for(let dc=-2;dc<=2;dc++){
      const o=map.get((s.r+dr)*cols+s.c+dc);if(!o||o.type!=='tree')continue;
      const d=Math.hypot(dc*cw,dr*ch)/ch;if(d>1.3)continue;
      if(o.tint&&o.tint.d<=d)continue;
      o.tint={src:s,d,col:`hsl(${(o.h-12)|0},${Math.min(80,o.s+8)|0}%,${clamp(o.l+14-d*4,28,58)|0}%)`};
    }
  }
  // những thứ in bóng xuống mặt tuyết bóng loáng
  refl=cells.filter(o=>{
    if(o.type==='gift'||o.type==='bow'){o.mb=g.gift.y1-ch*.15;return true}
    if(o.type==='snowman'){o.mb=g.snowman.bottom-ch*.1;return true}
    if(o.type==='trunk'){o.mb=groundTop(g.cx)+ch*1.3;return true}
    return false;
  });
  // mép trên các tầng lá: chỗ tuyết rơi xuống sẽ đọng lại
  gridMap=map;ledges=[];g.prints=[];
  const TT={tree:1,garland:1,orn:1,light:1,star:1};
  for(const o of cells){
    // tuyết cũng đọng trên nắp hộp quà, nơ, mũ và vai người tuyết
    if(o.type==='gift'||o.type==='bow'||o.type==='snowman'){
      if(o.ch==='>'||o.ch==='\\'||o.ch==='/')continue;
      const up=map.get((o.r-1)*cols+o.c);
      if(!up||(up.type!==o.type&&!(o.type==='gift'&&up.type==='bow'))){o.ledge=true;ledges.push(o)}
      continue;
    }
    if(o.u===undefined||o.type==='star')continue;
    const up=map.get((o.r-1)*cols+o.c);
    if(!up||!TT[up.type]){o.ledge=true;ledges.push(o)}
  }
  // vẽ theo thứ tự để giảm đổi màu
  cells.sort((a,b)=>a.r-b.r);
  $('iDig').textContent=cells.length.toLocaleString('en-US');
}

/* ---------- người tuyết biết tương tác ---------- */
// bộ phụ kiện: mũ / vành mũ / khăn quàng; mỗi lần chạm đổi một bộ
const hs=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
const ACCS=[
  {hat:hs(354,70,42),brim:hs(46,90,62),scarf:hs(354,85,52)},   // mũ len đỏ, vành vàng
  {hat:hs(140,55,34),brim:hs(0,0,95),scarf:hs(140,50,44)},     // mũ xanh lá, vành trắng
  {hat:hs(215,70,46),brim:hs(0,0,95),scarf:hs(195,80,56)},     // mũ xanh dương
  {hat:hs(280,45,42),brim:hs(46,90,62),scarf:hs(325,75,62)},   // mũ tím, khăn hồng

];
const SAY=['Hi!','Merry Christmas!','Brrr... lạnh ghê','Hehe ^^','Ho ho ho!','Giáng Sinh vui vẻ!'];
let lastBoom=-9;
const smVis=()=>santa&&santa.x<W&&santa.x>-santa.E*2;
function hitSnowman(x,y){
  const s=geo.snowman,wk=geo.walker;
  return !!s&&!s.melt&&tNow>wk.tb1&&x>s.x0+cw*2&&x<s.x1-cw*2&&y>s.top&&y<s.bottom+ch*.5;
}
function pokeSnowman(){
  const s=geo.snowman,t=tNow;
  s.pokes=s.pokes.filter(p=>t-p<2.5);s.pokes.push(t);
  for(let i=0;i<8;i++)bits.push({x:s.x+rnd(-1,1)*cw*3,y:s.top+ch*rnd(1,3),vx:rnd(-60,60),vy:rnd(-110,-40),ch:pick('*.'),col:'hsl(205,40%,94%)',age:0,life:rnd(.5,1)});
  if(s.pokes.length>=6&&t>geo.walker.t3){meltSnowman();return}
  s.poke=t;s.acc=(s.acc+1)%ACCS.length;s.doze=0;s.nextDoze=t+rnd(30,50);
  const n=s.pokes.length;
  s.say={txt:n===4?'Ui da, nhột quá!':n===5?'Tan mất bây giờ!':pick(SAY),t0:t};
  sfx('poke',s.x);
}
function meltSnowman(auto){
  const s=geo.snowman,wk=geo.walker,t=tNow;
  s.melt=t;s.pokes=[];s.say={txt:auto?'Nóng quá... tan mất!':'Ôi... tan mất rồi!',t0:t};s.doze=0;
  // lần nào cũng là một người khác tới đắp lại
  const h=pick(HATS);wk.hat=h[0];wk.hatC=h[1];wk.coat=pick(COATS);
  sfx('melt',s.x);
  // vài giây sau bạn nhỏ quay lại đắp lại từ đầu
  const travel=(wk.stand-wk.start)/wk.sp,t0=t+4.5,t1=t0+travel,tb0=t1+.4,tb1=tb0+3.4,t2=tb1+1.6,shift=tb0-wk.tb0;
  Object.assign(wk,{t0,t1,tb0,tb1,t2,t3:t2+travel+.5,lastF:-1});
  s.rebuild=tb0;s.autoMelt=tb1+rnd(18,22);
  for(const o of cells)if(o.type==='snowman'){o.cap=false;o.d2=o.delay+shift}
}
function smUpdate(t,dt){
  const s=geo.snowman;if(!s)return;
  if(s.melt&&t>=s.rebuild){
    s.melt=0;s.acc=0;s.say=null;
    for(const o of cells)if(o.type==='snowman'){o.delay=o.d2;o.end=o.delay+o.dur}
  }
  if(!s.nextDoze)s.nextDoze=geo.walker.t3+rnd(25,40);
  // khoảng 20 giây sau khi đắp xong thì người tuyết tự tan, rồi có người tới đắp lại
  const wk=geo.walker;
  if(!s.autoMelt)s.autoMelt=wk.tb1+rnd(18,22);
  if(!s.melt&&!reduce&&t>s.autoMelt&&t>wk.t3)meltSnowman(true);
  // tham gia trận ném tuyết đang diễn ra
  if(!s.melt&&t>wk.tb1&&t>s.nextThrow){
    const foes=crowd.filter(q=>q.fight&&q.state==='fight');
    if(foes.length){
      const q=pick(foes),face=q.x<s.x?-1:1;
      s.throwT=t;s.face=face;
      throwBall({x:s.x+face*cw*4,face},q,t,s.c2-ch*.6);
      if(Math.random()<.3)s.say={txt:pick(['Đỡ này!','Hehe!','Ăn tuyết nè!']),t0:t};
    }
    s.nextThrow=t+rnd(1.6,3.2);
  }
  // thỉnh thoảng ngủ gật vài giây
  if(!s.melt&&!s.doze&&t>s.nextDoze&&t-s.poke>5&&!smVis()){s.doze=t;s.nextDoze=t+rnd(40,70)}
  if(s.doze&&(t-s.doze>8||smVis()))s.doze=0;
  // mắt: vui khi được chạm, ngước nhìn ông già Noel, ngủ gật, giật mình khi pháo nổ
  s.eyeDx=0;s.eyeDy=0;
  if(t-s.hitT<.7)s.eye='O';
  else if(t-s.poke<2.2)s.eye='^';
  else if(smVis()){s.eye='o';s.eyeDy=-ch*.18;s.eyeDx=(santa.x<s.x?-1:1)*cw*.18}
  else if(s.doze)s.eye='-';
  else if(t-lastBoom<.45)s.eye='O';
  else s.eye='0';
  s.wave=!s.melt&&(t-s.poke<2.2||smVis())?Math.floor(t/.22)%2:-1;
  if(s.melt&&Math.random()<dt*10){
    const m=clamp((t-s.melt)/2.4,0,1);if(m<1)bits.push({x:s.x+rnd(-1,1)*cw*4,y:s.bottom-(s.bottom-s.top)*(1-m)*rnd(.2,.9),vx:rnd(-15,15),vy:rnd(0,30),ch:pick('.,'),col:'hsl(200,50%,80%)',age:0,life:rnd(.6,1.1)});
  }
}
function smLook(o,t,x,y,c,col,a){
  const s=geo.snowman,A=ACCS[s.acc];
  if(o.part==='hat')col=A.hat;else if(o.part==='brim')col=A.brim;else if(o.part==='scarf')col=A.scarf;
  if(s.melt){
    const m=clamp((t-s.melt)/2.4,0,1),e=m*m;
    if(o.part==='body'||o.part==='head'){y=s.bottom-(s.bottom-y)*(1-.84*m);x=s.x+(x-s.x)*(1+.55*m);if(o.part==='head')a*=1-.6*m}
    else{y+=(s.bottom-ch*.3-y)*e;x+=(x-s.x)*.4*m;if(o.part==='eye'||o.part==='btn')a*=1-m}
    return[x,y,c,col,a];
  }
  if(o.part==='eye'){c=s.eye;x+=s.eyeDx;y+=s.eyeDy}
  else if(o.part==='arm'&&t-s.throwT<.35&&o.side===s.face){y-=o.k*ch*.45;x-=o.side*o.k*cw*.3;c='|'} // vung tay ném
  else if(o.part==='arm'&&o.side===1&&s.wave===1){y-=o.k*ch*.45;x-=o.k*cw*.3;c='|'}
  return[x,y,c,col,a];
}
function smDraw(t){
  const s=geo.snowman;if(!s)return;
  ctx.textAlign='center';
  // chữ z bay lên khi ngủ gật
  if(s.doze){
    for(let i=0;i<3;i++){
      const e=((t-s.doze)*.5+i/3)%1;
      ctx.globalAlpha=Math.sin(e*Math.PI)*.85;ctx.fillStyle='#b9c8ff';
      ctx.fillText(i%2?'z':'Z',s.x+cw*(1.5+e*3),s.top+ch*.5-e*ch*4);
    }
  }
  // lời nói nổi lên trên đầu rồi tan
  if(s.say){
    const e=(t-s.say.t0)/2;
    if(e>1)s.say=null;
    else{
      const yy=s.top-ch*(1.2+e*1.4);
      ctx.globalAlpha=Math.min(1,(1-e)*2.5);
      ctx.fillStyle='rgba(8,12,28,.7)';const w=ctx.measureText(s.say.txt).width+cw*2;
      ctx.fillRect(s.x-w/2,yy-ch*.95,w,ch*1.35);
      ctx.fillStyle='#ffe9b0';ctx.fillText(s.say.txt,s.x,yy);
    }
  }
  ctx.textAlign='left';ctx.globalAlpha=1;
}

/* ---------- người qua đường: thỉnh thoảng 1–3 người đi dạo hoặc ném tuyết ---------- */
let crowd=[],balls=[],nextCrowd=0;
// ?crowd=fight hoặc ?crowd=walk để xem thử ngay
const CROWD_TEST=new URLSearchParams(location.search).get('crowd');
const HATS=[['^','#e5484d'],['^','#2fbf71'],['n','#f0b429'],['^','#4a8ff0'],['*','#f472b6'],['n','#e5484d'],['=','#c084fc']];
const COATS=['#4a8ff0','#e5484d','#2fbf71','#f0b429','#c084fc','#22d3ee','#fb923c'];
function person(x,dir,o){
  const h=pick(HATS);
  return Object.assign({x,dir,face:dir,sp:clamp(W/12,45,110)*rnd(.85,1.15),hat:h[0],hatC:h[1],coat:pick(COATS),ph:rnd(0,1),state:'walk',hitT:-9,throwT:-9,nextThrow:0,lastF:-1},o);
}
function spawnCrowd(t,walkOnly){
  let n=1+Math.floor(Math.random()*3);const E=cw*4;
  if(CROWD_TEST==='fight')n=Math.max(n,2);
  if(!walkOnly&&(CROWD_TEST?CROWD_TEST==='fight':n>=2&&Math.random()<.6)){
    // trận ném tuyết: hai phe đứng hai bên cây, ném qua ném lại rồi về
    const end=t+rnd(9,13),L=rnd(.1,.24)*W,R=W-rnd(.1,.24)*W;
    const sides=n===2?[0,1]:pick([[0,1,0],[0,1,1]]);
    sides.forEach((s,i)=>{
      const extra=sides.slice(0,i).filter(v=>v===s).length*W*.07;
      const stand=s?Math.min(W-cw*3,R+extra):Math.max(cw*3,L-extra);
      crowd.push(person(s?W+E+i*cw*3:-E-i*cw*3,s?-1:1,{side:s,stand,fight:1,end}));
    });
  }else{
    // đi dạo ngang qua, đi cùng chiều thành nhóm nhỏ
    const dir=Math.random()<.5?1:-1,base=clamp(W/12,45,110)*rnd(.75,1.05);
    for(let i=0;i<n;i++)crowd.push(person(dir>0?-E-i*cw*rnd(2.5,5):W+E+i*cw*rnd(2.5,5),dir,{sp:base*rnd(.96,1.04)}));
  }
}
function throwBall(p,q,t,y0o){
  p.throwT=t;if(p.state)p.face=q.x<p.x?-1:1;
  const sm=q===geo.snowman;
  const x0=p.x+p.face*cw*1.2,y0=y0o??groundTop(p.x)+ch*.55-ch*2.6,hit=Math.random()<.7;
  const tx=hit?q.x:q.x+(Math.random()<.5?-1:1)*rnd(2,6)*cw,ty=hit?(sm?q.c2:groundTop(q.x)+ch*.55-ch*1.6):groundTop(tx)+ch*.5;
  const dx=Math.abs(tx-x0);
  balls.push({x0,y0,tx,ty,t0:t,dur:clamp(dx/(W*.55),.6,1.3),hgt:clamp(dx*.22,ch*3,H*.12),q:hit?q:null});
  sfx('throw',x0);
}
function drawPerson(p,t){
  const moving=p.state==='walk'||p.state==='leave',f=Math.floor((t+p.ph)/.2)%2,feet=groundTop(p.x)+ch*.55,bob=moving&&f?-1:0;
  const hit=t-p.hitT<.6,thr=t-p.throwT<.3,windup=!moving&&p.nextThrow>t&&p.nextThrow-t<.4;
  let arms='/|\\',head='o',x=p.x;
  if(hit){arms='\\|/';head='O';x+=Math.sin((t-p.hitT)*40)*cw*.15}
  else if(thr)arms=p.face>0?'\\|-':'-|/';
  else if(windup)arms=p.face>0?'\\|_':'_|/';
  else if(p.state==='opening')arms='-|-';
  else if(p.state==='cheer')arms=f?'\\|/':'_|_';
  else if(!moving)arms='/|\\';
  const legs=moving?(f?'/ \\':' | '):'/ \\';
  if(moving&&f!==p.lastF){
    p.lastF=f;const pr=geo.prints;pr.push({x:p.x+(f?cw*.35:-cw*.35),y:groundTop(p.x)+ch*.85,t0:t});
    if(pr.length>400)pr.splice(0,pr.length-400);
  }
  ctx.globalAlpha=1;
  [[p.hat,p.hatC],[head,'#f2c79b'],[arms,p.coat],[legs,'#8a95b0']].forEach(([s,col],i)=>{ctx.fillStyle=col;ctx.fillText(s,x-s.length*cw/2,feet-(3-i)*ch+bob)});
}
function drawCrowd(t,dt){
  if(reduce)return;
  // hộp quà nằm đó 10 giây không ai mở: một người chạy ra mở giùm
  const G=geo.gift;
  if(G&&G.landT&&G.n===0&&!G.open&&!G.gone&&!G.drop&&!paper&&t-G.landT>10){
    G.landT=0;
    crowd.push(person(W+cw*4,-1,{runner:1,sp:clamp(W/5,100,240),stand:Math.min(W-cw*2,G.x1+cw*1.4)}));
  }
  if(!crowd.some(p=>!p.runner)&&!balls.length){
    if(nextCrowd===Infinity)nextCrowd=t+rnd(3,7);
    else if(t>nextCrowd){spawnCrowd(t);nextCrowd=Infinity}
  }
  // trong lúc đang ném tuyết, thỉnh thoảng có thêm người đi ngang xem
  else if(t>T.greet&&!crowd.some(p=>!p.fight&&!p.runner)&&Math.random()<dt*.15)spawnCrowd(t,true);
  ctx.textAlign='left';
  for(let i=crowd.length-1;i>=0;i--){
    const p=crowd[i];
    if(p.state==='walk'){
      p.x+=p.dir*p.sp*dt;
      if(p.runner&&p.x<=p.stand){p.x=p.stand;p.state='opening';p.st=t}
      if(p.fight&&(p.dir>0?p.x>=p.stand:p.x<=p.stand)){p.x=p.stand;p.state='fight';p.face=p.side?-1:1;p.nextThrow=t+rnd(.5,1.8)}
    }else if(p.state==='fight'){
      if(t>p.end&&t-p.throwT>.4){p.state='leave';p.dir=p.face=p.side?1:-1}
      else if(t>p.nextThrow){
        const foes=crowd.filter(q=>q.fight&&q.side!==p.side&&q.state==='fight');
        const S=geo.snowman;
        // thỉnh thoảng ném "trả đũa" người tuyết
        if(S&&!S.melt&&t>geo.walker.tb1&&Math.random()<.3)throwBall(p,S,t);
        else if(foes.length)throwBall(p,pick(foes),t);
        p.nextThrow=t+rnd(1.1,2.4);
      }
    }else if(p.state==='opening'){
      if(t-p.st>.5){if(!G.open&&!G.gone&&!G.drop&&!paper)openGift(true);p.state='cheer';p.st=t}
    }else if(p.state==='cheer'){

    }else p.x+=p.dir*p.sp*1.15*dt;
    const gone=p.dir>0?p.x>W+cw*8:p.x<-cw*8;
    if(gone&&(p.state==='leave'||!p.fight)){crowd.splice(i,1);continue}
    drawPerson(p,t);
  }
  // quả cầu tuyết bay theo đường vòng cung, vỡ tung khi trúng
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i],u=(t-b.t0)/b.dur;
    if(u>=1){
      balls.splice(i,1);
      if(b.q){b.q.hitT=t;if(b.q===geo.snowman&&!b.q.melt&&Math.random()<.4)b.q.say={txt:pick(['Á!','Ui!','Lạnh quá!']),t0:t}}
      for(let k=0;k<9;k++)bits.push({x:b.tx,y:b.ty,vx:rnd(-70,70),vy:rnd(-110,-30),ch:pick('*.0'),col:'hsl(205,40%,94%)',age:0,life:rnd(.5,1)});
      sfx('splat',b.tx);continue;
    }
    const at=v=>[b.x0+(b.tx-b.x0)*v,b.y0+(b.ty-b.y0)*v-Math.sin(Math.PI*v)*b.hgt];
    ctx.fillStyle='hsl(205,40%,92%)';
    for(let k=3;k>=1;k--){const v=u-k*.035;if(v<0)continue;const [x,y]=at(v);ctx.globalAlpha=.5-k*.13;ctx.fillText('.',x-cw/2,y)}
    const [x,y]=at(u);ctx.globalAlpha=1;ctx.fillStyle='#f4f8ff';ctx.fillText('0',x-cw/2,y);
  }
}

function giftUpdate(t,dt){

/* ---------- vòng lặp ---------- */
let prev=performance.now(),fpsS=60,fpsT=0;
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  fpsS=fpsS*0.94+(1/Math.max(dt,1e-3))*0.06;
  const t=(now-start)/1000;tNow=t;

  }
  ctx.textBaseline='alphabetic';

  // sao nền

    if(t<s.at)continue;

    ctx.globalAlpha=a;ctx.fillStyle=s.col;

  }

  for(const s of sparkles){
    if(t<s.at)continue;
    const k=Math.pow(0.5+0.5*Math.sin(t*s.sp+s.ph),3),L=s.L*(0.5+k);
    ctx.globalAlpha=(0.25+0.6*k)*Math.min(1,(t-s.at)/1.5);

    const gr=ctx.createLinearGradient(s.x-L,0,s.x+L,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;ctx.fillRect(s.x-L,s.y-.5,L*2,1);
    const gv=ctx.createLinearGradient(0,s.y-L,0,s.y+L);
    gv.addColorStop(0,'rgba(255,255,255,0)');gv.addColorStop(.5,'rgba(255,255,255,.9)');gv.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gv;ctx.fillRect(s.x-.5,s.y-L,1,L*2);
  }
  ctx.globalCompositeOperation='source-over';

  // trăng và mây trôi
  drawMoon(t);
  for(const c of clouds){
    if(!reduce)c.x+=c.v*dt;
    if(c.x>W+20)c.x=-c.w-rnd(0,200);
    // lúc mở trang mây trôi từ ngoài mép trái vào chỗ của mình
    const k=reduce?1:clamp((t-T.clouds)/c.in,0,1),e=easeOut(k);
    if(k<=0)continue;
    const cx=c.x-(1-e)*(c.x+c.w+40);
    c.cxNow=cx;c.kNow=k;
    let cur='';
    for(const q of c.cells){
      if(Math.random()<.002&&!q.edge)q.ch=pick('0689023');
      const col=`hsl(220,${q.edge?10:18}%,${q.l}%)`;
      if(col!==cur){ctx.fillStyle=col;cur=col}
      ctx.globalAlpha=c.a*(q.edge?.6:1)*Math.min(1,k*2);ctx.fillText(q.ch,cx+q.x,c.y+q.y);
    }
  }
  ctx.globalAlpha=1;
  // mây che trăng: trăng và ánh trăng trên cảnh tối đi
  {
    const m=geo.moon;let cov=0;
    if(m)for(const c of clouds){
      if(!c.kNow)continue;

    sfx('meteor',meteor.x);
  }
  if(meteor){
    const m=meteor;m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;

      ctx.strokeStyle=gr;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.lineWidth=1;
      ctx.globalAlpha=fade;ctx.drawImage(glow.white,m.x-12,m.y-12,24,24);
      ctx.fillStyle='#fff6d8';
      for(let j=1;j<6;j++){ctx.globalAlpha=fade*(1-j/6)*.8;ctx.fillText(DIG[(j*3+(t*20|0))%10],m.x-m.vx*.04*j-cw/2,m.y-m.vy*.04*j+fs*.35)}
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

      ctx.fillStyle=gr;dx?ctx.fillRect(sx-L,sy-1,L*2,2):ctx.fillRect(sx-1,sy-L,2,L*2);
    }
    for(const s of geo.starSp){
      const tw=Math.pow(Math.max(0,Math.sin(t*s.sp+s.ph)),6);if(tw<.05)continue;
      const x=sx+s.dx*SR,y=sy+s.dy*SR,l=s.L*tw*SR;
      ctx.globalAlpha=k*tw;ctx.fillStyle='#fff7d6';
      ctx.fillRect(x-l,y-.6,l*2,1.2);ctx.fillRect(x-.6,y-l,1.2,l*2);
      ctx.drawImage(glow.white,x-l*.7,y-l*.7,l*1.4,l*1.4);
    }
    ctx.lineWidth=1;
  }
  ctx.globalCompositeOperation='source-over';

  // tuyết rơi
  if(t>T.snow){
    ctx.fillStyle='#fff';
    let curL=-1;
    for(const f of flakes){
      if(f.L!==curL){curL=f.L;ctx.font=`${curL===2?Math.round(fs*1.7):curL===0?Math.max(7,Math.round(fs*.75)):fs}px ${FONT}`}
      if(!reduce){f.y+=f.v*dt;f.x+=Math.sin(t*f.sw+f.ph)*(10+f.L*8)*dt+wind*(.2+f.L*.25)*dt}
      if(f.y>H){f.y=-10;f.x=rnd(0,W)}
      if(f.x<-12)f.x=W+10;else if(f.x>W+12)f.x=-10;
      if(f.L===2){ctx.globalAlpha=f.a*.22*Math.min(1,(t-T.snow)/2);ctx.drawImage(glow.white,f.x-fs*.3,f.y-fs*1.5,fs*2.2,fs*2.2)}
      // bông tuyết lớp giữa chạm mép cành thì đọng lại
      if(t>T.lights&&f.L===1){
        const c=Math.floor(f.x/cw),r=Math.round(f.y/ch-.82);let hit=null;
        for(const dr of[0,1]){const o=gridMap.get((r+dr)*cols+c);if(o&&o.ledge&&!o.cap&&t>o.end){hit=o;break}}
        if(hit){hit.cap=true;hit.capCh=pick('08*.');f.y=-10;f.x=rnd(0,W);continue}
      }
      ctx.globalAlpha=f.a*Math.min(1,(t-T.snow)/2);ctx.fillText(f.ch,f.x,f.y);
    }
    ctx.font=`${fs}px ${FONT}`;

  }

  const gT=(t-T.greet)/1.5;

    ctx.textAlign='center';
    // trên điện thoại lời chúc nằm dưới khung phát nhạc và nút âm thanh
    const base=Math.max(big+22,H*0.08,uiBottom?uiBottom+8+big*.9:0);

    ctx.fillText(modeNow.title,W/2,base);

    {
      const tw=ctx.measureText(modeNow.title).width,x0=W/2-tw/2,sp=((t*.28)%1.5)-.25;

        gx.addColorStop(0,'rgba(255,255,255,0)');gx.addColorStop(a0,'rgba(255,255,255,0)');
        gx.addColorStop(a1,`rgba(255,252,235,${.85*a})`);

      }
      for(const s of geo.greetSp){
        const k=Math.pow(Math.max(0,Math.sin(t*s.sp+s.ph)),8);if(k<.05)continue;
        const x=x0+s.u*tw,y=base+s.v*big,l=big*.18*k;
        ctx.globalAlpha=a*k;ctx.fillStyle='#fff6d8';
        ctx.fillRect(x-l,y-.5,l*2,1);ctx.fillRect(x-.5,y-l,1,l*2);
      }
      ctx.restore();ctx.textAlign='center';
    }
    const sub=Math.max(16,Math.round(big*0.62)),sy=base+sub*1.15;
    ctx.font=`600 ${sub}px "Dancing Script",Georgia,serif`;
    ctx.shadowColor='rgba(255,110,150,.85)';ctx.shadowBlur=14;
    const g2=ctx.createLinearGradient(0,sy-sub,0,sy);
    g2.addColorStop(0,'#ffd6e0');g2.addColorStop(1,'#ff6b8a');

    ctx.shadowBlur=0;

    const cd=modeNow;

    ctx.fillStyle=cd.dense>1?'#ffd36b':'#e0c48a';ctx.globalAlpha=a;
    ctx.shadowColor='#000';ctx.shadowBlur=6;

  }

  if(wish){

      ctx.textAlign='center';ctx.font=`700 ${sz}px "Dancing Script",Georgia,serif`;
      ctx.globalAlpha=Math.min(1,age/.4)*Math.min(1,(3.5-age)/.8);
      ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=12;ctx.fillStyle='#ffe7a0';

  }
  // 10 giây cuối trước Giao Thừa: số đếm ngược lớn giữa trời
  if(modeNow.kind==='ny'&&modeNow.left<=10&&modeNow.left>0){

  ctx.globalAlpha=1;
  if(paper)drawPaper(t);
  ctx.globalAlpha=1;

  soundFrame(t);

  // HUD
  if(now-fpsT>200){
    fpsT=now;
    modeNow=getMode();
    $('timer').textContent='t '+(t<10?'0':'')+t.toFixed(2)+'s';
    $('iFw').textContent=fwCount;
    $('iRun').textContent=(t<T.greet?'building':'running')+' · '+Math.round(fpsS)+' fps';
  }
  requestAnimationFrame(frame);
}

  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.005);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

}

  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t0);fl.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(.02,dur*.2));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(dest);s.start(t0,Math.random());s.stop(t0+dur+.05);
}

function sfx(name,x){
  if(!live())return;
  const n=AC.currentTime,o=out(x);
  switch(name){
    case 'launch':noise(n,.7,{f0:400,f1:2400,q:2,vol:.05,dest:o});break;                       // pháo bay lên
    case 'boom':                                                                                  // pháo nổ và lách tách
      tone(110,n,.45,.22,'sine',o,38);noise(n,.6,{type:'lowpass',f0:900,f1:120,vol:.16,dest:o});
      for(let i=0;i<10;i++)noise(n+.35+Math.random()*1.1,.04,{type:'highpass',f0:3500,vol:.035,dest:o});
      break;
    case 'meteor':noise(n,.8,{type:'highpass',f0:6000,f1:1400,vol:.035,dest:o});break;           // sao băng
    case 'wish':[84,88,91,96].forEach((m,i)=>bell(mf(m),n+i*.09,.18));break;                     // gửi điều ước
    case 'pop':tone(650,n,.14,.25,'sine',o,180);noise(n,.06,{f0:2500,vol:.08,dest:o});break;     // mở hộp quà
    case 'paper':noise(n,.45,{f0:2600,q:.7,vol:.04,dest:o});bell(mf(88),n+.25,.14);break;       // tờ giấy cuộn mở
    case 'chime':for(let i=0;i<6;i++)bell(mf(pick([84,86,88,91,93,96])),n+i*.07+Math.random()*.03,.1,o);break; // chạm cây
    case 'star':[84,91,96].forEach(m=>bell(mf(m),n,.16));bell(mf(100),n+.15,.1);break;           // ngôi sao sáng
    case 'drop':tone(1400,n,1,.05,'sine',o,500);bell(mf(91),n,.1,o);break;                       // quà rơi từ xe Noel
    case 'poke':bell(mf(pick([88,91,93])),n,.12,o);bell(mf(96),n+.08,.08,o);break;                // chọc người tuyết
    case 'melt':tone(620,n,1.4,.1,'sine',o,140);noise(n,1.2,{f0:700,f1:200,vol:.04,dest:o});break; // người tuyết tan
    case 'throw':noise(n,.22,{type:'highpass',f0:1200,f1:3500,vol:.03,dest:o});break;            // ném cầu tuyết
    case 'splat':noise(n,.18,{f0:900,f1:250,q:.8,vol:.08,dest:o});break;                         // cầu tuyết vỡ
    case 'note':bell(mf(x),n,.13);break;                                                         // nốt khi cảnh mọc
    case 'tick':tone(1500,n,.05,.12,'square');break;                                              // đếm ngược Giao Thừa
    case 'midnight':for(let i=0;i<8;i++)[72,79,84].forEach(m=>bell(mf(m+(i%2?0:12)),n+i*.5,.16));break;
  }
}

function schedMusic(){
  if(!musicOn||!live())return;
  if(nextNoteT<AC.currentTime)nextNoteT=AC.currentTime+.1;
  while(nextNoteT<AC.currentTime+.6){
    const s=SONGS[songI],nn=s.n[noteI];
    bell(mf(nn[0]),nextNoteT,.55,musicGain);
    nextNoteT+=nn[1]*s.b;noteI++;

}

function soundFrame(t){
  if(!live())return;
  for(const[k,m]of[['snow',72],['trunk',76],['leaf',79],['lights',84]])
    if(t>T[k]&&!stagesFired.has(k)){stagesFired.add(k);sfx('note',m)}
  if(santa&&t>bellNext&&santa.x<W&&santa.x>-santa.E*3){bellNext=t+.2;sleighShake(santa.x)}
  windGain.gain.setTargetAtTime(.022+Math.min(.09,Math.abs(wind)/9000),AC.currentTime,.25);
  windFilter.frequency.setTargetAtTime(380+Math.min(900,Math.abs(wind)*.6),AC.currentTime,.3);
  if(modeNow.kind==='ny'&&modeNow.left<=10&&modeNow.left>0){const s=Math.ceil(modeNow.left);if(s!==lastTick){lastTick=s;sfx('tick')}}
  if(prevKind==='ny'&&modeNow.kind==='nyday')sfx('midnight');
  prevKind=modeNow.kind;
}
function setSound(on){
  soundOn=on;
  try{localStorage.setItem('snd',on?'1':'0')}catch(e){}
  if(on){
    audioInit();AC.resume();nextNoteT=AC.currentTime+.3;
    master.gain.setTargetAtTime(.8,AC.currentTime,.15);
    for(const k of Object.keys(T))if(tNow>T[k])stagesFired.add(k); // không phát lại nốt của cảnh đã mọc
  }else if(AC)master.gain.setTargetAtTime(0,AC.currentTime,.1);
  sndBtn.textContent=on?(AC&&AC.state!=='running'?'♪ chạm để nghe nhạc':'♪ âm thanh: bật'):'♪ bật âm thanh';
  sndBtn.setAttribute('aria-pressed',on?'true':'false');
  sndBtn.classList.toggle('on',on);
  updatePlayer();
}
// mặc định bật âm thanh ngay khi vào trang (trừ khi người xem đã tự tắt lần trước).
// Trình duyệt thường chặn âm thanh tới khi người xem chạm/bấm/gõ phím lần đầu, nên chạm bất kỳ đâu sẽ mở tiếng.
let sndPref=true;try{sndPref=localStorage.getItem('snd')!=='0'}catch(e){}
let justUnlocked=false;
if(sndPref){try{setSound(true);AC.resume().then(()=>setSound(true)).catch(()=>{})}catch(e){}}
function unlockAudio(){
  if(!soundOn||!AC||AC.state==='running')return;
  justUnlocked=true;setTimeout(()=>justUnlocked=false,600);
  AC.resume().then(()=>{
    nextNoteT=AC.currentTime+.2;
    for(const k of Object.keys(T))if(tNow>T[k])stagesFired.add(k);
    setSound(true);
  }).catch(()=>{});
}
for(const ev of['pointerdown','keydown','touchend'])addEventListener(ev,unlockAudio,{capture:true,passive:true});
sndBtn.addEventListener('click',e=>{e.stopPropagation();if(justUnlocked)return;setSound(!soundOn)});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(soundOn)AC.resume()});
updatePlayer();

cv.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  lastPtr={x,t:performance.now()};
  if(!pEls.list.hidden){toggleList(false);return} // chạm ra ngoài thì đóng danh sách bài
  // iPhone cần xin quyền cảm biến chuyển động từ một lần chạm
  if(!motionAsked&&typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    motionAsked=true;DeviceMotionEvent.requestPermission().catch(()=>{});
  }
  if(paper){if(tNow-paper.t0>.4&&!paper.close)paper.close=tNow;return}
  if(hitSanta(x,y)){sparkleAt(x,y,26,48);openPaper(MSG.santa,.15);return}
  if(hitMeteor(x,y)){sparkleAt(x,y,34,48);sfx('wish');wish={t0:tNow};meteor=null;nextMeteor=tNow+rnd(7,14);return}
  if(hitGift(x,y)){openGift();return}
  if(hitSnowman(x,y)){pokeSnowman();return}
  if(hitTree(x,y)){shakeTree();return}
  launch(x,Math.min(y,H*0.7));
});
cv.addEventListener('pointermove',e=>{
  const x=e.clientX,y=e.clientY,now=performance.now();
  // tốc độ rê ngang tạo gió
  if(lastPtr){const dtm=Math.max(8,now-lastPtr.t);const vx=(x-lastPtr.x)/dtm*1000;wind=clamp(wind*.7+vx*.3,-1600,1600)}
  lastPtr={x,t:now};
  cv.style.cursor=(paper||hitSanta(x,y)||hitMeteor(x,y)||hitGift(x,y)||hitSnowman(x,y)||hitTree(x,y))?'pointer':'crosshair';
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&paper&&!paper.close)paper.close=tNow;
  if(e.key==='r'||e.key==='R')setup();
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(setup,200)});
setup();requestAnimationFrame(frame);
})();
</script>
