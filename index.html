<style>
/* Một màn hình canvas đen, cảnh ASCII bằng chữ số, HUD kiểu terminal ở các góc */
:root{
  --bg:#000;
  --fg:#c9d1d9;
  --dim:#6b7280;
  --rose:#9cc4e4;
  --amber:#e9c46a;
  --cream:#f1e6c8;
  --line:rgba(233,196,106,.16);
  --bar:rgba(6,8,16,.78);
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.hud{position:fixed;font:12px/1.5 var(--mono);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#timer{top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));color:var(--rose)}
/* nút loa: cùng kiểu chữ terminal */
#snd{position:fixed;top:calc(32px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;
  font:12px/1.4 var(--mono);color:var(--amber);background:rgba(14,18,30,.42);border:1px solid var(--line);border-radius:10px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:4px 10px;cursor:pointer;animation:hudIn 1.5s ease 1.5s both}
#snd:hover{border-color:rgba(233,196,106,.35)}
#snd:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
/* nút trượt bật/tắt âm thanh: bật thì sáng vàng ấm, tắt thì tối */
#snd{display:flex;align-items:center;gap:9px;color:#6c7488;transition:color .3s,border-color .3s,box-shadow .3s}
#snd.on{color:#ffe7a0;border-color:rgba(233,196,106,.45);box-shadow:0 0 14px rgba(233,196,106,.22)}
.sw{position:relative;display:inline-block;flex:none;width:32px;height:17px;border-radius:9px;background:#141826;
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);transition:background .3s,border-color .3s,box-shadow .3s}
.sw i{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#4f5668;transition:left .25s ease,background .3s,box-shadow .3s}
.on .sw{background:linear-gradient(#f3d27a,#cf9a35);border-color:#ffe3a0;box-shadow:0 0 10px rgba(233,196,106,.65)}
.on .sw i{left:17px;background:#fffbea;box-shadow:0 0 7px #fff3c0}
.wait .sw i{animation:swPulse 1.1s ease-in-out infinite}
@keyframes swPulse{50%{box-shadow:0 0 12px #fff3c0,0 0 3px #fff}}
#info{left:max(16px,env(safe-area-inset-left,0px));top:calc(86px + env(safe-area-inset-top,0px));color:var(--dim)}
/* trình phát nhạc: khung trong mờ ở góc trên trái, đĩa than xoay khi đang phát */
#player{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;
  width:min(300px,calc(100vw - 32px));box-sizing:border-box;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 10px;border-radius:12px;background:rgba(14,18,30,.42);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:11px/1.35 var(--mono);color:var(--fg);animation:hudIn 1.5s ease 1.5s both}
.disc{width:46px;height:46px;border-radius:50%;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 10px rgba(0,0,0,.6);
  background:radial-gradient(circle,#000 0 5%,#b3263a 5.5% 17%,#e9c46a 17.5% 19%,transparent 19.5%),
    repeating-radial-gradient(circle,#141414 0 1.1px,#262626 1.5px 2.3px);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.2) 12%,transparent 18% 58%,rgba(255,255,255,.12) 62%,transparent 68%)}
.disc.playing{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#player .meta{min-width:0}
#player .np{color:#7d8296;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .title{display:block;max-width:100%;padding:0;border:0;background:none;color:#ffe7a0;cursor:pointer;text-align:left;
  font:700 16px/1.2 "Dancing Script",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .title::after{content:" ▾";font:10px var(--mono);color:#56607a}
#player .sub{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .ctl{display:flex;gap:4px}
#player .ctl button{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);
  color:var(--fg);font:12px/1 var(--mono);cursor:pointer;padding:0}
#player .ctl button:hover,#player .title:hover{border-color:rgba(255,255,255,.3);color:#fff}
#player button:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
#pPanel{position:absolute;top:calc(100% + 6px);left:0;right:0;padding:6px;border-radius:10px;
  background:rgba(14,18,30,.88);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  max-height:60vh;overflow:auto}
#pPanel[hidden]{display:none}
#pList{margin:0;padding:0;list-style:none}
#pPanel .vol{display:grid;gap:6px;margin-top:6px;padding:8px 6px 4px;border-top:1px solid rgba(255,255,255,.08)}
#pPanel .vol label{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;color:var(--dim);font:10px var(--mono)}
#pPanel input[type=range]{width:100%;height:18px;accent-color:#e9c46a;cursor:pointer}
#pList button{display:grid;grid-template-columns:22px 1fr;gap:6px;width:100%;padding:5px 6px;border:0;border-radius:6px;background:none;
  color:var(--fg);font:11px/1.35 var(--mono);text-align:left;cursor:pointer}
#pList button:hover{background:rgba(255,255,255,.06)}
#pList button[aria-selected="true"]{color:#ffe7a0}
#pList .i{color:#56607a}
#pList .s{grid-column:2;color:var(--dim);font-size:10px}
/* màn hình vừa: khung phát hẹp lại để không chạm lời chúc */
@media (max-width:900px){
  #player{width:min(250px,calc(100vw - 32px))}
  #hint{display:none}
}
/* điện thoại: khung phát rộng hết chiều ngang, nút âm thanh nằm ngay dưới, lời chúc dời xuống dưới hai thứ này */
#pSnd{display:none;width:auto!important;border-radius:12px!important;padding:0 4px!important;border-color:transparent!important;background:none!important}
#pSnd .sw{vertical-align:middle}
@media (max-width:640px){
  #player{width:calc(100vw - 32px)}
  #timer{display:none}
  /* điện thoại: nút âm thanh gộp vào khung nhạc cho gọn */
  #pSnd{display:inline-block}
  #snd{display:none!important}
  #snd{top:calc(84px + env(safe-area-inset-top,0px));right:auto;left:max(16px,env(safe-area-inset-left,0px))}
}
#info b{color:var(--fg);font-weight:400}
#info .row{display:flex;gap:22px;flex-wrap:wrap}
#bar{left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;background:var(--bar);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:var(--dim)}
#bar .run{color:var(--amber)}
#bar .by{color:#4a5468}
#hint{bottom:calc(38px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));color:#3d4555}
@media (max-width:820px){#hint{display:none}#info{display:none}}
/* bốn góc khung kiểu cửa sổ terminal */
.corner{position:fixed;width:18px;height:18px;border:0 solid rgba(233,196,106,.22);pointer-events:none}
#k1{top:calc(4px + env(safe-area-inset-top,0px));left:max(4px,env(safe-area-inset-left,0px));border-top-width:1px;border-left-width:1px}
#k2{top:calc(4px + env(safe-area-inset-top,0px));right:max(4px,env(safe-area-inset-right,0px));border-top-width:1px;border-right-width:1px}
#k3{bottom:calc(34px + env(safe-area-inset-bottom,0px));left:max(4px,env(safe-area-inset-left,0px));border-bottom-width:1px;border-left-width:1px}
#k4{bottom:calc(34px + env(safe-area-inset-bottom,0px));right:max(4px,env(safe-area-inset-right,0px));border-bottom-width:1px;border-right-width:1px}
#hint::before{content:"› ";color:#56607a}
/* lúc mới vào cả trang tối, chữ góc màn hình hiện sau */
.hud,.corner{animation:hudIn 1.5s ease 1.5s both}
@keyframes hudIn{from{opacity:0}}
/* để yên 10 giây: khung nhạc, chữ góc và thanh dưới mờ đi, chỉ còn cảnh; chạm là hiện lại */
#player,#snd,.hud,.corner{transition:opacity .5s ease}
body.idle #player,body.idle #snd,body.idle .hud,body.idle .corner{opacity:0!important;pointer-events:none;transition:opacity 1.4s ease}
@media (prefers-reduced-motion:reduce){.hud,.corner,#snd,#player{animation:none}.disc.playing{animation-play-state:paused}}
</style>

<canvas id="c" aria-label="Cây thông Noel và người tuyết dựng từ chữ số, pháo hoa trên bầu trời đêm"></canvas>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const DIG='0123456789';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=s=>s[Math.random()*s.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=p=>1-Math.pow(1-p,3);
const FONT='"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace';
// trình tự xuất hiện (giây): trời đen → sao, trăng, mây → tuyết dâng → thân cây → lá → đèn → ngôi sao → hoa hồng → lời chúc, pháo hoa → ông già Noel
const T={stars:.8,moon:1.2,clouds:.6,snow:1.5,trunk:4,leaf:5,lights:8.8,star:10.4,rose:11.6,gift:14.4,greet:15.2,fw:16,santa:12.6,walkIn:21};
// lời nhắn trên tờ giấy (sửa nội dung ở đây)
const MSG={
  gift:{title:'Món quà nhỏ cho bạn',body:'Chúc bạn một mùa Giáng Sinh thật ấm áp, luôn có những người thương yêu ở bên, và một năm mới gặp thật nhiều may mắn, bình an và hạnh phúc.'},
  // mỗi hộp quà ông già Noel thả xuống mang một lời chúc khác
  wishes:[
    {title:'Quà từ ông già Noel',body:'Chúc bạn luôn khoẻ mạnh, nụ cười lúc nào cũng rạng rỡ như ánh đèn trên cây thông đêm nay.'},
    {title:'Một hộp bình an',body:'Gửi bạn một hộp bình an: mong những ngày sắp tới thật nhẹ nhàng, mọi lo lắng đều tan như tuyết dưới nắng.'},
    {title:'Một hộp may mắn',body:'Chúc bạn năm mới gặp toàn điều may: học hành, công việc thuận lợi, gặp đúng người và đúng lúc.'},
    {title:'Một hộp yêu thương',body:'Mong bạn luôn được yêu thương và có những người thân ở bên mỗi khi trời trở lạnh.'},
    {title:'Một hộp ước mơ',body:'Chúc mọi ước mơ của bạn dù lớn hay nhỏ đều từng bước thành sự thật. Cố lên nhé!'},
    {title:'Một hộp ấm áp',body:'Gửi bạn chút ấm áp của mùa Giáng Sinh: một tách cacao nóng, một bài hát hay và một giấc ngủ thật ngon.'},
    {title:'Một hộp niềm vui',body:'Chúc bạn mỗi ngày đều có một lý do nhỏ để mỉm cười. Merry Christmas!'},
  ],
  santa:{title:'Ho ho ho! Merry Christmas!',body:'Ông già Noel ghé qua gửi lời chúc: Giáng Sinh an lành, ấm áp bên gia đình. Mong mọi điều ước của bạn đều thành sự thật!'}
};

let W,H,dpr,fs,cw,ch,cols,rows,cells=[],stars=[],sparkles=[],flakes=[],fws=[],parts=[],roses=[];
let start=0,lastFw=0,fwCount=0,nextFw=0,greetT=0,geo={};
const glow={};

function makeGlow(color){
  const s=64,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,color);gr.addColorStop(.25,color.replace(/[\d.]+\)$/,'0.35)'));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;
}
glow.red=makeGlow('rgba(255,60,80,1)');glow.gold=makeGlow('rgba(255,200,80,1)');
glow.blue=makeGlow('rgba(130,185,240,1)');glow.pink=makeGlow('rgba(255,120,110,1)');
glow.white=makeGlow('rgba(255,255,255,1)');glow.green=makeGlow('rgba(120,255,160,1)');
glow.moon=makeGlow('rgba(255,236,190,1)');
let clouds=[];
let gridMap=new Map(),ledges=[],paper=null,meteor=null,nextMeteor=0,wish=null,shake=-9,lightMode=0,bits=[],tNow=0;
let wind=0,lastPtr=null,lastShake=-9,motionAsked=false,modeNow=null;
let skyBg=null,milky=null,moonDim=1,refl=[],uiBottom=0,townGlow=null,vignette=null;

/* ---------- chạm, kéo vẽ tuyết, gợi ý chỗ bấm ---------- */
let ripples=[],trail=[],drag=null;
function ripple(x,y,hit){ripples.push({x,y,t0:tNow,hit});if(ripples.length>12)ripples.shift()}
function drawTrail(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.round(d/7));
  for(let i=1;i<=n;i++){
    const k=i/n;
    trail.push({x:x0+(x1-x0)*k+rnd(-3,3),y:y0+(y1-y0)*k+rnd(-3,3),t0:tNow,life:rnd(1.2,2),ch:pick('*.+08'),vx:rnd(-8,8),vy:rnd(4,16),tw:rnd(0,7)});
  }
  if(trail.length>420)trail.splice(0,trail.length-420);
}
function drawTouchFx(t,dt){
  if(!ripples.length&&!trail.length)return;
  ctx.globalCompositeOperation='lighter';ctx.textAlign='center';
  // vệt bông tuyết lấp lánh tan dần
  for(let i=trail.length-1;i>=0;i--){
    const p=trail[i],e=(t-p.t0)/p.life;if(e>=1){trail.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const tw=.6+.4*Math.sin(t*10+p.tw);
    ctx.globalAlpha=(1-e)*tw;ctx.fillStyle=e<.15?'#ffffff':'#cfe4ff';ctx.fillText(p.ch,p.x,p.y);
    if(e<.25){ctx.globalAlpha=(.25-e)*1.6;ctx.drawImage(glow.white,p.x-6,p.y-10,12,12)}
  }
  // vòng sáng tại chỗ chạm: vàng khi trúng vật, xanh băng khi chạm trời
  ctx.lineWidth=1.5;
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i],e=(t-r.t0)/.55;if(e>=1){ripples.splice(i,1);continue}
    ctx.globalAlpha=(1-e)*.8;ctx.strokeStyle=r.hit?'#ffd98a':'#bcd8f2';
    ctx.beginPath();ctx.arc(r.x,r.y,6+e*(r.hit?30:22),0,TAU);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.textAlign='left';ctx.lineWidth=1;
}
// gợi ý cho người mới: sau ~20 giây lần lượt làm loé từng thứ bấm được kèm chữ "chạm thử"
let triedSet=new Set(),hintQ=null;
try{triedSet=new Set(JSON.parse(localStorage.getItem('tried')||'[]'))}catch(e){}
function tried(k){if(triedSet.has(k))return;triedSet.add(k);try{localStorage.setItem('tried',JSON.stringify([...triedSet]))}catch(e){}}
function hintSpot(k){
  const g=geo;
  if(k==='tree')return t=>tNow>T.leaf+2?{x:g.cx,y:g.treeTop+g.TH*.55}:null;
  if(k==='gift')return()=>{const G=g.gift;return G&&!G.gone&&!G.drop&&!G.open&&tNow>T.gift+1.2?{x:G.mx,y:G.top-ch*1.2}:null};

function inTier(i,x,y){

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    const gt=groundTop(x);
    if(y<gt||y>g.bottom)continue;
    const depth=(y-gt)/(g.bottom-gt);
    if(y-gt<ch*1.2&&Math.random()<0.18)continue; // mép tuyết hơi lởm chởm
    // vệt sáng của trăng in trên tuyết
    // tuyết xa ngả xanh tím lạnh, gần thì trắng hơn
    const L=rnd(72,92)-(1-depth)*14+8*Math.exp(-(((x-g.moonX)/(W*.12))**2)), sp=Math.random()<0.04;
    put(c,r,{type:sp?'snowsp':'snow',ch:pick(sp?'*+':'08690860'),h:205+(1-depth)*22,s:rnd(10,30)+(1-depth)*14,l:L,
      delay:T.snow+(1-depth)*1.2+rnd(0,.2),tw:rnd(0,7)});
  }
  // rặng thông xa ở chân trời, màu xanh tối, phía sau mọi thứ
  for(let px=rnd(0,W/30);px<W;px+=rnd(W/40,W/22)){
    const gt=groundTop(px),h=ch*rnd(2.5,6.5)*(W<600?.8:1);
    for(let r=Math.floor((gt-h)/ch);r<=Math.floor(gt/ch);r++)for(let c=Math.floor((px-h*.45)/cw);c<=Math.ceil((px+h*.45)/cw);c++){
      if(r<0||c<0||c>=cols)continue;
      const x=(c+.5)*cw,y=(r+.5)*ch;
      if(y>=groundTop(x))continue;
      const k=(y-(gt-h))/h;if(k<0)continue;
      if(Math.abs(x-px)>h*.38*k*(1+.12*Math.sin(y*.5)))continue;
      if(map.has(r*cols+c))continue;
      put(c,r,{type:'ridge',ch:pick(DIG),h:rnd(150,175),s:30,l:rnd(10,16)+(x>px?4:0),delay:T.snow+1.2+rnd(0,.9)});
    }
  }
  // thân cây
  const tw=g.TH*0.05;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(Math.abs(x-g.cx)<tw&&y>g.treeBot-g.TH*0.06&&y<groundTop(x)+ch*1.5){
      const sh=(x-g.cx)/tw;
      const span=groundTop(x)+ch*1.5-(g.treeBot-g.TH*0.06);
      put(c,r,{type:'trunk',ch:pick('1|7|'),h:28,s:70,l:30+sh*-10+rnd(-4,4),delay:T.trunk+clamp((groundTop(x)+ch*1.5-y)/span,0,1)*1.0+rnd(0,.08)});
    }
  }
  // cây thông
  const orn=[],ornR=Math.max(ch*1.05,g.TH*0.017);
  for(let i=0;i<Math.round(g.TH*g.HW/1400)+14;i++){
    for(let tries=0;tries<30;tries++){
      const x=g.cx+rnd(-g.HW,g.HW),y=rnd(g.treeTop+g.TH*0.12,g.treeBot);
      if(inTree(x,y)&&inTree(x+ornR*2,y)&&inTree(x-ornR*2,y)&&orn.every(o=>Math.hypot(o.x-x,(o.y-y)*1.4)>ornR*3.2)){
        orn.push({x,y,col:pick(['red','red','gold','blue','gold','red']),ph:rnd(0,7)});break;
      }
    }
  }
  const ornCol={red:[352,90,55],gold:[45,100,58],blue:[212,95,62],pink:[325,90,66]};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(!inTree(x,y))continue;
    const dx=x-g.cx,u=(y-g.treeTop)/g.TH;
    const edge=!inTree(x+cw*1.2,y)||!inTree(x-cw*1.2,y)||!inTree(x,y+ch*1.1);
    const delay=T.leaf+(1-u)*3.4+rnd(0,.18);
    let o=null;
    for(const b of orn){
      if(Math.hypot(b.x-x,(b.y-y)*1.6)<ornR){
        const k=ornCol[b.col];o={type:'orn',ch:pick('0896'),h:k[0],s:k[1],l:k[2],g:b.col,tw:b.ph,delay};
        // điểm bóng trắng ở góc trên trái quả châu
        if(Math.hypot(x-(b.x-ornR*.4),(y-(b.y-ornR*.25))*1.6)<cw*.75){o.hl=1;o.ch='0'}
        break;
      }
      // sợi móc treo mảnh phía trên quả châu
      if(Math.abs(x-b.x)<cw*.5&&y<b.y-ornR/1.6&&y>b.y-ornR/1.6-ch*.95){o={type:'hanger',ch:'\'',h:45,s:45,l:50,delay};break}
    }
    if(!o){
      // dây kim tuyến võng thành từng vòng cung giữa các cành
      let onG=false;
      for(let k=0;k<5&&!onG;k++){
        let s=((x-g.cx)/(g.TH*.17)+k*.5)%1;if(s<0)s+=1;
        const yk=g.treeTop+g.TH*(.2+k*.16)+(x-g.cx)*.1+g.TH*.03*Math.sin(Math.PI*s);
        if(Math.abs(y-yk)<ch*.55)onG=true;
      }
      if(onG&&!edge){
        o={type:'garland',ch:pick(DIG),h:44,s:95,l:rnd(55,68),delay,tw:rnd(0,7)};
      }else if(Math.random()<0.035&&!edge){
        o={type:'light',ch:pick('*+o'),g:pick(['gold','white','gold','blue','white']),h:0,s:0,l:0,tw:rnd(0,7),delay};
      }else{
        // ánh trăng chiếu từ phía phải: nửa phải sáng hơn, mép phải được viền sáng
        const shade=dx/g.HW*7+(1-u)*-4;
        // tầng trên đổ bóng xuống tầng dưới; mép dưới mỗi tầng (chùm cành) sáng hơn
        const ti=tierOf(x,y);let tierSh=0;
        if(ti>0&&inTier(ti-1,x,y-ch*2.2))tierSh=-9;
        else if(ti>=0&&!inTier(ti,x,y+ch*1.1))tierSh=6;
        // lõi sâu trong tán tối hơn, mép ngoài sáng hơn: cây có khối mà vẫn xanh
        const core=inTree(x+cw*3.5,y)&&inTree(x-cw*3.5,y)&&inTree(x,y+ch*2.5);
        o={type:'tree',ch:pick(DIG),h:rnd(118,148),s:rnd(55,75)-(core?6:0),l:clamp((edge?43:24)+shade+tierSh-(core?5:0)+rnd(-6,6),9,56),delay,e:edge?1:0};
        if(edge&&dx>0&&!inTree(x+cw*1.2,y)){o.moonEdge=1;o.h+=14} // mép hướng trăng ngả xanh ngọc nhẹ
      }
    }
    // đèn, trang trí và dây kim tuyến: lúc đầu là lá xanh, sau đó mới sáng lên từ dưới lên
    o.u=u;
    o.lightAt=T.lights+(1-u)*1.3+rnd(0,.3);
    o.leaf=`hsl(${rnd(118,148)|0},65%,${edge?40:26}%)`;
    put(c,r,o);
  }
  // ngôi sao
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(inStar(x,y)){
      const d=Math.hypot(x-g.sx,y-g.sy)/g.SR;
      put(c,r,{type:'star',u:0,ch:d<.35?'8':d<.65?pick('80'):'*',h:48,s:100,l:72-d*18,delay:T.star+d*.4+rnd(0,.15),tw:rnd(0,7)});
    }
  }
  // hộp quà bằng chữ số, bên phải gốc cây
  {
    const gw=Math.max(cw*11,g.TH*0.15),gh=Math.max(ch*3.5,gw*0.6);
    // đặt ngay ngoài mép tán cây bên phải; người tuyết sẽ đứng đối xứng bên trái
    // bản 3D: hộp có thêm mặt bên phải (tối) và mặt trên (sáng) xiên ra phía sau
    const SD=FLAT?0:Math.max(2,Math.round(gw*.2/cw)),sk=ch*.5;
    const gxC=Math.min(g.cx+g.HW*1.12+gw*.35,W-gw*.6-cw-SD*cw);
    const x0=gxC-gw/2,x1=x0+gw,y1=groundTop(gxC)+ch*1.1,y0=y1-gh,mx=(x0+x1)/2,my=(y0+y1)/2;
    const yL=y0-ch*1.15;
    g.gift={x0:x0-cw,x1:x1+cw+SD*cw,y0:y0-ch*2.4,top:y0,y1,mx,open:0,bx0:x0,w:gw,n:-1,pi:0,msg:MSG.gift,gone:reduce?0:1,drop:0,under:[]}; // hộp đầu tiên cũng do ông già Noel thả xuống
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=(c+.5)*cw,y=(r+.5)*ch,rib=Math.abs(x-mx)<cw*.9;
      let o=null;
      if(x>x0&&x<x1&&y>y0&&y<y1){
        o=(rib||Math.abs(y-my)<ch*.55)?{type:'gift',ch:pick('8098'),h:46,s:95,l:62,rib:1}
          :{type:'gift',ch:pick(DIG),h:354,s:88,l:clamp(54-(x-mx)/gw*14+rnd(-4,4),42,64)};
      }else if(x>x0-cw&&x<x1+cw&&y>y0-ch*1.15&&y<=y0){
        o=rib?{type:'gift',ch:pick('8098'),h:46,s:95,l:68,lid:1,rib:1}:{type:'gift',ch:pick(DIG),h:354,s:90,l:62,lid:1};
      }else if(SD&&x>=x1+cw&&x<x1+cw+SD*cw&&(()=>{const k=(x-x1-cw)/cw+1;return y>yL-k*sk&&y<y1-k*sk})()){
        // mặt bên: khuất trăng nên tối hơn, dải ruy băng chạy tiếp sang
        const k=(x-x1-cw)/cw+1;
        o=Math.abs(y-(my-k*sk))<ch*.55?{type:'gift',ch:pick('8098'),h:46,s:90,l:44,rib:1,sd:22}
          :y<y0-k*sk?{type:'gift',ch:pick(DIG),h:354,s:80,l:40,lid:1}:{type:'gift',ch:pick(DIG),h:354,s:80,l:clamp(33+rnd(-3,3),28,40)};
      }else if(y>y0-ch*2.3&&y<=y0-ch*1.15&&(()=>{const ax=Math.abs(x-mx);return ax<cw*.6||(ax>cw&&ax<cw*2.8)})()){
        const ax=Math.abs(x-mx);
        o={type:'bow',ch:ax<cw*.6?'@':pick('oO0'),h:46,s:100,l:64,lid:1,tw:rnd(0,7)};
      }else if(SD&&y<=yL&&y>yL-SD*sk-ch*.2){
        // mặt trên nắp: hình bình hành lùi về phía sau, sáng nhất vì hứng ánh trăng
        const k=(yL-y)/sk,xs=x-k*cw;
        if(xs>x0-cw&&xs<x1+cw)o=Math.abs(xs-mx)<cw*.9?{type:'gift',ch:pick('8098'),h:46,s:95,l:74,lid:1,rib:1}:{type:'gift',ch:pick(DIG),h:354,s:85,l:70,lid:1};
      }
      if(o){o.delay=reduce?T.gift+clamp((y1-y)/(gh+ch*2.3),0,1)+rnd(0,.1):0;put(c,r,o)}
    }
  }
  // người tuyết bên trái gốc cây, đối xứng với hộp quà; một người nhỏ đi tới đắp nó
  {
    const sxm=g.cx-(g.gift.bx0-g.cx)-g.gift.w/2,gb=groundTop(sxm)+ch*.7;
    const r1=Math.max(ch*1.9,g.TH*.058),r2=r1*.72,r3=r1*.52;
    const c1=gb-r1,c2=c1-(r1+r2)*.78,c3=c2-(r2+r3)*.82;
    const sp=clamp(W/12,45,110),start=-cw*3,stand=Math.max(cw*2,sxm-r1-cw*3.5);
    const t0=T.walkIn,t1=t0+(stand-start)/sp,tb0=t1+.4,tb1=tb0+3.4,t2=tb1+1.6;
    g.snowman={x:sxm,x0:sxm-r1-cw*4,x1:sxm+r1+cw*4,bottom:gb,top:c3-r3-ch*1.8,c2,
      acc:0,poke:-9,pokes:[],melt:0,rebuild:0,doze:0,nextDoze:0,lastZ:0,autoMelt:0,hitT:-9,throwT:-9,nextThrow:0,face:1};
    g.walker={start,stand,sp,t0,t1,tb0,tb1,t2,t3:t2+(stand-start)/sp+.5};
    const topY=c3-r3-ch*1.8;
    // quả cầu tuyết có khối: sáng phía trên bên phải (hướng trăng), bóng xanh lạnh phía dưới bên trái
    const sph=(dx,dy,r)=>{
      if(FLAT)return{h:205,s:25,l:clamp(88-dx/r*6,74,97)};
      const nx=clamp(dx/r,-1,1),ny=clamp(dy/r,-1,1),nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
      const d=Math.max(0,nx*.5-ny*.45+nz*.74);
      return{h:205+(1-d)*18,s:22+(1-d)*22,l:clamp(54+d*42,56,97)};
    };
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=(c+.5)*cw,y=(r+.5)*ch,dx=x-sxm;let o=null;
      const inB=(cy,rr)=>Math.hypot(dx,(y-cy)*1.05)<=rr;
      if(y>c3-r3-ch*1.7&&y<c3-r3*.75&&Math.abs(dx)<r3*.75)o={ch:pick(DIG),h:354,s:70,l:42,part:'hat'};          // mũ len đỏ
      else if(Math.abs(y-(c3-r3*.75))<ch*.5&&Math.abs(dx)<r3*1.25)o={ch:pick('8098'),h:46,s:90,l:62,part:'brim'}; // vành mũ vàng
      else if(inB(c3,r3)){
        if(Math.abs(y-(c3-r3*.15))<ch*.5&&Math.abs(Math.abs(dx)-r3*.4)<cw*.6)o={ch:'0',h:220,s:10,l:12,part:'eye'}; // mắt
        else if(Math.abs(y-(c3+r3*.2))<ch*.5&&dx>cw*.2&&dx<r3*.95)o={ch:'>',h:28,s:100,l:55,part:'nose'};          // mũi cà rốt
        else o={ch:pick('08690'),...sph(dx,y-c3,r3),part:'head'};
      }
      else if(Math.abs(y-(c3+r3*.95))<ch*.55&&Math.abs(dx)<r3*1.05)o={ch:pick(DIG),h:354,s:85,l:52,part:'scarf'};  // khăn quàng
      else if(inB(c2,r2)){
        if(Math.abs(dx)<cw*.6&&(Math.abs(y-(c2-r2*.3))<ch*.5||Math.abs(y-(c2+r2*.3))<ch*.5))o={ch:'0',h:220,s:10,l:14,part:'btn'}; // cúc áo
        else o={ch:pick('08690'),...sph(dx,y-c2,r2),part:'body'};
      }
      else if(inB(c1,r1))o={ch:pick('08690'),...sph(dx,y-c1,r1),part:'body'};
      else for(const sd of[-1,1]){                                                                     // tay que
        const k=(sd*dx-r2*.85)/cw;
        if(k>0&&k<3.5&&Math.abs((y-c2)+k*ch*.55)<ch*.5)o={ch:sd<0?'\\':'/',h:28,s:55,l:40,part:'arm',side:sd,k};
      }
      if(o){o.type='snowman';o.delay=tb0+clamp((gb-y)/(gb-topY),0,1)*(tb1-tb0-.5);put(c,r,o)}
    }
  }
  // hoa hồng quanh gốc cây
  roses=[];
  const nR=0, spots=[]; // anh bỏ hoa hồng
  for(let i=0;i<nR;i++){
    for(let tries=0;tries<80;tries++){
      const side=i%2?1:-1;
      const spread=rnd(0.06,0.47)*W;
      const x=g.cx+side*spread;
      const gt=groundTop(x);
      const y=rnd(gt-ch*0.6,gt+(g.bottom-gt)*0.45);
      const persp=0.85+0.3*clamp((y-gt)/(g.bottom-gt),0,1);
      const rad=Math.max(ch*1.7,g.TH*rnd(.042,.056))*persp*(W<600?0.85:1);
      if(Math.abs(x-g.cx)<tw*1.5+rad*1.4)continue;
      if(x<rad*2||x>W-rad*2)continue;
      if(x>g.gift.x0-rad*1.8&&x<g.gift.x1+rad*1.8)continue; // chừa chỗ cho hộp quà
      if(x>g.snowman.x0-rad*1.8&&x<g.snowman.x1+rad*1.8)continue; // và người tuyết
      if(spots.every(s=>Math.hypot(s.x-x,(s.y-y)*1.3)>s.rad+rad*1.9)){
        spots.push({x,y,rad,hue:pick([350,350,355,340,0,330]),i});break;
      }
    }
  }
  spots.sort((a,b)=>a.y-b.y);
  spots.forEach((s,k)=>{
    const d0=T.rose+k*0.2;
    const rose={cells:[],end:0};roses.push(rose);
    for(let r=Math.floor((s.y-s.rad*2.4)/ch);r<=Math.ceil((s.y+s.rad*2.4)/ch);r++){
      for(let c=Math.floor((s.x-s.rad*3)/cw);c<=Math.ceil((s.x+s.rad*3)/cw);c++){
        if(r<0||c<0||r>=rows||c>=cols)continue;
        const x=(c+.5)*cw,y=(r+.5)*ch,dx=x-s.x,dy=y-s.y;
        // đầu hoa
        const ex=dx/(s.rad*1.25),ey=dy/s.rad,d=Math.hypot(ex,ey);
        let o=null;
        if(d<=1){
          const ang=Math.atan2(ey,ex);
          const spiral=Math.sin(ang*1+d*11);
          const L=d>0.82?72:d<0.2?30:clamp(48+spiral*20-ey*8,24,76);
          o={type:'rose',ch:pick(d<0.3?'@&8':'0689'),h:s.hue,s:90,l:L};
        }else{
          // một nụ hồng nhỏ chưa nở ở bên cạnh, có cuống xanh
          const bsd=s.i%2?1:-1,bx=dx-bsd*s.rad*1.95,by=dy+s.rad*.15;
          if(Math.hypot(bx/(s.rad*.32),by/(s.rad*.42))<=1)o={type:'rose',ch:pick('08'),h:s.hue,s:85,l:clamp(42-by/s.rad*20,30,58),bud:1};
          else if(Math.abs(bx)<cw*.55&&by>s.rad*.35&&by<s.rad*1.1)o={type:'leaf',ch:'|',h:125,s:55,l:34};
          // hai lá
          if(!o)for(const sd of[-1,1]){
            const lx=dx-sd*s.rad*1.35,ly=dy-s.rad*0.75;
            const a=sd*0.5,rx=lx*Math.cos(a)+ly*Math.sin(a),ry=-lx*Math.sin(a)+ly*Math.cos(a);
            if((rx/(s.rad*1.05))**2+(ry/(s.rad*0.42))**2<=1){
              o={type:'leaf',ch:pick(DIG),h:rnd(115,140),s:65,l:rnd(26,42)+(-ry/s.rad)*8};
            }
          }
        }
        if(o){o.delay=d0+clamp((s.y+s.rad*1.3-y)/(s.rad*2.6),0,1)*1.1+rnd(0,.12);o.rose=rose;put(c,r,o);rose.cells.push(o)}
        else if(d<1.45){const k=r*cols+c,e=map.get(k);if(e&&e.type.startsWith('snow')){e.hideAt=d0;under.push(e);map.delete(k)}} // khoảng tối quanh bông hoa, chỉ mở ra khi hoa bắt đầu nở
      }
    }
  });

  for(const o of under)if(o.hideAt===undefined)o.hideAt=o.coveredBy.delay+.12;
  // lá và tuyết sau lưng người tuyết: cây mọc đầy đủ trước, chỉ bị che khi người tuyết đắp xong, tan thì hiện lại
  for(const o of under)if(o.coveredBy.type==='snowman'){o.smUnder=1;o.hideAt=undefined}
  // tuyết nằm dưới hộp quà: hiện lại khi hộp biến mất
  g.gift.under=under.filter(o=>o.coveredBy&&(o.coveredBy.type==='gift'||o.coveredBy.type==='bow'));
  for(const o of g.gift.under){o.hide0=o.hideAt;if(g.gift.gone)o.hideAt=undefined}
  cells=[...map.values(),...under];
  // bản 3D: đèn, quả châu, kim tuyến cũ thành lá; trang trí mới được vẽ theo vòng xoay
  let nL3=0;
  if(!FLAT)for(const o of cells){
    if(o.u===undefined||o.type==='star'||o.type==='tree')continue;
    if(o.type==='light')nL3++;
    o.type='tree';o.ch=pick(DIG);o.h=rnd(118,148);o.s=rnd(55,70);o.e=0;
    o.l=clamp(26+(o.c*cw-g.cx)/g.HW*7+rnd(-6,6),9,56);delete o.hl;
  }
  // bóng xanh đậm của cây, hộp quà, người tuyết đổ trên tuyết, lệch sang trái vì trăng ở bên phải
  const gt0=groundTop(g.cx),sm=g.snowman,gf=g.gift;
  const shadows=[[g.cx-g.HW*.14,gt0+ch*1.4,g.HW*.85,ch*3.4],
    [gf.mx-gf.w*.3,gf.y1+ch*.4,gf.w*.75,ch*1.5],[sm.x-cw*3,sm.bottom+ch*.4,(sm.x1-sm.x0)*.42,ch*1.5]];
  for(const o of cells){
    o.x=o.c*cw;o.y=(o.r+0.82)*ch;
    if(o.type==='snow'||o.type==='snowsp')for(const [sx,sy,rx,ry] of shadows){
      const d=((o.x-sx)/rx)**2+((o.y-sy)/ry)**2;
      if(d<1){const k=1-d;o.l-=26*k;o.h=o.h+(226-o.h)*k;o.s=Math.max(o.s,20+18*k)}
    }
    o.dur=rnd(0.9,1.6);
    o.sx0=o.x+rnd(-.5,.5)*cw;o.sy0=o.y+ch*rnd(1.5,3.5);o.dur=rnd(.45,.8); // mọc / dâng từ dưới lên
    o.end=o.delay+o.dur;
    o.col=`hsl(${o.h|0},${o.s|0}%,${o.l|0}%)`;
    if(o.rose)o.rose.end=Math.max(o.rose.end,o.end);
    if(o.type==='tree'){
      o.wcol=`hsl(${o.h|0},${o.s|0}%,${Math.min(72,o.l+20)|0}%)`;           // màu khi sóng sáng chạy qua
      if(o.moonEdge)o.mcol=`hsl(${(o.h+25)|0},38%,${Math.min(68,o.l+18)|0}%)`; // viền ánh trăng
    }
  }
  // đèn và quả châu làm sáng nhẹ những lá sát bên: lá vẫn xanh, chỉ sáng hơn và hơi ngả ấm
  for(const s of cells){
    if(s.type!=='light'&&s.type!=='orn')continue;
    for(let dr=-1;dr<=1;dr++)for(let dc=-2;dc<=2;dc++){
      const o=map.get((s.r+dr)*cols+s.c+dc);if(!o||o.type!=='tree')continue;
      const d=Math.hypot(dc*cw,dr*ch)/ch;if(d>1.3)continue;
      if(o.tint&&o.tint.d<=d)continue;
      o.tint={src:s,d,col:`hsl(${(o.h-12)|0},${Math.min(80,o.s+8)|0}%,${clamp(o.l+14-d*4,28,58)|0}%)`};
    }
  }
  build3D(g,nL3,orn.length,ornR);  // nền tuyết và rặng thông xa đứng yên sau khi mọc xong: vẽ sẵn thành ảnh
  {
    const gu=new Set(g.gift.under);
    g.snowC=cells.filter(o=>o.type==='snow'&&!gu.has(o)&&o.hideAt===undefined&&!o.smUnder);
    g.ridgeC=cells.filter(o=>o.type==='ridge'&&o.hideAt===undefined&&!o.smUnder&&!gu.has(o));
    g.snowEnd=Math.max(0,...g.snowC.map(o=>o.end),...g.ridgeC.map(o=>o.end))+.1;
    g.snowBk=g.ridgeBk=null;
  }
  // những thứ in bóng xuống mặt tuyết bóng loáng
  refl=cells.filter(o=>{
    if(o.type==='gift'||o.type==='bow'){o.mb=g.gift.y1-ch*.15;return true}
    if(o.type==='snowman'){o.mb=g.snowman.bottom-ch*.1;return true}
    if(o.type==='trunk'){o.mb=groundTop(g.cx)+ch*1.3;return true}
    return false;
  });
  // mép trên các tầng lá: chỗ tuyết rơi xuống sẽ đọng lại
  gridMap=map;ledges=[];g.prints=[];
  const TT={tree:1,garland:1,orn:1,light:1,star:1};
  for(const o of cells){
    // tuyết cũng đọng trên nắp hộp quà, nơ, mũ và vai người tuyết
    if(o.type==='gift'||o.type==='bow'||o.type==='snowman'){
      if(o.ch==='>'||o.ch==='\\'||o.ch==='/')continue;
      const up=map.get((o.r-1)*cols+o.c);
      if(!up||(up.type!==o.type&&!(o.type==='gift'&&up.type==='bow'))){o.ledge=true;ledges.push(o)}
      continue;
    }
    if(o.u===undefined||o.type==='star')continue;
    const up=map.get((o.r-1)*cols+o.c);
    if(!up||!TT[up.type]){o.ledge=true;ledges.push(o)}
  }
  // vẽ theo thứ tự để giảm đổi màu
  cells.sort((a,b)=>a.r-b.r);
  $('iDig').textContent=cells.length.toLocaleString('en-US');
}

  }
  FIG=clamp(8.5/fs,1,1.7); // người, chó vẫn giữ cỡ cũ cho dễ nhìn
  buildSky();
  fws=[];parts=[];bursts.length=0;smoke=[];fin=null;finNext=0;fwCount=0;nextFw=T.fw;santa=null;nextSanta=T.santa;
  paper=null;meteor=null;nextMeteor=T.stars+7;wish=null;shake=-9;bits=[];

/* ---------- người tuyết biết tương tác ---------- */
// bộ phụ kiện: mũ / vành mũ / khăn quàng; mỗi lần chạm đổi một bộ
const hs=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
const ACCS=[
  {hat:hs(354,70,42),brim:hs(46,90,62),scarf:hs(354,85,52)},   // mũ len đỏ, vành vàng
  {hat:hs(140,55,34),brim:hs(0,0,95),scarf:hs(140,50,44)},     // mũ xanh lá, vành trắng
  {hat:hs(208,50,58),brim:hs(0,0,95),scarf:hs(208,45,66)},     // mũ xanh băng
  {hat:hs(40,35,86),brim:hs(354,70,50),scarf:hs(354,70,50)},   // mũ len kem, khăn đỏ
  {hat:hs(220,15,16),brim:hs(354,80,50),scarf:hs(46,90,58)},   // mũ chóp đen, vành đỏ, khăn vàng
];
const SAY=['Hi!','Merry Christmas!','Brrr... lạnh ghê','Hehe ^^','Ho ho ho!','Giáng Sinh vui vẻ!'];
let lastBoom=-9;
const smVis=()=>santa&&santa.x<W&&santa.x>-santa.E*2;
function hitSnowman(x,y){
  const s=geo.snowman,wk=geo.walker;
  return !!s&&!s.melt&&tNow>wk.tb1&&x>s.x0+cw*2&&x<s.x1-cw*2&&y>s.top&&y<s.bottom+ch*.5;
}
function pokeSnowman(){
  const s=geo.snowman,t=tNow;
  s.pokes=s.pokes.filter(p=>t-p<2.5);s.pokes.push(t);
  for(let i=0;i<8;i++)bits.push({x:s.x+rnd(-1,1)*cw*3,y:s.top+ch*rnd(1,3),vx:rnd(-60,60),vy:rnd(-110,-40),ch:pick('*.'),col:'hsl(205,40%,94%)',age:0,life:rnd(.5,1)});
  if(s.pokes.length>=6&&t>geo.walker.t3){meltSnowman();return}
  s.poke=t;s.acc=(s.acc+1)%ACCS.length;s.doze=0;s.nextDoze=t+rnd(30,50);
  const n=s.pokes.length;
  s.say={txt:n===4?'Ui da, nhột quá!':n===5?'Tan mất bây giờ!':pick(SAY),t0:t};
  sfx('poke',s.x);
}
function meltSnowman(auto){
  const s=geo.snowman,wk=geo.walker,t=tNow;
  s.melt=t;s.pokes=[];s.say={txt:auto?'Nóng quá... tan mất!':'Ôi... tan mất rồi!',t0:t};s.doze=0;
  // lần nào cũng là một người khác tới đắp lại
  const h=pick(HATS);wk.hat=h[0];wk.hatC=h[1];wk.coat=pick(COATS);
  sfx('melt',s.x);
  // vài giây sau bạn nhỏ quay lại đắp lại từ đầu
  const travel=(wk.stand-wk.start)/wk.sp,t0=t+4.5,t1=t0+travel,tb0=t1+.4,tb1=tb0+3.4,t2=tb1+1.6,shift=tb0-wk.tb0;
  Object.assign(wk,{t0,t1,tb0,tb1,t2,t3:t2+travel+.5,lastF:-1});
  s.rebuild=tb0;s.autoMelt=tb1+rnd(18,22);
  for(const o of cells)if(o.type==='snowman'){o.cap=false;o.d2=o.delay+shift}
}
function smUpdate(t,dt){
  const s=geo.snowman;if(!s)return;
  if(s.melt&&t>=s.rebuild){
    s.melt=0;s.acc=0;s.say=null;
    for(const o of cells)if(o.type==='snowman'){o.delay=o.d2;o.end=o.delay+o.dur}
  }
  if(!s.nextDoze)s.nextDoze=geo.walker.t3+rnd(25,40);
  // khoảng 20 giây sau khi đắp xong thì người tuyết tự tan, rồi có người tới đắp lại
  const wk=geo.walker;
  if(!s.autoMelt)s.autoMelt=wk.tb1+rnd(18,22);
  if(!s.melt&&!reduce&&t>s.autoMelt&&t>wk.t3)meltSnowman(true);
  // tham gia trận ném tuyết đang diễn ra
  if(!s.melt&&t>wk.tb1&&t>s.nextThrow){
    const foes=crowd.filter(q=>q.fight&&q.state==='fight');
    if(foes.length){
      const q=pick(foes),face=q.x<s.x?-1:1;
      s.throwT=t;s.face=face;
      throwBall({x:s.x+face*cw*4,face},q,t,s.c2-ch*.6);
      if(Math.random()<.3)s.say={txt:pick(['Đỡ này!','Hehe!','Ăn tuyết nè!']),t0:t};
    }
    s.nextThrow=t+rnd(1.6,3.2);
  }
  // thỉnh thoảng ngủ gật vài giây
  if(!s.melt&&!s.doze&&t>s.nextDoze&&t-s.poke>5&&!smVis()){s.doze=t;s.nextDoze=t+rnd(40,70)}
  if(s.doze&&(t-s.doze>8||smVis()))s.doze=0;
  // mắt: vui khi được chạm, ngước nhìn ông già Noel, ngủ gật, giật mình khi pháo nổ
  s.eyeDx=0;s.eyeDy=0;
  if(t-s.hitT<.7)s.eye='O';
  else if(sK>.3)s.eye='-'; // nheo mắt trong bão tuyết
  else if(t-s.poke<2.2)s.eye='^';
  else if(smVis()){s.eye='o';s.eyeDy=-ch*.18;s.eyeDx=(santa.x<s.x?-1:1)*cw*.18}
  else if(s.doze)s.eye='-';
  else if(t-lastBoom<.45)s.eye='O';
  else s.eye='0';
  s.wave=!s.melt&&(t-s.poke<2.2||smVis())?Math.floor(t/.22)%2:-1;
  if(s.melt&&Math.random()<dt*10){
    const m=clamp((t-s.melt)/2.4,0,1);if(m<1)bits.push({x:s.x+rnd(-1,1)*cw*4,y:s.bottom-(s.bottom-s.top)*(1-m)*rnd(.2,.9),vx:rnd(-15,15),vy:rnd(0,30),ch:pick('.,'),col:'hsl(200,50%,80%)',age:0,life:rnd(.6,1.1)});
  }
}
function smLook(o,t,x,y,c,col,a){
  const s=geo.snowman,A=ACCS[s.acc];
  if(o.part==='hat')col=A.hat;else if(o.part==='brim')col=A.brim;else if(o.part==='scarf')col=A.scarf;
  if(s.melt){
    const m=clamp((t-s.melt)/2.4,0,1),e=m*m;
    if(o.part==='body'||o.part==='head'){y=s.bottom-(s.bottom-y)*(1-.84*m);x=s.x+(x-s.x)*(1+.55*m);if(o.part==='head')a*=1-.6*m}
    else{y+=(s.bottom-ch*.3-y)*e;x+=(x-s.x)*.4*m;if(o.part==='eye'||o.part==='btn')a*=1-m}
    return[x,y,c,col,a];
  }
  if(o.part==='eye'){c=s.eye;x+=s.eyeDx;y+=s.eyeDy}
  else if(o.part==='arm'&&t-s.throwT<.35&&o.side===s.face){y-=o.k*ch*.45;x-=o.side*o.k*cw*.3;c='|'} // vung tay ném
  else if(o.part==='arm'&&o.side===1&&s.wave===1){y-=o.k*ch*.45;x-=o.k*cw*.3;c='|'}
  return[x,y,c,col,a];
}
function smDraw(t){
  const s=geo.snowman;if(!s)return;
  ctx.textAlign='center';
  // chữ z bay lên khi ngủ gật
  if(s.doze){
    for(let i=0;i<3;i++){
      const e=((t-s.doze)*.5+i/3)%1;
      ctx.globalAlpha=Math.sin(e*Math.PI)*.85;ctx.fillStyle='#b9c8ff';
      ctx.fillText(i%2?'z':'Z',s.x+cw*(1.5+e*3),s.top+ch*.5-e*ch*4);
    }
  }
  // lời nói nổi lên trên đầu rồi tan
  if(s.say){
    const e=(t-s.say.t0)/2;
    if(e>1)s.say=null;
    else{
      const yy=s.top-ch*(1.2+e*1.4);
      ctx.globalAlpha=Math.min(1,(1-e)*2.5);
      ctx.fillStyle='rgba(8,12,28,.7)';const w=ctx.measureText(s.say.txt).width+cw*2;
      ctx.fillRect(s.x-w/2,yy-ch*.95,w,ch*1.35);
      ctx.fillStyle='#ffe9b0';ctx.fillText(s.say.txt,s.x,yy);
    }
  }
  ctx.textAlign='left';ctx.globalAlpha=1;
}

/* ---------- người qua đường: thỉnh thoảng 1–3 người đi dạo hoặc ném tuyết ---------- */
let crowd=[],balls=[],nextCrowd=0;
// ?crowd=fight hoặc ?crowd=walk để xem thử ngay
const CROWD_TEST=new URLSearchParams(location.search).get('crowd');
// bảng màu chung của cả cảnh: đỏ nhung, xanh lá thông, vàng ấm, xanh băng, trắng kem
const HATS=[['^','#c8404b'],['^','#2f9e5b'],['n','#e0b04a'],['^','#7fb4e0'],['*','#efe6d2'],['n','#c8404b'],['=','#9a3b45']];
const COATS=['#7fb4e0','#c8404b','#2f9e5b','#e0b04a','#efe6d2','#9a3b45','#3d6f9e'];
function person(x,dir,o){
  const h=pick(HATS);
  return Object.assign({x,dir,face:dir,sp:clamp(W/12,45,110)*rnd(.85,1.15),hat:h[0],hatC:h[1],coat:pick(COATS),ph:rnd(0,1),state:'walk',hitT:-9,throwT:-9,nextThrow:0,lastF:-1},o);
}
function spawnCrowd(t,walkOnly){
  let n=1+Math.floor(Math.random()*3);const E=cw*4;
  if(CROWD_TEST==='fight')n=Math.max(n,2);
  if(!walkOnly&&(CROWD_TEST?CROWD_TEST==='fight':n>=2&&Math.random()<.6)){
    // trận ném tuyết: hai phe đứng hai bên cây, ném qua ném lại rồi về
    const end=t+rnd(9,13),L=rnd(.1,.24)*W,R=W-rnd(.1,.24)*W;
    const sides=n===2?[0,1]:pick([[0,1,0],[0,1,1]]);
    sides.forEach((s,i)=>{
      const extra=sides.slice(0,i).filter(v=>v===s).length*W*.07;
      const stand=s?Math.min(W-cw*3,R+extra):Math.max(cw*3,L-extra);
      crowd.push(person(s?W+E+i*cw*3:-E-i*cw*3,s?-1:1,{side:s,stand,fight:1,end}));
    });
  }else{
    // đi dạo ngang qua, đi cùng chiều thành nhóm nhỏ
    const dir=Math.random()<.5?1:-1,base=clamp(W/12,45,110)*rnd(.75,1.05);
    // đi ở làn gần hơn: thấp hơn trên màn hình, to hơn, đi nhanh hơn một chút
    const z=FLAT||Math.random()<.4?0:rnd(.25,.9);
    for(let i=0;i<n;i++)crowd.push(person(dir>0?-E-i*cw*rnd(2.5,5):W+E+i*cw*rnd(2.5,5),dir,{sp:base*rnd(.96,1.04)*(1+z*.4),z:z?clamp(z+rnd(-.08,.08),0,1):0}));
  }
}
// nhóm hát mừng (?carol=1 để xem thử ngay)
let nextCarol=0,carolNotes=[];
const CAROL_TEST=QS.get('carol');
function spawnCarol(t){
  const n=3+(Math.random()<.5?1:0),from=Math.random()<.5?-1:1,gap=cw*5,sp=clamp(W/12,45,110)*.9;
  const x0=geo.cx-gap*(n-1)/2;let far=0;
  for(let i=0;i<n;i++){
    const stand=x0+gap*i,start=from<0?-cw*4-(n-1-i)*gap:W+cw*4+i*gap;
    far=Math.max(far,Math.abs(stand-start)/sp);
    crowd.push(person(start,-from,{carol:1,stand,sp,exit:from}));
  }
  const end=t+far+rnd(13,16);
  for(const p of crowd)if(p.carol&&!p.end)p.end=end;
}

/* ---------- chú chó con chạy lăng xăng ---------- */
let dog=null;
function dogPick(t){
  const d=dog,S=geo.snowman,r=cw*9;
  const roll=Math.random(),walkers=crowd.filter(p=>!p.fight&&!p.fled&&(p.state==='walk'||p.state==='sing'));
  if(roll<.35&&S&&!S.melt){d.mode='circle';d.legs=4;d.tx=S.x+(d.x<S.x?r:-r)}
  else if(roll<.65&&walkers.length){d.mode='follow';d.who=pick(walkers);d.until=t+rnd(5,8)}
  else{d.mode='go';d.tx=rnd(.06,.94)*W}
}
function bark(t){dog.barkT=t;sfx('bark',dog.x)}
function drawDog(t,dt){
  if(reduce||t<T.greet+3)return;
  if(!dog)dog={x:-cw*6,tx:W*.3,dir:1,mode:'go',until:0,barkT:-9,sitT:0};
  const d=dog,run=clamp(W/6,80,200);
  // chọn việc tiếp theo
  if(sK>.25){if(d.mode!=='hide'){d.mode='hide';d.tx=geo.cx-cw*6}}
  else if(d.mode==='hide')d.mode='sit',d.sitT=t+1;
  if(balls.length&&d.mode!=='ball'&&d.mode!=='hide'){d.mode='ball';d.ball=balls[balls.length-1];d.tx=d.ball.tx}
  if(d.mode==='follow'){
    const w=d.who;
    if(!crowd.includes(w)||t>d.until||w.x<0||w.x>W)d.mode='sit',d.sitT=t+rnd(.8,1.6);
    else d.tx=w.x-(w.state==='sing'?cw*3:w.dir*cw*4);
  }
  let moving=false;
  if(d.mode==='sit'){if(t>d.sitT)dogPick(t)}
  else{
    const dx=d.tx-d.x,sp=d.mode==='follow'?run*.8:run;
    if(Math.abs(dx)>cw*.6){d.dir=Math.sign(dx);d.x+=d.dir*Math.min(Math.abs(dx),sp*dt);moving=true}
    else if(d.mode==='circle'&&d.legs>1){d.legs--;const S=geo.snowman;d.tx=S.x+(d.x<S.x?cw*9:-cw*9)}
    else if(d.mode==='ball'){if(!balls.includes(d.ball)){bark(t);d.mode='sit';d.sitT=t+rnd(1,2)}}
    else if(d.mode==='hide'){}
    else if(d.mode!=='follow'){if(Math.random()<.4)bark(t);d.mode='sit';d.sitT=t+rnd(1,3)}
  }
  // vẽ: thân và đầu ở hàng trên, chân ở hàng dưới; lật theo hướng chạy
  const f=Math.floor(t/.12)%2,feet=groundTop(d.x)+ch*.55,hop=d.mode==='ball'&&!moving?-Math.abs(Math.sin(t*9))*ch*.5:0;
  const shiver=d.mode==='hide'&&sK>0?Math.sin(t*60)*.8:0;
  let body=(moving||Math.sin(t*14)>0?'~':'-')+'==o',legs=moving?(f?'/  \\':' /\\ '):' ,,';
  if(d.dir<0){const flip=s=>[...s].reverse().map(c=>c==='/'?'\\':c==='\\'?'/':c).join('');body=flip(body);legs=flip(legs)}
  ctx.globalAlpha=1;ctx.textAlign='left';
  // chó chạy theo ai thì đi cùng làn với người đó
  const zt=d.mode==='follow'&&d.who?d.who.z||0:0;d.z=(d.z||0)+(zt-(d.z||0))*Math.min(1,dt*2);
  const sc=(1+d.z*.6)*FIG;
  ctx.save();ctx.translate(d.x+shiver,feet+d.z*(geo.bottom-groundTop(d.x))*.55);ctx.scale(sc,sc);
  ctx.fillStyle='#d39a5c';ctx.fillText(body,-2*cw,-ch+hop);
  ctx.fillStyle='#a8743f';ctx.fillText(legs,-2*cw,hop);
  if(t-d.barkT<.9){ctx.globalAlpha=1-(t-d.barkT)/.9;ctx.fillStyle='#ffe9b0';ctx.textAlign='center';ctx.fillText('gâu!',d.dir*cw*2,-ch*2.4-(t-d.barkT)*ch);ctx.textAlign='left';ctx.globalAlpha=1}
  ctx.restore();
}

function throwBall(p,q,t,y0o){
  p.throwT=t;if(p.state)p.face=q.x<p.x?-1:1;
  const sm=q===geo.snowman;
  const x0=p.x+p.face*cw*1.2,y0=y0o??groundTop(p.x)+ch*.55-ch*2.6,hit=Math.random()<.7;
  const tx=hit?q.x:q.x+(Math.random()<.5?-1:1)*rnd(2,6)*cw,ty=hit?(sm?q.c2:groundTop(q.x)+ch*.55-ch*1.6):groundTop(tx)+ch*.5;
  const dx=Math.abs(tx-x0);
  balls.push({x0,y0,tx,ty,t0:t,dur:clamp(dx/(W*.55),.6,1.3),hgt:clamp(dx*.22,ch*3,H*.12),q:hit?q:null});
  sfx('throw',x0);
}
function drawPerson(p,t){
  const moving=p.state==='walk'||p.state==='leave',f=Math.floor((t+p.ph)/.2)%2,feet=groundTop(p.x)+ch*.55,bob=moving&&f?-1:0;
  const hit=t-p.hitT<.6,thr=t-p.throwT<.3,windup=!moving&&p.nextThrow>t&&p.nextThrow-t<.4;
  let arms='/|\\',head='o',x=p.x;
  if(hit){arms='\\|/';head='O';x+=Math.sin((t-p.hitT)*40)*cw*.15}
  else if(thr)arms=p.face>0?'\\|-':'-|/';
  else if(windup)arms=p.face>0?'\\|_':'_|/';
  else if(p.fled)arms='\\|/';
  else if(p.state==='sing'){arms='[|]';head=Math.floor(t*2.5+p.ph*3)%2?'O':'o'}
  else if(p.state==='opening')arms='-|-';
  else if(p.state==='cheer')arms=f?'\\|/':'_|_';
  else if(!moving)arms='/|\\';
  const legs=moving?(f?'/ \\':' | '):'/ \\';
  const z=p.z||0,sc=(1+z*.6)*FIG,zy=z*(geo.bottom-groundTop(p.x))*.55;
  if(moving&&f!==p.lastF){
    p.lastF=f;stepSnd(p.x,z);const pr=geo.prints;pr.push({x:p.x+(f?cw*.35:-cw*.35)*sc,y:groundTop(p.x)+ch*.85+zy+ch*.3*z,t0:t,s:sc});
    if(pr.length>400)pr.splice(0,pr.length-400);
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(x,feet+zy);ctx.scale(sc,sc);
  [[p.hat,p.hatC],[head,'#f2c79b'],[arms,p.coat],[legs,'#8a95b0']].forEach(([s,col],i)=>{ctx.fillStyle=col;ctx.fillText(s,-s.length*cw/2,-(3-i)*ch+bob)});
  ctx.restore();
}
function drawCrowd(t,dt){
  if(reduce)return;
  // hộp quà nằm đó 10 giây không ai mở: một người chạy ra mở giùm
  const G=geo.gift;
  if(G&&G.landT&&G.n===0&&!G.open&&!G.gone&&!G.drop&&!paper&&t-G.landT>10){
    G.landT=0;
    crowd.push(person(W+cw*4,-1,{runner:1,sp:clamp(W/5,100,240),stand:Math.min(W-cw*2,G.x1+cw*1.4)}));
  }
  // nhóm hát mừng: thỉnh thoảng 3–4 người đứng thành hàng trước cây
  if(!nextCarol)nextCarol=CAROL_TEST?T.greet+2:T.walkIn+rnd(20,35);
  if(!sK&&t>nextCarol&&!crowd.some(p=>p.fight||p.carol)){spawnCarol(t);nextCarol=Infinity}
  if(sK>0){}
  else if(!crowd.some(p=>!p.runner)&&!balls.length){
    if(nextCrowd===Infinity)nextCrowd=t+rnd(3,7);
    else if(t>nextCrowd){spawnCrowd(t);nextCrowd=Infinity}
  }
  // trong lúc đang ném tuyết, thỉnh thoảng có thêm người đi ngang xem
  else if(t>T.greet&&!crowd.some(p=>!p.fight&&!p.runner&&!p.carol)&&crowd.some(p=>p.fight)&&Math.random()<dt*.15)spawnCrowd(t,true);
  ctx.textAlign='left';
  for(let i=crowd.length-1;i>=0;i--){
    const p=crowd[i];
    // bão tuyết: ai cũng che đầu chạy về
    if(sK>.25&&!p.fled&&p.state!=='opening'){
      p.fled=1;p.state='leave';p.dir=p.face=p.x<W/2?-1:1;p.sp=Math.max(p.sp,clamp(W/6,90,200));
    }
    if(p.state==='walk'){
      p.x+=p.dir*p.sp*dt;
      if(p.runner&&p.x<=p.stand){p.x=p.stand;p.state='opening';p.st=t}
      if(p.carol&&(p.dir>0?p.x>=p.stand:p.x<=p.stand)){p.x=p.stand;p.state='sing'}
      if(p.fight&&(p.dir>0?p.x>=p.stand:p.x<=p.stand)){p.x=p.stand;p.state='fight';p.face=p.side?-1:1;p.nextThrow=t+rnd(.5,1.8)}
    }else if(p.state==='fight'){
      if(t>p.end&&t-p.throwT>.4){p.state='leave';p.dir=p.face=p.side?1:-1}
      else if(t>p.nextThrow){
        const foes=crowd.filter(q=>q.fight&&q.side!==p.side&&q.state==='fight');
        const S=geo.snowman;
        // thỉnh thoảng ném "trả đũa" người tuyết
        if(S&&!S.melt&&t>geo.walker.tb1&&Math.random()<.3)throwBall(p,S,t);
        else if(foes.length)throwBall(p,pick(foes),t);
        p.nextThrow=t+rnd(1.1,2.4);
      }
    }else if(p.state==='opening'){
      if(t-p.st>.5){if(!G.open&&!G.gone&&!G.drop&&!paper)openGift(true);p.state='cheer';p.st=t}
    }else if(p.state==='cheer'){
      if(t-p.st>2){p.state='leave';p.dir=p.face=1;p.sp*=.5}
    }else if(p.state==='sing'){
      if(t>p.end){p.state='leave';p.dir=p.face=p.exit}
      else if(Math.random()<dt*1.1)carolNotes.push({x:p.x+rnd(-cw,cw),y:groundTop(p.x)-ch*3.6,t0:t,ch:pick('♪♫♪'),dx:rnd(-14,14)});
    }else p.x+=p.dir*p.sp*1.15*dt;
    const gone=p.dir>0?p.x>W+cw*8:p.x<-cw*8;
    if(gone&&(p.state==='leave'||(!p.fight&&!p.carol&&!p.runner))){crowd.splice(i,1);continue}
  }
  // người ở làn xa vẽ trước, làn gần vẽ sau đè lên
  for(const p of crowd.slice().sort((a,b)=>(a.z||0)-(b.z||0)))drawPerson(p,t);
  const wasCarol=carolOn;
  carolOn=crowd.some(p=>p.carol&&p.state==='sing');
  if(wasCarol&&!carolOn&&nextCarol===Infinity)nextCarol=t+rnd(45,75);
  if(nextCarol===Infinity&&!crowd.some(p=>p.carol))nextCarol=t+rnd(45,75);
  // nốt nhạc bay lên từ nhóm hát
  if(carolNotes.length){
    ctx.font=`${Math.round(fs*1.5)}px ${FONT}`;ctx.fillStyle='#ffd98a';
    for(let i=carolNotes.length-1;i>=0;i--){
      const n=carolNotes[i],e=t-n.t0;if(e>2.6){carolNotes.splice(i,1);continue}
      ctx.globalAlpha=Math.min(1,e*3)*(1-e/2.6);
      ctx.fillText(n.ch,n.x+Math.sin(e*3+n.dx)*cw*.6+n.dx*e,n.y-e*ch*2.2);
    }
    ctx.font=`${fs}px ${FONT}`;ctx.globalAlpha=1;
  }
  drawDog(t,dt);
  // quả cầu tuyết bay theo đường vòng cung, vỡ tung khi trúng
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i],u=(t-b.t0)/b.dur;
    if(u>=1){
      balls.splice(i,1);
      if(b.q){b.q.hitT=t;if(b.q===geo.snowman&&!b.q.melt){sfx('oi',b.tx);if(Math.random()<.4)b.q.say={txt:pick(['Á!','Ui!','Lạnh quá!']),t0:t}}}
      for(let k=0;k<9;k++)bits.push({x:b.tx,y:b.ty,vx:rnd(-70,70),vy:rnd(-110,-30),ch:pick('*.0'),col:'hsl(205,40%,94%)',age:0,life:rnd(.5,1)});
      sfx('splat',b.tx);continue;
    }
    const at=v=>[b.x0+(b.tx-b.x0)*v,b.y0+(b.ty-b.y0)*v-Math.sin(Math.PI*v)*b.hgt];
    ctx.fillStyle='hsl(205,40%,92%)';
    for(let k=3;k>=1;k--){const v=u-k*.035;if(v<0)continue;const [x,y]=at(v);ctx.globalAlpha=.5-k*.13;ctx.fillText('.',x-cw/2,y)}
    const [x,y]=at(u);ctx.globalAlpha=1;ctx.fillStyle='#f4f8ff';ctx.fillText('0',x-cw/2,y);
  }
}

/* ---------- pháo hoa: chùm tia sao lấp lánh ---------- */
const TAU=Math.PI*2;
const bursts=[];
let santa=null,nextSanta=10;
// mỗi quả pháo có một kiểu nổ và một độ xa: xa thì nhỏ, mờ, tiếng nổ đến trễ; gần thì to, sáng, vang ngay
const FWT=['peony','peony','willow','ring','cross','crackle','peony','willow','ring','cross','crackle'];
let smoke=[],fin=null,finNext=0,lastFinLaunch=0,charge=null;
const FIN_TEST=QS.get('finale');
function launch(x,ty,o={}){
  let type=o.type||(Math.random()<.08?'shape':pick(FWT));
  const z=o.z??(Math.random()<.4?rnd(.05,.35):rnd(.45,1));
  let hue=pick([0,45,50,200,210,140,45,0,330]),sat=Math.random()<.4?0:rnd(55,95);
  if(type==='willow'){hue=42;sat=rnd(70,95)}
  let shape=o.shape||null;
  if(type==='shape'&&!shape){
    const s=pick(['heart','star','tree','noel']);shape=s;
    if(s==='heart'){hue=350;sat=90}else if(s==='star'){hue=46;sat=100}else if(s==='tree'){hue=130;sat=80}else{hue=44;sat=60}
  }
  if(o.hue!==undefined){hue=o.hue;sat=o.sat??90}
  const x0=x+rnd(-.12,.12)*W,y0=lerp(geo.groundY-ch*2,H*rnd(.74,.84),z);
  const dur=rnd(.75,1.15)*(1-z*.15);
  fws.push({x0,y0,x:x0,y:y0,tx:x,ty,age:0,dur,hue,sat,z,type,pow:o.pow||0,shape,hist:[]});
  if(z>.3&&live())fwLaunch(x,.35+.65*z,dur,Math.random()<.28);
}
function lerp(a,b,k){return a+(b-a)*k}
// các điểm tạo hình (đơn vị: bán kính 1)
const SHAPES={};
function shapePts(name){
  if(SHAPES[name])return SHAPES[name];
  const P=[];
  if(name==='heart')for(let i=0;i<56;i++){const a=i/56*TAU,x=16*Math.sin(a)**3,y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));P.push([x/17,y/17])}
  else if(name==='star'){const V=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*TAU/10,r=i%2?.42:1;V.push([Math.cos(a)*r,Math.sin(a)*r])}
    for(let i=0;i<10;i++){const A=V[i],B=V[(i+1)%10];for(let k=0;k<6;k++)P.push([lerp(A[0],B[0],k/6),lerp(A[1],B[1],k/6)])}}
  else if(name==='tree'){
    const seg=(a,b,n)=>{for(let k=0;k<n;k++)P.push([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)])};
    seg([0,-1],[-.75,.6],14);seg([-.75,.6],[.75,.6],14);seg([.75,.6],[0,-1],14);
    seg([-.4,-.1],[.4,-.1],6);seg([.12,.6],[.12,.95],4);seg([-.12,.6],[-.12,.95],4);
  }else{
    // chữ NOEL lấy mẫu từ chữ vẽ sẵn
    const c=document.createElement('canvas');c.width=120;c.height=40;const g=c.getContext('2d');
    g.font='bold 34px Arial,sans-serif';g.textBaseline='middle';g.textAlign='center';g.fillStyle='#fff';g.fillText('NOEL',60,21);
    const d=g.getImageData(0,0,120,40).data;
    for(let y=0;y<40;y+=3)for(let x=0;x<120;x+=3)if(d[(y*120+x)*4+3]>128)P.push([(x-60)/60,(y-20)/60]);
  }
  return SHAPES[name]=P;
}
function explode(f){
  fwCount++;lastBoom=tNow;
  const z=f.z,sc=clamp(Math.min(W,H)/800,.6,1.5)*(.42+.78*z)*(1+f.pow*.9);
  const R=rnd(75,120)*sc,ps=[];
  const P=(dx,dy,dz,o={})=>{const k=o.k??2.2;ps.push(Object.assign({x:f.x,y:f.y,vx:dx*R*k,vy:dy*R*k,vz:dz,k,g:22*sc,life:rnd(1.5,2.1),age:0,seed:Math.random()*10|0,tw:rnd(0,7)},o))};
  let n=Math.round((f.type==='ring'?46:f.type==='cross'?26:f.type==='willow'?56:66)*(.7+.3*z)*(1+f.pow*.8));
  if(f.type==='ring'){
    const tilt=rnd(.2,1.2),rot=rnd(0,TAU);
    for(let i=0;i<n;i++){const a=i/n*TAU,x=Math.cos(a),y=Math.sin(a)*Math.cos(tilt),zz=Math.sin(a)*Math.sin(tilt);
      P(x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot),zz)}
    // lõi nhỏ ở giữa vòng
    for(let i=0;i<10;i++){const a=rnd(0,TAU),r=rnd(.05,.2);P(Math.cos(a)*r,Math.sin(a)*r,0,{life:1})}
  }else if(f.type==='shape'){
    const pts=Array.isArray(f.shape)?f.shape:shapePts(f.shape),S=Array.isArray(f.shape)?1:R*.95/R;
    for(const [x,y] of pts)P(x*S,y*S,0,{k:3,g:0,life:rnd(2,2.4),late:1});
  }else{
    for(let i=0;i<n;i++){
      // hướng ngẫu nhiên đều trên mặt cầu
      const u=rnd(-1,1),a=rnd(0,TAU),r=Math.sqrt(1-u*u),x=r*Math.cos(a),y=r*Math.sin(a);
      if(f.type==='willow')P(x,y,u,{k:1.7,g:46*sc,life:rnd(2.8,3.6),tail:4});
      else if(f.type==='cross')P(x,y,u,{life:.62,split:1});
      else if(f.type==='crackle')P(x,y,u,{life:rnd(1.4,1.8),crk:rnd(.5,.75)});
      else P(x,y,u);
    }
  }
  if(Array.isArray(f.shape)){for(const p of ps){p.vx=p.vx/R;p.vy=p.vy/R}} // hình anh vẽ: đúng kích thước nét vẽ

// lời chúc theo ngày: chờ Giáng Sinh → đêm Giáng Sinh → chờ Giao Thừa → mùng 1 Tết Dương lịch

  const X={title:'Merry Christmas',sub:'Giáng Sinh An Lành'};
  if(m===0&&d===1){

    return{kind:'nyday',title:'Happy New Year',sub:`Chúc Mừng Năm Mới ${y}`,text:'✦ Chúc mừng năm mới! ✦',dense:since<120?7:3,left:-1};
  }
  if(m===11&&d>=26){
    const ms=new Date(y+1,0,1)-now;
    return{kind:'ny',title:'Happy New Year',sub:`Chúc Mừng Năm Mới ${y+1}`,text:`còn ${fmt(ms)} nữa là đến Giao Thừa`,textS:`còn ${fmt(ms)} tới Giao Thừa`,dense:ms<60000?3:1,left:ms/1000};
  }

/* ---------- vòng lặp ---------- */
let prev=performance.now(),fpsS=60,fpsT=0;
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;

  // sao nền
  for(const s of stars){
    if(t<s.at)continue;
    const a=(0.25+0.55*(0.5+0.5*Math.sin(t*s.sp+s.ph)))*Math.min(1,(t-s.at)/1.2)*(s.md??1);

  }
  // tia lấp lánh lớn

  for(const s of sparkles){
    if(t<s.at)continue;
    const k=Math.pow(0.5+0.5*Math.sin(t*s.sp+s.ph),3),L=s.L*(0.5+k);
    ctx.globalAlpha=(0.25+0.6*k)*Math.min(1,(t-s.at)/1.5);

    const gr=ctx.createLinearGradient(s.x-L,0,s.x+L,0);

    ctx.fillStyle=gr;ctx.fillRect(s.x-L,s.y-.5,L*2,1);

    gv.addColorStop(0,'rgba(255,255,255,0)');gv.addColorStop(.5,'rgba(255,255,255,.9)');gv.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gv;ctx.fillRect(s.x-.5,s.y-L,1,L*2);
  }
  ctx.globalCompositeOperation='source-over';

  // trăng và mây trôi
  drawMoon(t);
  for(const c of clouds){
    if(!reduce)c.x+=c.v*dt;
    if(c.x>W+20)c.x=-c.w-rnd(0,200);
    // lúc mở trang mây trôi từ ngoài mép trái vào chỗ của mình
    const k=reduce?1:clamp((t-T.clouds)/c.in,0,1),e=easeOut(k);
    if(k<=0)continue;

    c.cxNow=cx;c.kNow=k;
    if(!c.bk)c.bk=bake(c.cells,0,0,c.w,c.h,q=>q.edge?.6:1,q=>`hsl(220,${q.edge?10:18}%,${q.l}%)`);
    ctx.globalAlpha=c.a*Math.min(1,k*2);ctx.drawImage(c.bk.img,cx+c.bk.ox,c.y+c.bk.oy,c.bk.w,c.bk.h);
  }
  ctx.globalAlpha=1;
  drawAurora(t);
  ctx.restore();
  // mây che trăng: trăng và ánh trăng trên cảnh tối đi
  {
    const m=geo.moon;let cov=0;
    if(m)for(const c of clouds){
      if(!c.kNow)continue;
      const ix=(m.x-c.cxNow)/c.w,iy=(m.y-c.y)/c.h;
      if(ix>.05&&ix<.95&&iy>.15&&iy<.9)cov=Math.max(cov,clamp(Math.min(ix-.05,.95-ix,iy-.15,.9-iy)*6,0,1)*c.a*1.5*Math.min(1,c.kNow*2));
    }

  }

  // sao băng: bấm trúng là gửi điều ước
  if(!meteor&&t>nextMeteor&&!reduce){
    const sc=clamp(W/1200,.6,1.3),dir=Math.random()<.5?-1:1;
    meteor={x:dir<0?rnd(.45,1)*W:rnd(0,.55)*W,y:rnd(.02,.22)*H,vx:dir*rnd(520,760)*sc,vy:rnd(170,260)*sc,age:0,life:rnd(1.2,1.6)};
    sfx('meteor',meteor.x);
  }
  if(meteor){
    const m=meteor;m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;

      ctx.strokeStyle=gr;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.lineWidth=1;
      ctx.globalAlpha=fade;ctx.drawImage(glow.white,m.x-12,m.y-12,24,24);
      ctx.fillStyle='#fff6d8';
      for(let j=1;j<6;j++){ctx.globalAlpha=fade*(1-j/6)*.8;ctx.fillText(DIG[(j*3+(t*20|0))%10],m.x-m.vx*.04*j-cw/2,m.y-m.vy*.04*j+fs*.35)}

  // đốm sao chữ thập lấp lánh
  for(let i=parts.length-1;i>=0;i--){

    if(p.age>p.life){parts.splice(i,1);continue}
    const k=1-p.age/p.life,drag=Math.pow(0.22,dt);
    p.vx*=drag;p.vy*=drag;p.vy+=10*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const tw=Math.pow(.5+.5*Math.sin(t*9+p.tw),2),s=p.sz*(.5+.7*tw);
    ctx.globalAlpha=k*(.25+.75*tw);ctx.fillStyle=`hsl(${p.hue},${p.sat}%,90%)`;
    ctx.fillRect(p.x-s,p.y-.5,s*2,1);ctx.fillRect(p.x-.5,p.y-s,1,s*2);
    if(tw>.85){ctx.globalAlpha=k*.5;ctx.drawImage(glow.white,p.x-s*2,p.y-s*2,s*4,s*4)}
  }
  ctx.globalCompositeOperation='source-over';

  // ông già Noel bay qua (vẽ sau cảnh, phía trước cây)
  const drawSanta=()=>{
  if(!santa&&t>nextSanta&&!reduce){
    // bay ngẫu nhiên: phải sang trái, trái sang phải, hoặc chao chéo từ trên cao xuống
    const E=clamp(Math.round(Math.min(W,H)*.045),22,44),v=clamp(W/9,90,190);
    const dir=Math.random()<.5?-1:1,diag=Math.random()<.4;
    const y0=diag?rnd(.02,.1)*H:rnd(.3,.44)*H;
    const vy=diag?Math.min(v*.45,(H*rnd(.38,.48)-y0)/((W+E*5)/v)):0;
    santa={x:dir<0?W+E:-E*.3,y:y0,v,vy,dir,E,trail:[]};
  }
  if(santa){
    const s=santa,E=s.E,D=s.dir;s.x+=D*s.v*dt;s.y+=s.vy*dt;
    const y=s.y+Math.sin(t*2.4)*E*.25;
    const onScr=D<0?s.x>-E*4:s.x<W+E*4;
    if(onScr)for(let j=0;j<2;j++)s.trail.push({x:s.x-D*(E*3.3+rnd(0,6)),y:y-E*.3+rnd(-E*.25,E*.25),age:0,life:rnd(.8,1.8),tw:rnd(0,7)});
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ffe7a0';
    for(let j=s.trail.length-1;j>=0;j--){
      const q=s.trail[j];q.age+=dt;q.y+=6*dt;
      if(q.age>q.life){s.trail.splice(j,1);continue}
      const k=1-q.age/q.life,tw=.5+.5*Math.sin(t*12+q.tw),z=1.5+2*tw;
      ctx.globalAlpha=k*(.3+.7*tw);ctx.fillRect(q.x-z,q.y-.5,z*2,1);ctx.fillRect(q.x-.5,q.y-z,1,z*2);
    }

    ctx.save();ctx.translate(s.x,y);ctx.rotate(D*Math.atan2(s.vy,s.v));if(D>0)ctx.scale(-1,1);
    ctx.globalAlpha=.55;ctx.drawImage(glow.red,-E*.05,-E*.75,E*.7,E*.7);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=.8;ctx.strokeStyle='#d9b45a';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(E*.6,-E*.45);ctx.quadraticCurveTo(E*1.6,-E*.1,E*2.6,-E*.55);ctx.stroke();
    ctx.globalAlpha=1;ctx.textAlign='left';
    ctx.font=`${E}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText('🦌',0,0);ctx.fillText('🦌',E*1.1,E*.06);
    ctx.fillText('🎅',E*2.35,-E*.3);ctx.fillText('🛷',E*2.2,E*.15);
    ctx.restore();
    ctx.font=`${fs}px ${FONT}`;
    if(!onScr&&!s.trail.length){santa=null;nextSanta=t+rnd(16,28)}
  }
  };

  // gió từ cú vuốt / rê chuột, tắt dần
  wind*=Math.pow(.25,dt);
  updateStorm(t,dt);
  const lean=reduce?0:clamp(wind/700,-1,1)*cw*1.6;

  // cảnh chữ số
  let rosesOpen=0,curCol='';
  const glows=[];
  smUpdate(t,dt);giftUpdate(t,dt);
  deco3D(t,dt);
  if(!geo.snowBk&&t>geo.snowEnd){
    geo.snowBk=bake(geo.snowC,0,0,W,H,()=>1,o=>o.col);geo.ridgeBk=bake(geo.ridgeC,0,0,W,H,()=>1,o=>o.col);
    for(const o of geo.snowC)o.bk=1;for(const o of geo.ridgeC)o.bk=1;
  }
  if(geo.snowBk){
    ctx.globalAlpha=1;
    let B=geo.ridgeBk;ctx.drawImage(B.img,B.ox-pX*.45,B.oy-pY*.2,B.w,B.h);
    B=geo.snowBk;ctx.drawImage(B.img,B.ox,B.oy,B.w,B.h);

  // đèn ở phía sau cây: chỉ thấy ánh sáng mờ lọt qua kẽ lá
  if(rot3&&rot3.back.length){
    ctx.globalCompositeOperation='lighter';
    for(const [L,bx,by,bc] of rot3.back){
      const o=gridMap.get(L.r*cols+Math.floor(bx/cw));if(!o||t<o.lightAt)continue;
      const on=musicSync?t-beat[L.grp]<.35:Math.sin(t*3+L.tw)>.1;if(!on)continue;
      const R=ch*2.6;ctx.globalAlpha=.16*(1-bc*.6);ctx.drawImage(glow[L.g],bx+lean*(1-o.u)-R/2,by-R/2,R,R);
    }
    ctx.globalCompositeOperation='source-over';
  }
  for(const o of cells){
    if(o.bk&&geo.snowBk)continue;
    if(o.smUnder){const s=geo.snowman,cv=o.coveredBy;if(t>cv.delay+.12&&!(s.melt&&t>s.melt+2.2))continue}
    if(o.hideAt!==undefined&&t>o.hideAt)continue;
    const p=(t-o.delay)/o.dur;
    if(p<0)continue;
    let x=o.x,y=o.y,c=o.ch,a=1;
    if(p<1){
      const e=easeOut(p);x=o.sx0+(o.x-o.sx0)*e;y=o.sy0+(o.y-o.sy0)*e;
      c=pick(DIG);a=0.35+0.65*p;
    }else if(Math.random()<0.0015&&o.type!=='star'&&o.type!=='rose'&&o.type!=='snowman'&&o.type!=='tree'&&o.type!=='hanger'&&!o.hl){o.ch=c=pick(DIG)}
    // cây rung khi được chạm: ngọn rung mạnh hơn gốc; gió làm cây nghiêng theo
    if(o.u!==undefined){
      if(t-shake<1.6){const e=t-shake;x+=Math.sin(e*30)*cw*.8*Math.exp(-e*3)*(1-o.u*.7)}
      x+=lean*(1-o.u);
    }
    if(o.type==='ridge'){x-=pX*.45;y-=pY*.2} // rặng thông xa lệch ít hơn trời, nhiều hơn cây

    let gcol=null;
    if(o.type==='gift'||o.type==='bow'){
      const G=geo.gift;

      if(G.drop){const k=clamp((t-G.drop)/G.dropDur,0,1);y-=(1-k*k)*G.dropH;x+=Math.sin(k*9)*cw*.35*(1-k)}

        if(lightMode===2){on=true;col=`hsl(${(t*140+o.x*.5+o.y)%360|0},95%,65%)`;g='white'}

        if(musicSync&&t>o.lightAt){

    let deco=null;

      if(o.dg!==b){o.dg=b;o.ch=DIG[hsh(b,o.r+77)*10|0];o.tv=o.pal[texV(b,o.r,o.nb)];o.gar=!o.e&&onGarland(o.y,ph)}

          col=`hsl(44,${95-gl*45|0}%,${50+k*14+gl*32|0}%)`;
        }else if(d.k==='H'){col='hsl(45,45%,50%)';c='\''}
        else if(d.k==='O'){
          const O=d.O,k=0.5+0.5*Math.sin(t*2.2+O.tw),C=ORNC[O.col];
          c=d.ctr?'8':'0';
          col=d.hl?`hsl(0,0%,${88+k*10|0}%)`:`hsl(${C[0]},${C[1]}%,${C[2]-10+k*22-(1-d.c)*16|0}%)`;
          if(d.ctr)glows.push([O.col,d.x,d.y,ch*2.4*(.6+.4*d.c),(.12+.2*k)*d.c]);
        }else{
          const L=d.L;let on,g=L.g;c=L.ch;
          on=lightMode===1?Math.sin(t*7-o.y*.06)>.3:Math.sin(t*3+L.tw)>.1;
          col={gold:'#ffd36b',white:'#ffffff',blue:'#7fb8ff',pink:'#ff8fd0',green:'#8dffb0'}[g];
          if(lightMode===2){on=true;col=`hsl(${(t*140+o.x*.5+o.y)%360|0},95%,65%)`;g='white'}
          const dep=.45+.55*d.c;
          if(musicSync){const pk=Math.max(0,1-(t-beat[L.grp])/.35);on=pk>0;if(on){a*=(.55+.45*pk)*dep;glows.push([g,x+cw/2,y-fs*.35,ch*(1.6+pk*1.8)*dep,(.18+.4*pk)*dep])}else a*=.25}
          else{a*=on?dep:.25;if(on)glows.push([g,x+cw/2,y-fs*.35,ch*1.8*dep,.35*dep])}

      }
    }
    if(o.type==='tree'&&p>=1&&!deco){
      // cây "thở": một làn sáng chạy từ gốc lên ngọn, chữ số đổi theo làn sóng

      else if(o.tint&&t>o.tint.src.lightAt&&lightOn(o.tint.src,t))col=o.tint.col; // đèn hắt màu xuống lá
      else if(o.moonEdge&&moonDim>.65)col=o.mcol;                                  // viền ánh trăng
    }
    if(gcol)col=gcol;
    if(o.type==='snowman'&&p>=1){
      const r=smLook(o,t,x,y,c,col,a);x=r[0];y=r[1];c=r[2];col=r[3];a=r[4];
    }
    if(o.cap&&p>=1){col='hsl(205,35%,93%)';c=o.capCh} // tuyết đọng trên cành
    if(col!==curCol){ctx.fillStyle=col;curCol=col}
    ctx.globalAlpha=a;
    ctx.fillText(c,x,y);
  }
  // lá rơi, tuyết rơi khỏi cành, pháo giấy từ hộp quà
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i];b.age+=dt;
    if(b.age>b.life){bits.splice(i,1);continue}
    if(b.petal){
      // cánh hoa rơi chậm, đung đưa, nằm lại trên tuyết
      const gt=groundTop(b.x)+ch*1.6;
      if(b.y<gt){b.x+=Math.sin(b.age*2.5+b.ph)*14*dt+wind*.1*dt;b.y+=16*dt}
    }else{
      if(b.conf)b.vx*=Math.pow(.4,dt);
      b.vy+=(b.conf?260:120)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
      const gt=groundTop(b.x)+ch*.6;
      if(!b.conf&&b.y>gt){b.y=gt;b.vx=0;b.vy=0}
    }
    ctx.globalAlpha=Math.min(1,(b.life-b.age)/.6);ctx.fillStyle=b.col;ctx.fillText(b.ch,b.x,b.y);
  }
  curCol='';
  // mặt tuyết: bóng phản chiếu, ánh trăng, ánh pháo hoa và ánh đèn
  {
    const g=geo,gy=(g.groundY+g.bottom)/2,gh=g.bottom-g.groundY;
    // dấu chân lõm trên tuyết, mờ dần sau khoảng 30 giây
    for(const p of g.prints){
      const a=.6*(1-(t-p.t0)/30);if(a<=0)continue;
      ctx.globalAlpha=a;ctx.fillStyle='#16203a';
      ctx.beginPath();ctx.ellipse(p.x,p.y,cw*.45*(p.s||1),ch*.16*(p.s||1),0,0,TAU);ctx.fill();
    }
    for(const o of refl){
      if(t<o.end||(o.hideAt!==undefined&&t>o.hideAt))continue;
      if(o.lid&&g.gift.open)continue;
      if(o.type==='snowman'&&g.snowman.melt)continue;
      if((o.type==='gift'||o.type==='bow')&&(g.gift.gone||g.gift.drop||g.gift.open))continue;
      const my=2*o.mb-o.y+ch*.55;if(my>g.bottom||my<o.mb)continue;
      ctx.globalAlpha=.16*(1-(my-o.mb)/(ch*4.5));if(ctx.globalAlpha<=0)continue;
      ctx.fillStyle=o.col;ctx.fillText(o.ch,o.x,my);
    }
    ctx.globalCompositeOperation='lighter';
    const ell=(x,rx,col,a)=>{
      ctx.save();ctx.translate(x,gy);ctx.scale(1,gh*.9/rx);
      const gr=ctx.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=a;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,rx,0,TAU);ctx.fill();ctx.restore();
    };
    // ánh vàng ấm từ cây hắt xuống tuyết quanh gốc, sau khi đèn sáng
    const wk2=clamp((t-T.lights)/2.5,0,1);
    if(wk2>0)ell(g.cx,g.HW*1.25,'rgba(255,196,110,1)',.13*wk2*(.9+.1*Math.sin(t*1.5)));
    const mk=clamp((t-T.moon)/3,0,1)*clamp((t-T.snow)/2,0,1);
    if(mk>0)ell(g.moonX,W*.13,'rgba(255,242,205,1)',.09*mk*moonDim);
    // đèn cây hắt một vùng sáng ấm xuống tuyết quanh gốc
    if(t>T.lights)ell(g.cx,Math.min(W*.2,g.HW*1.1),'rgba(255,185,100,1)',.075*Math.min(1,(t-T.lights)/2));
    for(const b of bursts)if(b.age<.8)ell(b.x,W*.17,`hsl(${b.hue},${Math.min(100,b.sat+30)|0}%,70%)`,.2*(1-b.age/.8));
    // đèn sáng in bóng mờ xuống tuyết
    for(const q of glows){
      const my=2*groundTop(q[1])-q[2];
      if(my<g.bottom&&my>g.groundY){ctx.globalAlpha=q[4]*.35;const R=q[3]*1.3;ctx.drawImage(glow[q[0]],q[1]-R/2,my-R/2,R,R)}
    }
    ctx.globalCompositeOperation='source-over';
  }
  for(const r of roses)if(t>r.end)rosesOpen++;
  // thỉnh thoảng một cánh hồng rơi xuống tuyết
  if(!reduce&&t>T.rose+4&&roses.length&&Math.random()<dt*.6){
    const r=pick(roses);
    if(t>r.end){const o=pick(r.cells);if(o&&o.type==='rose'&&!o.bud)bits.push({x:o.x,y:o.y,vx:0,vy:0,ch:pick('0689'),col:o.col,age:0,life:rnd(4,6),petal:1,ph:rnd(0,7)})}
  }
  drawSanta();ctx.textAlign='left';
  // người nhỏ: đi tới, đắp người tuyết, vẫy tay rồi đi về
  const wk=geo.walker;
  if(wk&&t>wk.t0&&t<wk.t3&&!reduce){
    let wx,ph;
    if(t<wk.t1){wx=wk.start+(t-wk.t0)*wk.sp;ph='walk'}
    else if(t<wk.tb1){wx=wk.stand;ph='build'}
    else if(t<wk.t2){wx=wk.stand;ph='wave'}
    else{wx=wk.stand-(t-wk.t2)*wk.sp;ph='walk'}
    const f=Math.floor(t/.2)%2,feet=groundTop(wx)+ch*.55,bob=ph==='walk'&&f?-1:0;
    const arms=ph==='build'?(f?'\\|/':'-|-'):ph==='wave'?(f?'\\|_':'_|_'):'/|\\';
    const fig=[[wk.hat||'^',wk.hatC||'#c8404b'],['o','#f2c79b'],[arms,wk.coat||'#7fb4e0'],[ph==='walk'?(f?'/ \\':' | '):'/ \\','#8a95b0']];
    // mỗi bước chân để lại một dấu trên tuyết
    if(ph==='walk'&&f!==wk.lastF){wk.lastF=f;stepSnd(wx,0);geo.prints.push({x:wx+(f?cw*.35:-cw*.35),y:groundTop(wx)+ch*.85,t0:t})}
    ctx.globalAlpha=1;
    ctx.save();ctx.translate(wx,feet);ctx.scale(FIG,FIG);
    fig.forEach(([s,col],i)=>{ctx.fillStyle=col;ctx.fillText(s,-s.length*cw/2,-(3-i)*ch+bob)});
    ctx.restore();
    if(ph==='build'&&Math.random()<dt*14)
      bits.push({x:geo.snowman.x+rnd(-ch*1.5,ch*1.5),y:geo.snowman.bottom-rnd(0,ch*4),vx:rnd(-40,40),vy:rnd(-80,-20),ch:pick('*.'),col:'hsl(205,40%,92%)',age:0,life:rnd(.5,1)});
  }
  drawCrowd(t,dt);
  smDraw(t);

  // quầng sáng
  ctx.globalCompositeOperation='lighter';
  for(const g of glows){ctx.globalAlpha=g[4];ctx.drawImage(glow[g[0]],g[1]-g[3]/2,g[2]-g[3]/2,g[3],g[3])}
  // hộp quà: lấp lánh mời bấm, sau khi mở thì toả sáng từ trong hộp
  const gf=geo.gift;
  if(gf&&t>T.gift+1.2&&!gf.gone&&!gf.drop){
    if(gf.open){const k=(.45+.25*Math.sin(t*3))*clamp(1-(t-gf.open-1.6)/1.2,0,1),R=(gf.x1-gf.x0)*1.5;ctx.globalAlpha=k;ctx.drawImage(glow.gold,gf.mx-R/2,gf.top-R/2,R,R)}
    else{const k=Math.pow(.5+.5*Math.sin(t*2.5),4),R=(gf.x1-gf.x0)*.9;ctx.globalAlpha=.5*k;ctx.drawImage(glow.gold,gf.mx-R/2,gf.top-ch*1.2-R/2,R,R)}
  }
  // ngôi sao: quầng sáng thở, tia sáng xoay chậm, đốm chữ thập lấp lánh quanh sao
  const sp=(t-T.star-.3)/1.2;
  if(sp>0){
    const k=Math.min(1,sp),pulse=.82+.18*Math.sin(t*3),sx=geo.sx,sy=geo.sy,SR=geo.SR;
    if(!geo.starPopped&&t>T.star+.6){geo.starPopped=1;sparkleAt(sx,sy,44,48);sfx('star')}
    let R=SR*6.5*pulse;ctx.globalAlpha=.6*k;ctx.drawImage(glow.gold,sx-R/2,sy-R/2,R,R);
    R=SR*2.4;ctx.globalAlpha=.55*k*pulse;ctx.drawImage(glow.white,sx-R/2,sy-R/2,R,R);
    ctx.lineWidth=1.2;
    const n=14,rot=t*.22;
    for(let i=0;i<n;i++){
      const a=rot+i/n*TAU,L=SR*(i%2?1.7:3.1)*(.8+.2*Math.sin(t*4+i*1.7));
      const ex=sx+Math.cos(a)*L,ey=sy+Math.sin(a)*L;
      const gr=ctx.createLinearGradient(sx,sy,ex,ey);
      gr.addColorStop(0,`rgba(255,238,175,${.75*k})`);gr.addColorStop(1,'rgba(255,238,175,0)');
      ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    }
    // tia chữ thập dài, nhấp nháy
    const L=SR*(3.2+.8*Math.sin(t*2.6));ctx.globalAlpha=.7*k;
    for(const [dx,dy] of[[1,0],[0,1]]){
      const gr=ctx.createLinearGradient(sx-dx*L,sy-dy*L,sx+dx*L,sy+dy*L);
      gr.addColorStop(0,'rgba(255,220,120,0)');gr.addColorStop(.5,'rgba(255,250,215,1)');gr.addColorStop(1,'rgba(255,220,120,0)');
      ctx.fillStyle=gr;dx?ctx.fillRect(sx-L,sy-1,L*2,2):ctx.fillRect(sx-1,sy-L,2,L*2);
    }
    for(const s of geo.starSp){
      const tw=Math.pow(Math.max(0,Math.sin(t*s.sp+s.ph)),6);if(tw<.05)continue;
      const x=sx+s.dx*SR,y=sy+s.dy*SR,l=s.L*tw*SR;
      ctx.globalAlpha=k*tw;ctx.fillStyle='#fff7d6';
      ctx.fillRect(x-l,y-.6,l*2,1.2);ctx.fillRect(x-.6,y-l,1.2,l*2);
      ctx.drawImage(glow.white,x-l*.7,y-l*.7,l*1.4,l*1.4);
    }

  }
  ctx.globalCompositeOperation='source-over';

  // tuyết rơi
  if(t>T.snow){
    ctx.fillStyle='#fff';
    let curL=-1;
    // mỗi lớp tuyết lệch một mức theo góc nhìn: xa lệch ngược, gần lệch xuôi
    const FPX=[-.4,.25,.9];let fox=0,foy=0;
    for(const f of flakes){
      if(f.L!==curL){curL=f.L;ctx.font=`${curL===2?Math.round(fs*1.7):curL===0?Math.max(7,Math.round(fs*.75)):fs}px ${FONT}`;
        ctx.fillStyle=curL===0?'#aebfe8':'#fff';fox=pX*FPX[curL];foy=pY*FPX[curL]*.6}
      if(!reduce){f.y+=f.v*dt;f.x+=Math.sin(t*f.sw+f.ph)*(10+f.L*8)*dt+wind*(.2+f.L*.25)*dt}
      if(f.y>H){f.y=-10;f.x=rnd(0,W)}
      if(f.x<-12)f.x=W+10;else if(f.x>W+12)f.x=-10;
      if(f.L===2){ctx.globalAlpha=f.a*.22*Math.min(1,(t-T.snow)/2);ctx.drawImage(glow.white,f.x+fox-fs*.3,f.y+foy-fs*1.5,fs*2.2,fs*2.2)}
      // bông tuyết lớp giữa chạm mép cành thì đọng lại
      if(t>T.lights&&f.L===1){
        const c=Math.floor(f.x/cw),r=Math.round(f.y/ch-.82);let hit=null;
        for(const dr of[0,1]){const o=gridMap.get((r+dr)*cols+c);if(o&&o.ledge&&!o.cap&&t>o.end){hit=o;break}}
        if(hit){hit.cap=true;hit.capCh=pick('08*.');f.y=-10;f.x=rnd(0,W);continue}
      }
      ctx.globalAlpha=f.a*Math.min(1,(t-T.snow)/2);ctx.fillText(f.ch,f.x+fox,f.y+foy);
    }
    ctx.font=`${fs}px ${FONT}`;
    // vài bông tuyết sát mắt: to, nhòe, bay nhanh, lệch nhiều nhất
    if(!reduce&&!FLAT){
      const ka=Math.min(1,(t-T.snow)/3);
      for(const b of bokeh){
        b.y+=b.v*dt;b.x+=(Math.sin(t*b.sw+b.ph)*22+wind*.5)*dt;
        if(b.y>H+b.z){b.y=-b.z;b.x=rnd(0,W)}
        if(b.x<-b.z)b.x=W+b.z;else if(b.x>W+b.z)b.x=-b.z;
        ctx.globalAlpha=b.a*ka;ctx.drawImage(glow.white,b.x+pX*1.6-b.z/2,b.y+pY-b.z/2,b.z,b.z);
      }
    }
    // càng xem lâu cây càng phủ tuyết
    // bão tuyết làm tuyết đọng dày nhanh hơn trên cây, hộp quà và người tuyết
    for(let n=sK>0?4:1;n>0;n--)
      if(t>T.lights+2&&ledges.length&&!reduce&&Math.random()<dt*(.5+sK*14)){const o=pick(ledges);if(t>o.end+2){o.cap=true;o.capCh=pick('08*.')}}

  }

  if(vignette){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H)}
  // lời chúc
  const gT=(t-T.greet)/1.5;
  if(gT>0){
    const a=Math.min(1,gT);
    const big=clamp(Math.round(Math.min(W/16,H/16)),20,54);

    // trên điện thoại lời chúc nằm dưới khung phát nhạc và nút âm thanh

    ctx.fillText(modeNow.title,W/2,base);

    {
      const tw=ctx.measureText(modeNow.title).width,x0=W/2-tw/2,sp=((t*.28)%1.5)-.25;
      ctx.save();ctx.shadowBlur=0;ctx.globalCompositeOperation='lighter';
      if(sp>-.1&&sp<1.1){
        const gx=ctx.createLinearGradient(x0,0,x0+tw,0),a1=clamp(sp,0,1),a0=clamp(sp-.07,0,a1),a2=clamp(sp+.07,a1,1);
        gx.addColorStop(0,'rgba(255,255,255,0)');gx.addColorStop(a0,'rgba(255,255,255,0)');
        gx.addColorStop(a1,`rgba(255,252,235,${.85*a})`);
        gx.addColorStop(a2,'rgba(255,255,255,0)');gx.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=gx;ctx.fillText(modeNow.title,W/2,base);
      }
      for(const s of geo.greetSp){
        const k=Math.pow(Math.max(0,Math.sin(t*s.sp+s.ph)),8);if(k<.05)continue;
        const x=x0+s.u*tw,y=base+s.v*big,l=big*.18*k;
        ctx.globalAlpha=a*k;ctx.fillStyle='#fff6d8';
        ctx.fillRect(x-l,y-.5,l*2,1);ctx.fillRect(x-.5,y-l,1,l*2);
      }
      ctx.restore();ctx.textAlign='center';
    }
    const sub=Math.max(16,Math.round(big*0.62)),sy=base+sub*1.15;
    ctx.font=`600 ${sub}px "Dancing Script",Georgia,serif`;
    ctx.shadowColor='rgba(255,110,150,.85)';ctx.shadowBlur=14;
    const g2=ctx.createLinearGradient(0,sy-sub,0,sy);
    g2.addColorStop(0,'#ffd6e0');g2.addColorStop(1,'#ff6b8a');
    ctx.fillStyle=g2;
    ctx.fillText(modeNow.sub,W/2,sy);
    ctx.shadowBlur=0;
    // đếm ngược
    const cd=modeNow;
    ctx.font=`${Math.max(10,Math.round(fs*1.05))}px ${FONT}`;
    ctx.fillStyle=cd.dense>1?'#ffd36b':'#e0c48a';ctx.globalAlpha=a;
    ctx.shadowColor='#000';ctx.shadowBlur=6;
    // điện thoại: câu ngắn gọn để không chạy sát mặt trăng
    ctx.fillText(W<=640&&cd.textS?cd.textS:cd.text,W/2,sy+Math.max(18,sub*.95));
    ctx.shadowBlur=0;
    ctx.textAlign='left';
  }
  // lời báo điều ước
  if(wish){
    const age=t-wish.t0;
    if(age>3.5)wish=null;
    else{
      const sz=clamp(Math.round(W/24),18,32);
      ctx.textAlign='center';ctx.font=`700 ${sz}px "Dancing Script",Georgia,serif`;
      ctx.globalAlpha=Math.min(1,age/.4)*Math.min(1,(3.5-age)/.8);
      ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=12;ctx.fillStyle='#ffe7a0';
      ctx.fillText('Điều ước của bạn đã được gửi ✨',W/2,H*.47);
      ctx.shadowBlur=0;ctx.textAlign='left';
    }
  }
  // 10 giây cuối trước Giao Thừa: số đếm ngược lớn giữa trời
  if(modeNow.kind==='ny'&&modeNow.left<=10&&modeNow.left>0){
    const n=Math.ceil(modeNow.left),fr=n-modeNow.left,sz=Math.round(Math.min(W,H)*.28);

    ctx.globalAlpha=.25+.75*(1-fr);ctx.shadowColor='rgba(255,200,90,.9)';ctx.shadowBlur=30;

    ctx.shadowBlur=0;ctx.textAlign='left';
  }
  ctx.globalAlpha=1;
  drawHints(t);drawTouchFx(t,dt);drawCharge(t);
  if(paper)drawPaper(t);
  ctx.globalAlpha=1;

  soundFrame(t);

  // HUD
  if(now-fpsT>200){
    fpsT=now;
    modeNow=getMode();
    $('timer').textContent='t '+(t<10?'0':'')+t.toFixed(2)+'s';
    $('iFw').textContent=fwCount;
    $('iRun').textContent=(t<T.greet?'building':'running')+' · '+Math.round(fpsS)+' fps';
  }
  requestAnimationFrame(frame);
}

function sus(f,t0,dur,vol,{type='sawtooth',det=0,lp=0,att=.06,rel=.3,dest=musicGain}={}){

    case 'celesta':tone(f,t0,1.2,.42,'triangle',M);tone(f*2,t0,.5,.14,'sine',M);break;                              // đàn chuông nhẹ
    case 'strings':sus(f,t0,dur*.92,.075,{det:7,lp:2200,att:.09,rel:.35});sus(f/2,t0,dur*.92,.03,{det:5,lp:1200,att:.12,rel:.35});break; // đàn dây êm

        tone(mf(36+root),T,bar*.95,.2*soft,'triangle',musicGain);tone(mf(48+root),T,.35,.06*soft,'sine',musicGain);
        for(const iv of c[1])sus(mf(60+(root+iv)%12),T,bar*.9,.016*soft,{det:6,lp:1100,att:.25,rel:.6});
      }

  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.035,n+1.3);

}
function chargeStop(fire){

function tone(f,t0,dur,vol,type='sine',dest=sfxGain,f1){

  o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05);

function choir(f,t0,dur){
  const g=AC.createGain(),end=t0+Math.max(.2,dur)+.2;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(1.1,t0+.09);
  g.gain.setValueAtTime(1.1,t0+Math.max(.1,dur*.85));g.gain.linearRampToValueAtTime(0,end);
  g.connect(musicGain);
  const src=AC.createGain();src.gain.value=.5;
  for(const [fq,q,v] of[[730,6,1],[1090,8,.55],[2440,10,.3]]){
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fq;bp.Q.value=q;
    const vg=AC.createGain();vg.gain.value=v;src.connect(bp);bp.connect(vg);vg.connect(g);
  }
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.2;lg.gain.value=14;lfo.connect(lg);
  for(const [mul,det] of[[.5,-9],[.5,8],[.25,0]]){
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f*mul;o.detune.value=det;lg.connect(o.detune);
    o.connect(src);o.start(t0);o.stop(end+.05);

    // chạm nhanh: pháo thường; chạm giữ: pháo to dần theo thời gian giữ
    const pow=clamp((tNow-drag.t0-.25)/1.2,0,1);chargeStop(pow>0);
    launch(drag.x0,Math.min(drag.y0,H*0.7),pow>0?{pow,z:.8+.2*pow}:{});
  }else if(drag.moved&&e.type==='pointerup'){
    // kéo vẽ một hình trên trời: pháo nổ thành đúng hình vừa vẽ
    const P=drag.pts;let len=0;for(let i=1;i<P.length;i++)len+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);
    if(len>120&&drag.y0<geo.groundY){
      const n=clamp(Math.round(len/9),24,90),out=[];let acc=0,j=1,step=len/n;
      out.push(P[0]);
      for(let i=1;i<P.length&&out.length<n;i++){
        let a=P[i-1],b=P[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
        while(acc+d>=step&&out.length<n){const k=(step-acc)/d;a=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];out.push(a);d=Math.hypot(b[0]-a[0],b[1]-a[1]);acc=0}
        acc+=d;
      }
      let cx=0,cy=0;for(const p of out){cx+=p[0];cy+=p[1]}cx/=out.length;cy/=out.length;
      launch(cx,Math.min(cy,H*.75),{type:'shape',shape:out.map(p=>[p[0]-cx,p[1]-cy]),z:.95,hue:pick([46,350,200,130,46]),sat:90});
    }
  }
  drag=null;
};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&paper&&!paper.close)paper.close=tNow;
  if(e.key==='r'||e.key==='R')setup();
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(setup,200)});
// tự ẩn giao diện khi không ai chạm hay rê chuột trong 10 giây
let lastInput=performance.now();
for(const ev of['pointerdown','pointermove','keydown','wheel','touchstart'])
  addEventListener(ev,()=>{lastInput=performance.now();if(document.body.classList.contains('idle'))document.body.classList.remove('idle')},{capture:true,passive:true});
setInterval(()=>{
  const idle=performance.now()-lastInput>10000&&!paper&&pEls.list.hidden&&tNow>T.greet+2;
  document.body.classList.toggle('idle',idle);
},500);
setup();requestAnimationFrame(frame);
})();
</script>
