<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cây Thông Chữ Số</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Một màn hình canvas đen, cảnh ASCII bằng chữ số, HUD kiểu terminal ở các góc */
:root{
  --bg:#000;
  --fg:#c9d1d9;
  --dim:#6b7280;
  --rose:#ff6b8a;
  --amber:#ffb347;
  --bar:#0b0d12;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;font:12px/1.5 var(--mono);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#timer{top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));color:var(--rose)}
#info{left:max(16px,env(safe-area-inset-left,0px));top:calc(34px + env(safe-area-inset-top,0px));color:var(--dim)}
#info b{color:var(--fg);font-weight:400}
#info .row{display:flex;gap:22px;flex-wrap:wrap}
#bar{left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;background:var(--bar);border-top:1px solid #1c2230;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:var(--dim)}
#bar .run{color:var(--amber)}
#hint{top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));color:#3d4555}
@media (max-width:820px){#hint{display:none}#info{display:none}}
/* lúc mới vào cả trang tối, chữ góc màn hình hiện sau */
.hud{animation:hudIn 1.5s ease 1.5s both}
@keyframes hudIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.hud{animation:none}}
</style>

<canvas id="c" aria-label="Cây thông Noel và hoa hồng dựng từ chữ số, pháo hoa trên bầu trời đêm"></canvas>
<div class="hud" id="hint">bấm trời: pháo hoa · chạm cây thông, hộp quà, sao băng, ông già Noel · phím R: dựng lại</div>
<div class="hud" id="timer">t 00.00s</div>
<div class="hud" id="info">
  <div style="color:var(--fg)">@noel.ascii</div>
  <div class="row"><span>hoa hồng nở <b id="iRose">0/0</b></span><span>pháo hoa <b id="iFw">0</b></span></div>
  <div>chữ số <b id="iDig">0</b></div>
</div>
<div class="hud" id="bar"><span>christmas_tree.js</span><span class="run" id="iRun">building · 60 fps</span></div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const DIG='0123456789';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=s=>s[Math.random()*s.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=p=>1-Math.pow(1-p,3);
const FONT='"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace';
// trình tự xuất hiện (giây): trời đen → sao, trăng, mây → tuyết dâng → thân cây → lá → đèn → ngôi sao → hoa hồng → lời chúc, pháo hoa → ông già Noel
const T={stars:.8,moon:1.2,clouds:.6,snow:1.5,trunk:4,leaf:5,lights:8.8,star:10.4,rose:11.6,gift:14.4,greet:15.2,fw:16,santa:18};
// lời nhắn trên tờ giấy (sửa nội dung ở đây)
const MSG={
  gift:{title:'Món quà nhỏ cho bạn',body:'Chúc bạn một mùa Giáng Sinh thật ấm áp, luôn có những người thương yêu ở bên, và một năm mới gặp thật nhiều may mắn, bình an và hạnh phúc.'},
  santa:{title:'Ho ho ho! Merry Christmas!',body:'Ông già Noel ghé qua gửi lời chúc: Giáng Sinh an lành, ấm áp bên gia đình. Mong mọi điều ước của bạn đều thành sự thật!'}
};

let W,H,dpr,fs,cw,ch,cols,rows,cells=[],stars=[],sparkles=[],flakes=[],fws=[],parts=[],roses=[];
let start=0,lastFw=0,fwCount=0,nextFw=0,greetT=0,geo={};
const glow={};

function makeGlow(color){
  const s=64,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,color);gr.addColorStop(.25,color.replace(/[\d.]+\)$/,'0.35)'));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;
}
glow.red=makeGlow('rgba(255,60,80,1)');glow.gold=makeGlow('rgba(255,200,80,1)');
glow.blue=makeGlow('rgba(90,160,255,1)');glow.pink=makeGlow('rgba(255,120,200,1)');
glow.white=makeGlow('rgba(255,255,255,1)');glow.green=makeGlow('rgba(120,255,160,1)');
glow.moon=makeGlow('rgba(255,236,190,1)');
let clouds=[];
let gridMap=new Map(),ledges=[],paper=null,meteor=null,nextMeteor=0,wish=null,shake=-9,lightMode=0,bits=[],tNow=0,xmasNow=false;
// mây dựng từ chữ số: hợp của vài khối tròn, lõi là số, mép là dấu chấm
function makeCloud(w,h){
  const blobs=[],n=Math.round(rnd(5,7));
  // hàng chân mây
  for(let i=0;i<n;i++){
    const u=i/(n-1),bump=Math.sin(u*Math.PI);
    blobs.push({x:(.14+.72*u)*w,y:h*(.74-.12*bump),r:h*(.2+.16*bump)*rnd(.9,1.1)});
  }
  // các cụm phồng phía trên
  const m=Math.round(rnd(2,4));
  for(let i=0;i<m;i++){
    const u=(i+.5)/m;
    blobs.push({x:(.25+.5*u+rnd(-.05,.05))*w,y:h*rnd(.4,.5),r:h*rnd(.26,.34)*(1-Math.abs(u-.5)*.6)});
  }
  const cells=[];
  for(let y=0;y<h;y+=ch)for(let x=0;x<w;x+=cw){
    let best=0;
    for(const b of blobs){const d=1-Math.hypot(x-b.x,(y-b.y)*1.15)/b.r;if(d>best)best=d}
    if(best<=0||y>h*.86)continue;
    if(best<.25&&Math.random()<.45)continue;
    const top=1-y/h,edge=best<.18;
    cells.push({x,y,ch:edge?pick('.:·'):pick('0689023'),l:edge?44:clamp(40+top*42+best*12,40,88),edge});
  }
  return cells;
}
function drawMoon(t){
  const m=geo.moon;if(!m)return;
  // trăng hiện dần và nhô lên nhẹ
  const k=clamp((t-T.moon)/3,0,1);if(k<=0)return;
  const my=m.y+(1-easeOut(k))*m.R*1.5;
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=(.4+.05*Math.sin(t*.8))*k;
  ctx.drawImage(glow.moon,m.x-m.R*4,my-m.R*4,m.R*8,m.R*8);
  ctx.globalCompositeOperation='source-over';
  let cur='';
  for(const c of m.cells){
    if(Math.random()<.003)c.ch=pick(c.dark?'0689':'8890');
    const col=`hsl(${c.dark?42:48},${c.dark?40:85}%,${c.l}%)`;
    if(col!==cur){ctx.fillStyle=col;cur=col}
    ctx.globalAlpha=k;ctx.fillText(c.ch,m.x+c.x,my+c.y);
  }
}
function buildMoonCells(m){
  m.cells=[];
  for(let y=-m.R;y<=m.R;y+=ch)for(let x=-m.R;x<=m.R;x+=cw){
    const cx=x+cw/2,cy=y-ch*.35,d=Math.hypot(cx,cy)/m.R;
    if(d>1)continue;
    let dark=false;
    for(const k of m.craters){if(Math.hypot(cx/m.R-Math.cos(k.a)*k.d,cy/m.R-Math.sin(k.a)*k.d)<k.r)dark=true}
    const lit=clamp(.6-(cx+cy)/(m.R*2.6),0,1);
    const l=dark?42+lit*14:clamp(60+lit*30-d*d*8,55,94);
    m.cells.push({x,y,ch:pick(dark?'0689':'8890'),l:Math.round(l),dark});
  }
}

/* ---------- hình học cảnh ---------- */
function inTree(x,y){
  const g=geo;
  if(y<g.treeTop||y>g.treeBot+g.TH*0.04)return 0;
  const dx=Math.abs(x-g.cx);
  for(let i=0;i<4;i++){
    const top=g.treeTop+i*g.TH*0.19, bot=g.treeTop+g.TH*(0.34+i*0.22);
    const hwMax=g.HW*(0.4+0.6*i/3);
    if(y<top)continue;
    const k=(y-top)/(bot-top);
    let hw=hwMax*Math.min(k,1)*(1+0.07*Math.sin(y*0.35+i));
    if(dx>hw)continue;
    const r=hw>0?dx/hw:0;
    const sag=g.TH*0.035*(1-r*r);
    if(y<=bot+sag)return 1;
  }
  return 0;
}
function inStar(x,y){
  const g=geo,dx=x-g.sx,dy=(y-g.sy);
  const d=Math.hypot(dx,dy);if(d>g.SR)return false;
  let a=Math.atan2(dy,dx)+Math.PI/2; // đỉnh hướng lên
  a=((a%(Math.PI*2/5))+Math.PI*2/5)%(Math.PI*2/5);
  const t=Math.abs(a-Math.PI/5)/(Math.PI/5); // 1 ở đỉnh, 0 ở hõm
  const rr=g.SR*(0.42+0.58*t);
  return d<=rr;
}
function groundTop(x){
  const g=geo,u=(x-g.cx)/W;
  return g.groundY - H*0.012*Math.exp(-u*u*14) + Math.sin(x*0.012)*H*0.005 + Math.sin(x*0.031+1.3)*H*0.003;
}

function buildScene(){
  const g=geo;
  g.cx=W/2;
  g.TH=Math.min(H*0.52,W*1.1);
  g.treeTop=H*0.29;
  g.treeBot=g.treeTop+g.TH;
  g.HW=Math.min(W*0.42,g.TH*0.48);
  g.SR=g.TH*0.09;
  g.sx=g.cx;g.sy=g.treeTop-g.SR*0.25;
  g.groundY=H*0.875;
  g.bottom=H-30;

  const map=new Map(),under=[];
  // ô tuyết bị cây, hoa, quà đè lên vẫn được giữ lại và chỉ ẩn đi khi thứ đè lên bắt đầu mọc,
  // nên nền tuyết luôn kín từ đầu
  const put=(c,r,o)=>{
    o.c=c;o.r=r;const k=r*cols+c,prev=map.get(k);
    if(prev&&prev.type.startsWith('snow')&&!o.type.startsWith('snow')){prev.coveredBy=o;o.snowBelow=prev;under.push(prev)}
    else if(prev&&prev.snowBelow){prev.snowBelow.coveredBy=o;o.snowBelow=prev.snowBelow}
    map.set(k,o);
  };

  // tuyết
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    const gt=groundTop(x);
    if(y<gt||y>g.bottom)continue;
    const depth=(y-gt)/(g.bottom-gt);
    if(y-gt<ch*1.2&&Math.random()<0.18)continue; // mép tuyết hơi lởm chởm
    const L=rnd(72,92)-depth*14, sp=Math.random()<0.04;
    put(c,r,{type:sp?'snowsp':'snow',ch:pick(sp?'*+':'08690860'),h:205,s:rnd(10,35),l:L,
      delay:T.snow+(1-depth)*1.2+rnd(0,.2),tw:rnd(0,7)});
  }
  // thân cây
  const tw=g.TH*0.05;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(Math.abs(x-g.cx)<tw&&y>g.treeBot-g.TH*0.06&&y<groundTop(x)+ch*1.5){
      const sh=(x-g.cx)/tw;
      const span=groundTop(x)+ch*1.5-(g.treeBot-g.TH*0.06);
      put(c,r,{type:'trunk',ch:pick('1|7|'),h:28,s:70,l:30+sh*-10+rnd(-4,4),delay:T.trunk+clamp((groundTop(x)+ch*1.5-y)/span,0,1)*1.0+rnd(0,.08)});
    }
  }
  // cây thông
  const orn=[];
  for(let i=0;i<Math.round(g.TH*g.HW/1400)+14;i++){
    for(let tries=0;tries<30;tries++){
      const x=g.cx+rnd(-g.HW,g.HW),y=rnd(g.treeTop+g.TH*0.12,g.treeBot);
      if(inTree(x,y)&&inTree(x+cw*2,y)&&inTree(x-cw*2,y)&&orn.every(o=>Math.hypot(o.x-x,(o.y-y)*1.4)>ch*3)){
        orn.push({x,y,col:pick(['red','red','gold','blue','pink','red']),ph:rnd(0,7)});break;
      }
    }
  }
  const ornCol={red:[352,90,55],gold:[45,100,58],blue:[212,95,62],pink:[325,90,66]};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(!inTree(x,y))continue;
    const dx=x-g.cx,u=(y-g.treeTop)/g.TH;
    const edge=!inTree(x+cw*1.2,y)||!inTree(x-cw*1.2,y)||!inTree(x,y+ch*1.1);
    const delay=T.leaf+(1-u)*3.4+rnd(0,.18);
    let o=null;
    for(const b of orn){
      if(Math.hypot(b.x-x,(b.y-y)*1.6)<ch*0.95){const k=ornCol[b.col];o={type:'orn',ch:pick('0896'),h:k[0],s:k[1],l:k[2],g:b.col,tw:b.ph,delay};break}
    }
    if(!o){
      const band=((y+dx*0.42)-g.treeTop)%(g.TH*0.17);
      if(band>=0&&band<ch*0.9&&!edge){
        o={type:'garland',ch:pick(DIG),h:44,s:95,l:rnd(55,68),delay,tw:rnd(0,7)};
      }else if(Math.random()<0.035&&!edge){
        o={type:'light',ch:pick('*+o'),g:pick(['gold','white','blue','pink','green']),h:0,s:0,l:0,tw:rnd(0,7),delay};
      }else{
        const shade=-dx/g.HW*7+(1-u)*-4;
        o={type:'tree',ch:pick(DIG),h:rnd(118,148),s:rnd(55,75),l:clamp((edge?40:24)+shade+rnd(-6,6),12,52),delay};
      }
    }
    // đèn, trang trí và dây kim tuyến: lúc đầu là lá xanh, sau đó mới sáng lên từ dưới lên
    o.u=u;
    o.lightAt=T.lights+(1-u)*1.3+rnd(0,.3);
    o.leaf=`hsl(${rnd(118,148)|0},65%,${edge?40:26}%)`;
    put(c,r,o);
  }
  // ngôi sao
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*cw,y=(r+.5)*ch;
    if(inStar(x,y)){
      const d=Math.hypot(x-g.sx,y-g.sy)/g.SR;
      put(c,r,{type:'star',u:0,ch:pick(d<.45?'8':'*'),h:48,s:100,l:72-d*18,delay:T.star+d*.4+rnd(0,.15),tw:rnd(0,7)});
    }
  }
  // hộp quà bằng chữ số, bên phải gốc cây
  {
    const gw=Math.max(cw*13,g.TH*0.19),gh=Math.max(ch*4.2,gw*0.6);
    const x0=g.cx+tw*2.2,x1=x0+gw,y1=groundTop(g.cx)+ch*1.1,y0=y1-gh,mx=(x0+x1)/2,my=(y0+y1)/2;
    g.gift={x0:x0-cw,x1:x1+cw,y0:y0-ch*2.4,top:y0,y1,mx,open:0};
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=(c+.5)*cw,y=(r+.5)*ch,rib=Math.abs(x-mx)<cw*.9;
      let o=null;
      if(x>x0&&x<x1&&y>y0&&y<y1){
        o=(rib||Math.abs(y-my)<ch*.55)?{type:'gift',ch:pick('8098'),h:46,s:95,l:62}
          :{type:'gift',ch:pick(DIG),h:354,s:88,l:clamp(54-(x-mx)/gw*14+rnd(-4,4),42,64)};
      }else if(x>x0-cw&&x<x1+cw&&y>y0-ch*1.15&&y<=y0){
        o=rib?{type:'gift',ch:pick('8098'),h:46,s:95,l:68,lid:1}:{type:'gift',ch:pick(DIG),h:354,s:90,l:62,lid:1};
      }else if(y>y0-ch*2.3&&y<=y0-ch*1.15){
        const ax=Math.abs(x-mx);
        if(ax<cw*.6||(ax>cw&&ax<cw*2.8))o={type:'bow',ch:ax<cw*.6?'@':pick('oO0'),h:46,s:100,l:64,lid:1,tw:rnd(0,7)};
      }
      if(o){o.delay=T.gift+clamp((y1-y)/(gh+ch*2.3),0,1)+rnd(0,.1);put(c,r,o)}
    }
  }
  // hoa hồng quanh gốc cây
  roses=[];
  const nR=W<600?8:14, spots=[];
  for(let i=0;i<nR;i++){
    for(let tries=0;tries<80;tries++){
      const side=i%2?1:-1;
      const spread=rnd(0.06,0.47)*W;
      const x=g.cx+side*spread;
      const gt=groundTop(x);
      const y=rnd(gt-ch*0.6,gt+(g.bottom-gt)*0.45);
      const persp=0.85+0.3*clamp((y-gt)/(g.bottom-gt),0,1);
      const rad=ch*rnd(1.7,2.2)*persp*(W<600?0.8:1);
      if(Math.abs(x-g.cx)<tw*1.5+rad*1.4)continue;
      if(x<rad*2||x>W-rad*2)continue;
      if(x>g.gift.x0-rad*1.8&&x<g.gift.x1+rad*1.8)continue; // chừa chỗ cho hộp quà
      if(spots.every(s=>Math.hypot(s.x-x,(s.y-y)*1.3)>s.rad+rad*1.9)){
        spots.push({x,y,rad,hue:pick([350,350,355,340,0,330]),i});break;
      }
    }
  }
  spots.sort((a,b)=>a.y-b.y);
  spots.forEach((s,k)=>{
    const d0=T.rose+k*0.2;
    const rose={cells:[],end:0};roses.push(rose);
    for(let r=Math.floor((s.y-s.rad*2.4)/ch);r<=Math.ceil((s.y+s.rad*2.4)/ch);r++){
      for(let c=Math.floor((s.x-s.rad*3)/cw);c<=Math.ceil((s.x+s.rad*3)/cw);c++){
        if(r<0||c<0||r>=rows||c>=cols)continue;
        const x=(c+.5)*cw,y=(r+.5)*ch,dx=x-s.x,dy=y-s.y;
        // đầu hoa
        const ex=dx/(s.rad*1.25),ey=dy/s.rad,d=Math.hypot(ex,ey);
        let o=null;
        if(d<=1){
          const ang=Math.atan2(ey,ex);
          const spiral=Math.sin(ang*1+d*11);
          const L=d>0.82?72:d<0.2?30:clamp(48+spiral*20-ey*8,24,76);
          o={type:'rose',ch:pick(d<0.3?'@&8':'0689'),h:s.hue,s:90,l:L};
        }else{
          // hai lá
          for(const sd of[-1,1]){
            const lx=dx-sd*s.rad*1.35,ly=dy-s.rad*0.75;
            const a=sd*0.5,rx=lx*Math.cos(a)+ly*Math.sin(a),ry=-lx*Math.sin(a)+ly*Math.cos(a);
            if((rx/(s.rad*1.05))**2+(ry/(s.rad*0.42))**2<=1){
              o={type:'leaf',ch:pick(DIG),h:rnd(115,140),s:65,l:rnd(26,42)+(-ry/s.rad)*8};
            }
          }
        }
        if(o){o.delay=d0+clamp((s.y+s.rad*1.3-y)/(s.rad*2.6),0,1)*1.1+rnd(0,.12);o.rose=rose;put(c,r,o);rose.cells.push(o)}
        else if(d<1.45){const k=r*cols+c,e=map.get(k);if(e&&e.type.startsWith('snow')){e.hideAt=d0;under.push(e);map.delete(k)}} // khoảng tối quanh bông hoa, chỉ mở ra khi hoa bắt đầu nở
      }
    }
  });

  for(const o of under)if(o.hideAt===undefined)o.hideAt=o.coveredBy.delay+.12;
  cells=[...map.values(),...under];
  for(const o of cells){
    o.x=o.c*cw;o.y=(o.r+0.82)*ch;
    o.dur=rnd(0.9,1.6);
    o.sx0=o.x+rnd(-.5,.5)*cw;o.sy0=o.y+ch*rnd(1.5,3.5);o.dur=rnd(.45,.8); // mọc / dâng từ dưới lên
    o.end=o.delay+o.dur;
    o.col=`hsl(${o.h|0},${o.s|0}%,${o.l|0}%)`;
    if(o.rose)o.rose.end=Math.max(o.rose.end,o.end);
  }
  // mép trên các tầng lá: chỗ tuyết rơi xuống sẽ đọng lại
  gridMap=map;ledges=[];
  const TT={tree:1,garland:1,orn:1,light:1,star:1};
  for(const o of cells){
    if(o.u===undefined||o.type==='star')continue;
    const up=map.get((o.r-1)*cols+o.c);
    if(!up||!TT[up.type]){o.ledge=true;ledges.push(o)}
  }
  // vẽ theo thứ tự để giảm đổi màu
  cells.sort((a,b)=>a.r-b.r);
  $('iDig').textContent=cells.length.toLocaleString('en-US');
}

function buildSky(){
  stars=[];const n=Math.round(W*H/2600);
  for(let i=0;i<n;i++){
    const y=rnd(0,H*0.82);
    stars.push({x:rnd(0,W),y,s:Math.random()<.12?1.6:0.9,ph:rnd(0,7),sp:rnd(.6,2.4),c:Math.random()<.18?pick(['+','.','*']):null,at:T.stars+rnd(0,4)});
  }
  sparkles=[];
  for(let i=0;i<7;i++)sparkles.push({x:rnd(0.05,0.95)*W,y:rnd(0.03,0.7)*H,L:rnd(14,34),ph:rnd(0,7),sp:rnd(.4,1),at:T.stars+rnd(1.5,5)});
  const R=clamp(Math.min(W,H)*0.075,32,88);
  geo.moon={x:W-Math.max(R*1.8,W*0.14),y:Math.max(R*1.9,H*0.17),R,
    craters:[{a:3.6,d:.38,r:.2},{a:.6,d:.45,r:.14},{a:2.2,d:.55,r:.12},{a:5.2,d:.2,r:.1},{a:1.4,d:.15,r:.09}]};
  buildMoonCells(geo.moon);
  clouds=[];
  const nc=W<600?3:5;
  for(let i=0;i<nc;i++){
    const w=rnd(.3,.42)*Math.max(W,700),h=Math.max(ch*9,w*rnd(.5,.58));
    clouds.push({cells:makeCloud(w,h),x:rnd(-w*.3,W-w*.7),y:rnd(.08,.3)*H-h/2,w,h,v:rnd(5,13),a:rnd(.4,.65),in:rnd(4,6.5)});
  }
  flakes=[];
  for(let i=0;i<Math.round(W/10);i++)flakes.push({x:rnd(0,W),y:rnd(-H,H),v:rnd(14,40),sw:rnd(.5,1.5),ph:rnd(0,7),ch:pick('*..·+'),a:rnd(.25,.7)});
}

function setup(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fs=clamp(Math.round(Math.min(H/68,W/70)),8,15);
  ctx.font=`${fs}px ${FONT}`;
  cw=ctx.measureText('0').width;ch=fs*1.12;
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
  buildScene();buildSky();
  fws=[];parts=[];bursts.length=0;fwCount=0;nextFw=T.fw;santa=null;nextSanta=T.santa;
  paper=null;meteor=null;nextMeteor=T.stars+7;wish=null;shake=-9;bits=[];
  try{document.fonts.load('700 40px "Dancing Script"','Giáng Sinh')}catch(e){}
  start=performance.now();
}

/* ---------- pháo hoa: chùm tia sao lấp lánh ---------- */
const TAU=Math.PI*2;
const bursts=[];
let santa=null,nextSanta=10;
function launch(x,ty){
  const hue=pick([0,45,50,200,210,280,330,0]);
  const sat=Math.random()<.45?0:rnd(55,95);
  const x0=x+rnd(-.3,.3)*H*0.5,y0=H*rnd(.62,.8);
  fws.push({x0,y0,x:x0,y:y0,tx:x,ty,age:0,dur:rnd(.7,1.1),hue,sat});
}
function explode(f){
  fwCount++;
  const sc=clamp(Math.min(W,H)/800,.6,1.5);
  const n=pick([8,10,12,12,16]),rot=rnd(0,TAU),R=rnd(60,120)*sc;
  const rays=[];
  for(let i=0;i<n;i++)rays.push({a:rot+i/n*TAU+rnd(-.04,.04),len:R*(i%2?rnd(.4,.65):rnd(.9,1.1))});
  bursts.push({x:f.x,y:f.y,age:0,life:rnd(1.6,2.3),rays,hue:f.hue,sat:f.sat,R,x0:f.x0,y0:f.y0});
  const m=Math.round(rnd(24,42));
  for(let i=0;i<m;i++){
    const a=rnd(0,TAU),v=rnd(.25,1)*R*1.1;
    parts.push({x:f.x,y:f.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rnd(1.4,2.8),tw:rnd(0,7),sz:rnd(2,4.5)*sc,hue:f.hue,sat:f.sat*.6});
  }
}

/* ---------- tương tác: tờ giấy, quà, sao băng, rung cây ---------- */
function countdown(){
  const now=new Date(),y=now.getFullYear();
  const eve=new Date(y,11,24),end=new Date(y,11,26);
  if(now>=eve&&now<end)return{xmas:true,text:'✦ Đêm nay là Giáng Sinh! ✦'};
  const target=now>=end?new Date(y+1,11,24):eve;
  const s=Math.floor((target-now)/1000),d=Math.floor(s/86400),p=n=>String(n).padStart(2,'0');
  return{xmas:false,text:`còn ${d} ngày ${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)} nữa là đến đêm Giáng Sinh 24/12`};
}
function wrap(text,maxW){
  const out=[];let cur='';
  for(const w of text.split(' ')){const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){out.push(cur);cur=w}else cur=tst}
  if(cur)out.push(cur);return out;
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,k=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;
  return Math.hypot(px-ax-k*dx,py-ay-k*dy);
}
function hitSanta(x,y){
  const s=santa;if(!s)return false;
  const E=s.E,yy=s.y+Math.sin(tNow*2.4)*E*.25;
  return x>s.x-E*.2&&x<s.x+E*3.4&&y>yy-E*1.3&&y<yy+E*.4;
}
function hitGift(x,y){const g=geo.gift;return g&&tNow>T.gift+1.2&&x>g.x0&&x<g.x1&&y>g.y0&&y<g.y1+ch*.5}
function hitMeteor(x,y){const m=meteor;return !!m&&segDist(x,y,m.x,m.y,m.x-m.vx*.22,m.y-m.vy*.22)<40}
function hitTree(x,y){return tNow>T.leaf+2&&inTree(x,y)}
function sparkleAt(x,y,n,hue){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(40,150);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rnd(.8,1.6),tw:rnd(0,7),sz:rnd(2,4),hue,sat:90})}
}
function openPaper(m,delay=0){paper={m,t0:tNow+delay,close:0,grid:null}}
function openGift(){
  const g=geo.gift;
  if(!g.open){
    g.open=tNow;
    for(let i=0;i<70;i++){
      const a=rnd(-Math.PI*.95,-Math.PI*.05),v=rnd(120,320);
      bits.push({x:g.mx,y:g.top,vx:Math.cos(a)*v,vy:Math.sin(a)*v,ch:pick(DIG),col:`hsl(${pick([0,45,120,200,320,280])},90%,65%)`,age:0,life:rnd(1.6,2.6),conf:1});
    }
    openPaper(MSG.gift,.8);
  }else openPaper(MSG.gift);
}
function shakeTree(){
  shake=tNow;lightMode=(lightMode+1)%3;
  const tc=cells.filter(o=>o.u!==undefined&&o.type!=='star'&&tNow>o.end);
  for(let i=0;i<14&&tc.length;i++){const o=pick(tc);bits.push({x:o.x,y:o.y,vx:rnd(-30,30),vy:rnd(-20,20),ch:pick(DIG),col:o.col,age:0,life:rnd(1.8,2.8)})}
  for(const o of ledges)if(o.cap&&Math.random()<.7){
    o.cap=false;
    if(Math.random()<.5)bits.push({x:o.x,y:o.y-ch*.3,vx:rnd(-25,25),vy:rnd(-30,0),ch:o.capCh,col:'hsl(205,35%,93%)',age:0,life:rnd(1.5,2.5)});
  }
}
// tờ giấy: nền dệt bằng chữ số, cuộn mở từ trên xuống, chữ viết tay
function drawPaper(t){
  const P=paper,age=t-P.t0;if(age<0)return;
  let k=easeOut(clamp(age/.7,0,1));
  if(P.close){const e=(t-P.close)/.35;if(e>=1){paper=null;return}k*=1-e}
  const PW=Math.min(W-32,540),pad=Math.max(22,PW*.08);
  const ts=clamp(Math.round(PW/14),22,38),bs=clamp(Math.round(PW/22),17,25);
  ctx.save();
  ctx.globalAlpha=.6*k;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.font=`600 ${bs}px "Dancing Script",Georgia,serif`;
  const lines=wrap(P.m.body,PW-pad*2);
  const PH=pad*2+ts*1.5+lines.length*bs*1.4+fs*2.6;
  const px=(W-PW)/2,py=(H-PH)/2,vis=PH*Math.min(1,k*1.15);
  if(!P.grid){P.grid=[];for(let i=0;i<5000;i++)P.grid.push(pick(DIG))}
  ctx.globalAlpha=k;
  ctx.beginPath();ctx.rect(px-12,py-ch,PW+24,vis+ch);ctx.clip();
  ctx.fillStyle='#efe3c4';ctx.fillRect(px,py,PW,PH);
  ctx.font=`${fs}px ${FONT}`;
  const c2=Math.floor(PW/cw),r2=Math.floor(PH/ch),ox=px+(PW-c2*cw)/2,oy=py+(PH-r2*ch)/2;
  let n=0;
  for(let r=0;r<r2;r++)for(let c=0;c<c2;c++){
    const edge=r===0||c===0||r===r2-1||c===c2-1;
    ctx.fillStyle=edge?'#b07a45':'#e2d1a8';ctx.fillText(P.grid[n++%5000],ox+c*cw,oy+(r+.82)*ch);
  }
  ctx.globalAlpha=clamp((age-.45)/.4,0,1)*k;ctx.textAlign='center';
  ctx.font=`700 ${ts}px "Dancing Script",Georgia,serif`;ctx.fillStyle='#9b1c2e';
  ctx.fillText(P.m.title,W/2,py+pad+ts);
  ctx.font=`600 ${bs}px "Dancing Script",Georgia,serif`;ctx.fillStyle='#4a2c16';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,py+pad+ts*1.5+(i+1)*bs*1.4));
  ctx.font=`${Math.max(10,Math.round(fs*.9))}px ${FONT}`;ctx.fillStyle='#9a7650';
  ctx.fillText('— chạm để đóng —',W/2,py+PH-pad*.6);
  ctx.restore();
  // hai lõi cuộn giấy
  ctx.save();ctx.globalAlpha=k;ctx.font=`${fs}px ${FONT}`;
  for(const yy of[py,py+vis]){
    const gr=ctx.createLinearGradient(0,yy-ch*.7,0,yy+ch*.7);
    gr.addColorStop(0,'#7a4c24');gr.addColorStop(.5,'#d9b27a');gr.addColorStop(1,'#6a4020');
    ctx.fillStyle=gr;ctx.fillRect(px-10,yy-ch*.7,PW+20,ch*1.4);
    ctx.fillStyle='#4e2e12';
    for(let x=px-6,i=0;x<px+PW+4;x+=cw,i++)ctx.fillText(DIG[i%10],x,yy+fs*.35);
  }
  ctx.restore();
}

/* ---------- vòng lặp ---------- */
let prev=performance.now(),fpsS=60,fpsT=0;
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  fpsS=fpsS*0.94+(1/Math.max(dt,1e-3))*0.06;
  const t=(now-start)/1000;tNow=t;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  ctx.font=`${fs}px ${FONT}`;

  // sao nền
  for(const s of stars){
    if(t<s.at)continue;
    const a=(0.25+0.55*(0.5+0.5*Math.sin(t*s.sp+s.ph)))*Math.min(1,(t-s.at)/1.2);
    ctx.globalAlpha=a;ctx.fillStyle='#dfe6ff';
    if(s.c){ctx.fillText(s.c,s.x,s.y)}else ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  // tia lấp lánh lớn
  ctx.globalCompositeOperation='lighter';
  for(const s of sparkles){
    if(t<s.at)continue;
    const k=Math.pow(0.5+0.5*Math.sin(t*s.sp+s.ph),3),L=s.L*(0.5+k);
    ctx.globalAlpha=(0.25+0.6*k)*Math.min(1,(t-s.at)/1.5);
    ctx.drawImage(glow.white,s.x-L*0.5,s.y-L*0.5,L,L);
    const gr=ctx.createLinearGradient(s.x-L,0,s.x+L,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;ctx.fillRect(s.x-L,s.y-.5,L*2,1);
    const gv=ctx.createLinearGradient(0,s.y-L,0,s.y+L);
    gv.addColorStop(0,'rgba(255,255,255,0)');gv.addColorStop(.5,'rgba(255,255,255,.9)');gv.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gv;ctx.fillRect(s.x-.5,s.y-L,1,L*2);
  }
  ctx.globalCompositeOperation='source-over';

  // trăng và mây trôi
  drawMoon(t);
  for(const c of clouds){
    if(!reduce)c.x+=c.v*dt;
    if(c.x>W+20)c.x=-c.w-rnd(0,200);
    // lúc mở trang mây trôi từ ngoài mép trái vào chỗ của mình
    const k=reduce?1:clamp((t-T.clouds)/c.in,0,1),e=easeOut(k);
    if(k<=0)continue;
    const cx=c.x-(1-e)*(c.x+c.w+40);
    let cur='';
    for(const q of c.cells){
      if(Math.random()<.002&&!q.edge)q.ch=pick('0689023');
      const col=`hsl(220,${q.edge?10:18}%,${q.l}%)`;
      if(col!==cur){ctx.fillStyle=col;cur=col}
      ctx.globalAlpha=c.a*(q.edge?.6:1)*Math.min(1,k*2);ctx.fillText(q.ch,cx+q.x,c.y+q.y);
    }
  }
  ctx.globalAlpha=1;

  // sao băng: bấm trúng là gửi điều ước
  if(!meteor&&t>nextMeteor&&!reduce){
    const sc=clamp(W/1200,.6,1.3),dir=Math.random()<.5?-1:1;
    meteor={x:dir<0?rnd(.45,1)*W:rnd(0,.55)*W,y:rnd(.02,.22)*H,vx:dir*rnd(520,760)*sc,vy:rnd(170,260)*sc,age:0,life:rnd(1.2,1.6)};
  }
  if(meteor){
    const m=meteor;m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;
    const k=m.age/m.life;
    if(k>=1){meteor=null;nextMeteor=t+rnd(7,14)}
    else{
      const fade=Math.sin(Math.PI*k),tx=m.x-m.vx*.22,ty=m.y-m.vy*.22;
      ctx.globalCompositeOperation='lighter';
      const gr=ctx.createLinearGradient(m.x,m.y,tx,ty);
      gr.addColorStop(0,`rgba(255,250,230,${fade})`);gr.addColorStop(1,'rgba(255,250,230,0)');
      ctx.strokeStyle=gr;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.lineWidth=1;
      ctx.globalAlpha=fade;ctx.drawImage(glow.white,m.x-12,m.y-12,24,24);
      ctx.fillStyle='#fff6d8';
      for(let j=1;j<6;j++){ctx.globalAlpha=fade*(1-j/6)*.8;ctx.fillText(DIG[(j*3+(t*20|0))%10],m.x-m.vx*.04*j-cw/2,m.y-m.vy*.04*j+fs*.35)}
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }
  }

  // pháo hoa (sau cây, trên trời); đêm Giáng Sinh bắn dày gấp ba
  if(t>nextFw&&!reduce){
    launch(rnd(.08,.92)*W,rnd(.07,.38)*H);
    if(Math.random()<.35)launch(rnd(.08,.92)*W,rnd(.07,.38)*H);
    nextFw=t+rnd(.5,1.4)/(xmasNow?3:1);
  }
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=1;
  // pháo đang bay lên: vệt đứt nét
  for(let i=fws.length-1;i>=0;i--){
    const f=fws[i];f.age+=dt;
    const p=Math.min(1,f.age/f.dur),e=easeOut(p);
    f.x=f.x0+(f.tx-f.x0)*e;f.y=f.y0+(f.ty-f.y0)*e;
    ctx.setLineDash([3,6]);ctx.globalAlpha=.45;ctx.strokeStyle=`hsl(${f.hue},${f.sat}%,90%)`;
    ctx.beginPath();ctx.moveTo(f.x0,f.y0);ctx.lineTo(f.x,f.y);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(f.x-1,f.y-1,2,2);
    ctx.drawImage(glow.white,f.x-8,f.y-8,16,16);
    if(p>=1){explode(f);fws.splice(i,1)}
  }
  // chùm tia sao
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.age+=dt;const k=b.age/b.life;
    if(k>=1){bursts.splice(i,1);continue}
    const grow=easeOut(Math.min(1,b.age/.35)),fade=Math.pow(1-k,1.3),tw=.7+.3*Math.sin(b.age*26+b.x);
    const col=`hsla(${b.hue},${b.sat}%,92%,`;
    if(b.age<1){
      ctx.setLineDash([3,6]);ctx.globalAlpha=1;ctx.strokeStyle=col+(.35*(1-b.age))+')';
      ctx.beginPath();ctx.moveTo(b.x0,b.y0);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.globalAlpha=1;ctx.lineWidth=1.2;
    for(const r of b.rays){
      const L=r.len*grow*(1+.2*k),ex=b.x+Math.cos(r.a)*L,ey=b.y+Math.sin(r.a)*L;
      const gr=ctx.createLinearGradient(b.x,b.y,ex,ey);
      gr.addColorStop(0,col+(fade*tw)+')');gr.addColorStop(1,col+'0)');
      ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
    }
    ctx.lineWidth=1;
    const G=b.R*.8*(.6+.4*tw);ctx.globalAlpha=fade*.85;ctx.drawImage(glow.white,b.x-G/2,b.y-G/2,G,G);
    ctx.globalAlpha=fade;ctx.fillStyle='#fff';ctx.fillRect(b.x-1.5,b.y-1.5,3,3);
  }
  // đốm sao chữ thập lấp lánh
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.age+=dt;
    if(p.age>p.life){parts.splice(i,1);continue}
    const k=1-p.age/p.life,drag=Math.pow(0.22,dt);
    p.vx*=drag;p.vy*=drag;p.vy+=10*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const tw=Math.pow(.5+.5*Math.sin(t*9+p.tw),2),s=p.sz*(.5+.7*tw);
    ctx.globalAlpha=k*(.25+.75*tw);ctx.fillStyle=`hsl(${p.hue},${p.sat}%,90%)`;
    ctx.fillRect(p.x-s,p.y-.5,s*2,1);ctx.fillRect(p.x-.5,p.y-s,1,s*2);
    if(tw>.85){ctx.globalAlpha=k*.5;ctx.drawImage(glow.white,p.x-s*2,p.y-s*2,s*4,s*4)}
  }
  ctx.globalCompositeOperation='source-over';

  // ông già Noel bay qua (vẽ sau cảnh, phía trước cây)
  const drawSanta=()=>{
  if(!santa&&t>nextSanta&&!reduce){
    const E=clamp(Math.round(fs*2.4),22,44);
    santa={x:W+E,y:rnd(.3,.44)*H,v:clamp(W/9,90,190),E,trail:[]};
  }
  if(santa){
    const s=santa,E=s.E;s.x-=s.v*dt;
    const y=s.y+Math.sin(t*2.4)*E*.25;
    if(s.x>-E*4)for(let j=0;j<2;j++)s.trail.push({x:s.x+E*3.3+rnd(0,6),y:y-E*.3+rnd(-E*.25,E*.25),age:0,life:rnd(.8,1.8),tw:rnd(0,7)});
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ffe7a0';
    for(let j=s.trail.length-1;j>=0;j--){
      const q=s.trail[j];q.age+=dt;q.y+=6*dt;
      if(q.age>q.life){s.trail.splice(j,1);continue}
      const k=1-q.age/q.life,tw=.5+.5*Math.sin(t*12+q.tw),z=1.5+2*tw;
      ctx.globalAlpha=k*(.3+.7*tw);ctx.fillRect(q.x-z,q.y-.5,z*2,1);ctx.fillRect(q.x-.5,q.y-z,1,z*2);
    }
    ctx.globalAlpha=.55;ctx.drawImage(glow.red,s.x-E*.05,y-E*.75,E*.7,E*.7);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=.8;ctx.strokeStyle='#d9b45a';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(s.x+E*.6,y-E*.45);ctx.quadraticCurveTo(s.x+E*1.6,y-E*.1,s.x+E*2.6,y-E*.55);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font=`${E}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText('🦌',s.x,y);ctx.fillText('🦌',s.x+E*1.1,y+E*.06);
    ctx.fillText('🎅',s.x+E*2.35,y-E*.3);ctx.fillText('🛷',s.x+E*2.2,y+E*.15);
    ctx.font=`${fs}px ${FONT}`;
    if(s.x<-E*4&&!s.trail.length){santa=null;nextSanta=t+rnd(16,28)}
  }
  };

  // cảnh chữ số
  let rosesOpen=0,curCol='';
  const glows=[];
  for(const o of cells){
    if(o.hideAt!==undefined&&t>o.hideAt)continue;
    const p=(t-o.delay)/o.dur;
    if(p<0)continue;
    let x=o.x,y=o.y,c=o.ch,a=1;
    if(p<1){
      const e=easeOut(p);x=o.sx0+(o.x-o.sx0)*e;y=o.sy0+(o.y-o.sy0)*e;
      c=pick(DIG);a=0.35+0.65*p;
    }else if(Math.random()<0.0015&&o.type!=='star'&&o.type!=='rose'){o.ch=c=pick(DIG)}
    // cây rung khi được chạm: ngọn rung mạnh hơn gốc
    if(o.u!==undefined&&t-shake<1.6){const e=t-shake;x+=Math.sin(e*30)*cw*.8*Math.exp(-e*3)*(1-o.u*.7)}
    // nắp và nơ hộp quà bay lên khi mở
    if(o.lid&&geo.gift.open){
      const e=t-geo.gift.open;if(e>1.2)continue;
      const k=easeOut(Math.min(1,e/.8));y-=k*ch*5;x+=(o.x-geo.gift.mx)*k*.6;a*=1-e/1.2;
    }
    let col=o.col;
    const unlit=(o.type==='orn'||o.type==='light'||o.type==='garland')&&t<o.lightAt;
    if(unlit)col=o.leaf;
    else switch(o.type){
      case 'orn':{const k=0.5+0.5*Math.sin(t*2.2+o.tw);col=`hsl(${o.h},${o.s}%,${o.l-10+k*22}%)`;if(p>=1)glows.push([o.g,x+cw/2,y-fs*.35,ch*2.4,.18+.3*k]);break}
      case 'light':{
        // 3 kiểu đèn, đổi mỗi lần chạm cây: nhấp nháy ngẫu nhiên, chạy từ trên xuống, đổi màu cầu vồng
        let on,g=o.g;
        if(lightMode===1)on=Math.sin(t*7-o.y*.06)>.3;
        else on=Math.sin(t*3+o.tw)>.1;
        col={gold:'#ffd36b',white:'#ffffff',blue:'#7fb8ff',pink:'#ff8fd0',green:'#8dffb0'}[o.g];
        if(lightMode===2){on=true;col=`hsl(${(t*140+o.x*.5+o.y)%360|0},95%,65%)`;g='white'}
        a*=on?1:.25;if(on&&p>=1)glows.push([g,x+cw/2,y-fs*.35,ch*1.8,.35]);break}
      case 'bow':{const k=.5+.5*Math.sin(t*4+o.tw);col=`hsl(46,100%,${55+k*25|0}%)`;break}
      case 'garland':{const k=0.5+0.5*Math.sin(t*4-o.y*0.05+o.tw*0.2);col=`hsl(44,95%,${48+k*26}%)`;break}
      case 'snowsp':{const k=Math.pow(0.5+0.5*Math.sin(t*2.5+o.tw),6);col=`hsl(200,60%,${70+k*30}%)`;a*=.5+.5*k;break}
      case 'star':{const k=0.5+0.5*Math.sin(t*3+o.tw);col=`hsl(${46+k*8},100%,${62+k*20}%)`;break}
    }
    if(o.cap&&p>=1){col='hsl(205,35%,93%)';c=o.capCh} // tuyết đọng trên cành
    if(col!==curCol){ctx.fillStyle=col;curCol=col}
    ctx.globalAlpha=a;
    ctx.fillText(c,x,y);
  }
  // lá rơi, tuyết rơi khỏi cành, pháo giấy từ hộp quà
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i];b.age+=dt;
    if(b.age>b.life){bits.splice(i,1);continue}
    if(b.conf)b.vx*=Math.pow(.4,dt);
    b.vy+=(b.conf?260:120)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    const gt=groundTop(b.x)+ch*.6;
    if(!b.conf&&b.y>gt){b.y=gt;b.vx=0;b.vy=0}
    ctx.globalAlpha=Math.min(1,(b.life-b.age)/.6);ctx.fillStyle=b.col;ctx.fillText(b.ch,b.x,b.y);
  }
  curCol='';
  for(const r of roses)if(t>r.end)rosesOpen++;
  drawSanta();ctx.textAlign='left';

  // quầng sáng
  ctx.globalCompositeOperation='lighter';
  for(const g of glows){ctx.globalAlpha=g[4];ctx.drawImage(glow[g[0]],g[1]-g[3]/2,g[2]-g[3]/2,g[3],g[3])}
  // hộp quà: lấp lánh mời bấm, sau khi mở thì toả sáng từ trong hộp
  const gf=geo.gift;
  if(gf&&t>T.gift+1.2){
    if(gf.open){const k=.45+.25*Math.sin(t*3),R=(gf.x1-gf.x0)*1.5;ctx.globalAlpha=k;ctx.drawImage(glow.gold,gf.mx-R/2,gf.top-R/2,R,R)}
    else{const k=Math.pow(.5+.5*Math.sin(t*2.5),4),R=(gf.x1-gf.x0)*.9;ctx.globalAlpha=.5*k;ctx.drawImage(glow.gold,gf.mx-R/2,gf.top-ch*1.2-R/2,R,R)}
  }
  const sp=(t-T.star-.3)/1.2;
  if(sp>0){
    const k=Math.min(1,sp)*(0.75+0.25*Math.sin(t*3));
    const R=geo.SR*5.5;ctx.globalAlpha=0.55*k;
    ctx.drawImage(glow.gold,geo.sx-R/2,geo.sy-R/2,R,R);
    // tia sao
    const L=geo.SR*(2.2+0.6*Math.sin(t*2));ctx.globalAlpha=.5*k;
    for(const [dx,dy] of[[1,0],[0,1]]){
      const gr=ctx.createLinearGradient(geo.sx-dx*L,geo.sy-dy*L,geo.sx+dx*L,geo.sy+dy*L);
      gr.addColorStop(0,'rgba(255,220,120,0)');gr.addColorStop(.5,'rgba(255,240,180,1)');gr.addColorStop(1,'rgba(255,220,120,0)');
      ctx.fillStyle=gr;dx?ctx.fillRect(geo.sx-L,geo.sy-1,L*2,2):ctx.fillRect(geo.sx-1,geo.sy-L,2,L*2);
    }
  }
  ctx.globalCompositeOperation='source-over';

  // tuyết rơi
  if(t>T.snow){
    ctx.fillStyle='#fff';
    for(const f of flakes){
      if(!reduce){f.y+=f.v*dt;f.x+=Math.sin(t*f.sw+f.ph)*10*dt}
      if(f.y>H){f.y=-10;f.x=rnd(0,W)}
      // bông tuyết chạm mép cành thì đọng lại
      if(t>T.lights){
        const c=Math.floor(f.x/cw),r=Math.round(f.y/ch-.82);let hit=null;
        for(const dr of[0,1]){const o=gridMap.get((r+dr)*cols+c);if(o&&o.ledge&&!o.cap){hit=o;break}}
        if(hit){hit.cap=true;hit.capCh=pick('08*.');f.y=-10;f.x=rnd(0,W);continue}
      }
      ctx.globalAlpha=f.a*Math.min(1,(t-T.snow)/2);ctx.fillText(f.ch,f.x,f.y);
    }
    // càng xem lâu cây càng phủ tuyết
    if(t>T.lights+2&&ledges.length&&!reduce&&Math.random()<dt*1.5){const o=pick(ledges);o.cap=true;o.capCh=pick('08*.')}
  }

  // lời chúc
  const gT=(t-T.greet)/1.5;
  if(gT>0){
    const a=Math.min(1,gT);
    const big=clamp(Math.round(Math.min(W/16,H/16)),20,54);
    ctx.textAlign='center';
    const base=Math.max(big+22,H*0.08);
    ctx.font=`700 ${big}px "Dancing Script",Georgia,serif`;
    ctx.globalAlpha=a;
    ctx.shadowColor='rgba(255,190,90,.8)';ctx.shadowBlur=18;
    const gr=ctx.createLinearGradient(0,base-big,0,base);
    gr.addColorStop(0,'#fff3c8');gr.addColorStop(1,'#ffb347');
    ctx.fillStyle=gr;
    ctx.fillText('Merry Christmas',W/2,base);
    const sub=Math.max(16,Math.round(big*0.62)),sy=base+sub*1.15;
    ctx.font=`600 ${sub}px "Dancing Script",Georgia,serif`;
    ctx.shadowColor='rgba(255,110,150,.85)';ctx.shadowBlur=14;
    const g2=ctx.createLinearGradient(0,sy-sub,0,sy);
    g2.addColorStop(0,'#ffd6e0');g2.addColorStop(1,'#ff6b8a');
    ctx.fillStyle=g2;
    ctx.fillText('Giáng Sinh An Lành',W/2,sy);
    ctx.shadowBlur=0;
    // đếm ngược
    const cd=countdown();
    ctx.font=`${Math.max(10,Math.round(fs*1.05))}px ${FONT}`;
    ctx.fillStyle=cd.xmas?'#ffd36b':'#e0c48a';ctx.globalAlpha=a;
    ctx.shadowColor='#000';ctx.shadowBlur=6;
    ctx.fillText(cd.text,W/2,sy+Math.max(18,sub*.95));
    ctx.shadowBlur=0;
    ctx.textAlign='left';
  }
  // lời báo điều ước
  if(wish){
    const age=t-wish.t0;
    if(age>3.5)wish=null;
    else{
      const sz=clamp(Math.round(W/24),18,32);
      ctx.textAlign='center';ctx.font=`700 ${sz}px "Dancing Script",Georgia,serif`;
      ctx.globalAlpha=Math.min(1,age/.4)*Math.min(1,(3.5-age)/.8);
      ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=12;ctx.fillStyle='#ffe7a0';
      ctx.fillText('Điều ước của bạn đã được gửi ✨',W/2,H*.47);
      ctx.shadowBlur=0;ctx.textAlign='left';
    }
  }
  ctx.globalAlpha=1;
  if(paper)drawPaper(t);
  ctx.globalAlpha=1;

  // HUD
  if(now-fpsT>200){
    fpsT=now;
    xmasNow=countdown().xmas;
    $('timer').textContent='t '+(t<10?'0':'')+t.toFixed(2)+'s';
    $('iRose').textContent=rosesOpen+'/'+roses.length;
    $('iFw').textContent=fwCount;
    $('iRun').textContent=(t<T.greet?'building':'running')+' · '+Math.round(fpsS)+' fps';
  }
  requestAnimationFrame(frame);
}

cv.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  if(paper){if(tNow-paper.t0>.4&&!paper.close)paper.close=tNow;return}
  if(hitSanta(x,y)){sparkleAt(x,y,26,48);openPaper(MSG.santa,.15);return}
  if(hitMeteor(x,y)){sparkleAt(x,y,34,48);wish={t0:tNow};meteor=null;nextMeteor=tNow+rnd(7,14);return}
  if(hitGift(x,y)){openGift();return}
  if(hitTree(x,y)){shakeTree();return}
  launch(x,Math.min(y,H*0.7));
});
cv.addEventListener('pointermove',e=>{
  const x=e.clientX,y=e.clientY;
  cv.style.cursor=(paper||hitSanta(x,y)||hitMeteor(x,y)||hitGift(x,y)||hitTree(x,y))?'pointer':'crosshair';
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&paper&&!paper.close)paper.close=tNow;
  if(e.key==='r'||e.key==='R')setup();
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(setup,200)});
setup();requestAnimationFrame(frame);
})();
</script>
